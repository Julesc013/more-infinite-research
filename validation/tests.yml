{
  "schema": 2,
  "tests": [
    {
      "id": "docs.check",
      "kind": "static",
      "layer": "F0",
      "command": "./scripts/Invoke-MIRValidation.ps1 -DocsOnly",
      "requires_factorio": false,
      "inputs": [
        "docs/**",
        ".mir/docs.yml",
        "scripts/Invoke-MIRValidation.ps1"
      ]
    },
    {
      "id": "tooling.self-test",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/tooling/Test-MIRAssurance.ps1",
      "requires_factorio": false,
      "inputs": [
        "scripts/Invoke-MIRAssurance.ps1",
        "tools/lib/assurance/**",
        "validation/tests/tooling/Test-MIRAssurance.ps1",
        "validation/tests/compiler/Test-MIRNativeOwnerCostModels.ps1",
        "validation/tests/compiler/Test-MIRResearchCostModels.ps1",
        "tools/mir.ps1",
        "tools/mir_verify/**",
        ".mir/assurance.json",
        "validation/tests.yml",
        "validation/domains.yml",
        "validation/trust.json",
        ".mir/releases.json",
        "spec/schemas/**",
        "validation/profiles/**"
      ]
    },
    {
      "id": "static.architecture",
      "kind": "static",
      "layer": "F0",
      "command": "./scripts/Invoke-MIRValidation.ps1 -ArchitectureOnly",
      "requires_factorio": false,
      "inputs": [
        "prototypes/**",
        ".mir/modules.yml",
        ".mir/module-dependencies.json",
        "validation/tests/architecture/Test-MIRArchitecture.ps1"
      ]
    },
    {
      "id": "static.layout",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/tooling/Test-MIRLayout.ps1",
      "requires_factorio": false,
      "inputs": [
        ".mir/control/paths.yml",
        ".mir/control/aliases.yml",
        ".mir/control-plane/ownership.json",
        ".mir/modules.yml",
        "spec/architecture/repository-layout-v2.md",
        "spec/schemas/*layout*.schema.json",
        "spec/schemas/*path*.schema.json",
        "tools/mir.ps1",
        "tools/lib/workspace/**",
        "tools/commands/workspace/**",
        "validation/tests/tooling/Test-MIRLayout.ps1"
      ]
    },
    {
      "id": "static.compiler",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/compiler/Test-MIRCompiler.ps1",
      "requires_factorio": false,
      "inputs": [
        "prototypes/mir/**",
        ".mir/compiler-contract-coverage.yml",
        ".mir/technology-lifecycle.json",
        ".mir/module-dependencies.json",
        ".mir/technology-effect-targets.json",
        ".mir/technology-hard-gates.json",
        ".mir/technology-quality-profiles.json",
        ".mir/compiler-schema-authority.json",
        ".mir/public-artifact-budgets.json",
        "fixtures/assert-compiler-contracts/**",
        "validation/tests/compiler/Test-MIRCompiler.ps1",
        "validation/tests/architecture/Test-MIRModuleDependencies.ps1",
        "validation/tests/compiler/Test-MIRCompilerContractCoverage.ps1",
        "validation/tests/compiler/Test-MIRCompilerSchemaDrift.ps1"
        ,"scripts/Update-MIRCompilerAuthorities.ps1"
      ]
    },
    {
      "id": "static.compiler-preview",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/compiler/Test-MIRCompilerPreviewExport.ps1",
      "requires_factorio": false,
      "inputs": [
        ".mir/public-artifact-budgets.json",
        "scripts/Export-MIRCompilerPreview.ps1",
        "validation/tests/compiler/Test-MIRCompilerPreviewExport.ps1"
      ]
    },
    {
      "id": "static.settings",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/compiler/Test-MIRSettingsVisibility.ps1",
      "requires_factorio": false,
      "inputs": [
        "settings*.lua",
        "prototypes/mir/settings/**",
        "prototypes/streams/**",
        ".mir/settings.yml",
        "locale/**",
        "README.md",
        "docs/user/settings.md",
        "docs/reference/settings.md",
        "docs/maintainer/settings-governance.md",
        "scripts/Update-MIRREADMEStreamDefaults.ps1",
        "validation/tests/compiler/Test-MIRSettingsVisibility.ps1"
      ]
    },
    {
      "id": "static.locales",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/docs/Test-MIRLocales.ps1 -AllowMissingSupportedLanguages",
      "requires_factorio": false,
      "inputs": [
        ".mir/locales/**",
        "locale/**",
        "tools/lib/localization/**",
        "scripts/Update-MIRLocales.ps1",
        "validation/tests/docs/Test-MIRLocales.ps1",
        "prototypes/mir/settings/**",
        "prototypes/streams/**"
      ]
    },
    {
      "id": "static.balance",
      "kind": "static",
      "layer": "F0",
      "command": "./tools/mir.ps1 assurance balance",
      "requires_factorio": false,
      "inputs": [
        "balance-contract",
        ".mir/streams.yml",
        ".mir/settings.yml",
        ".mir/native-owner-cost-models.json"
      ]
    },
    {
      "id": "static.museum",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/runtime/Test-MIRMuseumCompiler.ps1",
      "requires_factorio": false,
      "inputs": [
        ".mir/canonical-lower-features.json",
        ".mir/museum-targets.json",
        "fixtures/museum/synthetic-installation/**",
        "tools/lib/museum/**",
        "scripts/Build-MIRMuseumTarget.ps1",
        "validation/tests/runtime/Test-MIRMuseumCompiler.ps1"
      ]
    },
    {
      "id": "runtime.museum-exact",
      "kind": "runtime",
      "layer": "F4",
      "command": "./validation/tests/runtime/Test-MIRMuseumExact.ps1",
      "requires_factorio": false,
      "inputs": [
        "museum-installations",
        ".mir/canonical-lower-features.json",
        ".mir/museum-targets.json",
        "tools/lib/museum/**",
        "scripts/Build-MIRMuseumTarget.ps1",
        "validation/tests/runtime/Test-MIRMuseumRuntime.ps1",
        "validation/tests/runtime/Test-MIRMuseumExact.ps1"
      ]
    },
    {
      "id": "static.package",
      "kind": "static",
      "layer": "F1",
      "command": "./validation/tests/package/Test-MIRDeterministicPackage.ps1",
      "requires_factorio": false,
      "inputs": [
        "scripts/Build-MIRPackage.ps1",
        "scripts/Measure-MIRPackageComposition.ps1",
        "validation/tests/package/Test-MIRPackageComposition.ps1",
        "tools/lib/validation/PackageIdentity.ps1",
        "info.json",
        "package-source"
      ]
    },
    {
      "id": "static.release-history",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/release/Test-MIRPublishedSnapshotIntegrity.ps1 -Index",
      "requires_factorio": false,
      "inputs": [
        "release-history",
        "validation/tests/release/Test-MIRPublishedSnapshotIntegrity.ps1"
      ]
    },
    {
      "id": "static.full",
      "kind": "static",
      "layer": "F0",
      "command": "./scripts/Invoke-MIRValidation.ps1 -StaticOnly",
      "requires_factorio": false,
      "inputs": [
        "repository",
        "test-catalog",
        "target-profile"
      ]
    },
    {
      "id": "performance.static",
      "kind": "static",
      "layer": "F0",
      "command": "./validation/tests/release/Test-MIRPerformanceBudgets.ps1 -ValidateManifestOnly",
      "requires_factorio": false,
      "inputs": [
        ".mir/performance.yml",
        ".mir/performance-budgets.json",
        ".mir/performance-campaign.json",
        ".mir/sanitation-budgets.json",
        "validation/scenarios/local-2.1.json",
        "fixtures/performance-regression-probe/**",
        "scripts/Invoke-MIRCompatAudit.ps1",
        "tools/lib/compatibility/**",
        "validation/tests/release/Test-MIRPerformanceBudgets.ps1",
        "validation/tests/release/Test-MIRPerformanceRegression.ps1",
        "scripts/Measure-MIRPerformanceRegression.ps1",
        "tools/lib/validation/PerformanceCampaign.ps1",
        "tools/lib/validation/ReleaseAttestations.ps1",
        "tools/lib/validation/SettingsOverrides.ps1",
        "prototypes/mir/report/compiler_telemetry.lua"
      ]
    },
    {
      "id": "release.approved-delta",
      "kind": "release-evidence",
      "layer": "F4",
      "command": "./validation/tests/release/Test-MIRApprovedDelta.ps1 -Candidate <candidate> -ExpectedSourceCommit <source-commit>",
      "requires_factorio": false,
      "inputs": [
        "candidate",
        "approved-delta-transition",
        "validation/tests/release/Test-MIRApprovedDelta.ps1",
        "validation/tests/release/Test-MIRApprovedPatchDelta.ps1",
        "tools/lib/validation/PackageIdentity.ps1"
      ]
    },
    {
      "id": "runtime.performance-regression",
      "kind": "runtime-evidence",
      "layer": "F4",
      "command": "./scripts/Invoke-MIRPerformanceQualification.ps1 -Candidate <candidate> -PriorRelease <prior-release> -FactorioBin <factorio> -ExpectedSourceCommit <source-commit> -ExpectedBaselineVersion <upgrade-from> -ExpectedFactorioVersion <qualification-factorio-version> -LocalModZipDir <mods> -OutputPath .mir/evidence/<upgrade-to>-performance-regression.json",
      "requires_factorio": true,
      "inputs": [
        "candidate",
        "prior-release",
        "factorio",
        "mod-closure",
        ".mir/performance.yml",
        ".mir/performance-budgets.json",
        ".mir/performance-campaign.json",
        ".mir/sanitation-budgets.json",
        "validation/scenarios/local-2.1.json",
        "fixtures/performance-regression-probe/**",
        "scripts/Invoke-MIRCompatAudit.ps1",
        "tools/lib/compatibility/**",
        "spec/schemas/runtime-performance-evidence.schema.json",
        "scripts/Invoke-MIRPerformanceQualification.ps1",
        "validation/tests/release/Test-MIRPerformanceRegression.ps1",
        "scripts/Measure-MIRPerformanceRegression.ps1",
        "tools/lib/validation/PerformanceCampaign.ps1",
        "tools/lib/validation/ReleaseAttestations.ps1",
        "tools/lib/validation/PackageIdentity.ps1",
        "tools/lib/validation/SettingsOverrides.ps1"
      ]
    },
    {
      "id": "manual.release-review",
      "kind": "manual-evidence",
      "layer": "F4",
      "command": "./validation/tests/release/Test-MIRManualReleaseReview.ps1 -Candidate <candidate> -FactorioBin <factorio> -ExpectedSourceCommit <package-source-commit> -ExpectedFactorioVersion <qualification-factorio-version>",
      "requires_factorio": true,
      "inputs": [
        "candidate",
        "factorio",
        "manual-review-attestation",
        "spec/schemas/manual-release-attestation.schema.json",
        "validation/tests/release/Test-MIRManualReleaseReview.ps1",
        "tools/lib/validation/ReleaseAttestations.ps1",
        "tools/lib/validation/PackageIdentity.ps1"
      ]
    },
    {
      "id": "runtime.affected",
      "kind": "matrix",
      "layer": "F3",
      "matrix": {
        "source": "scenario-registry",
        "selector": "affected"
      },
      "requires_factorio": true
    },
    {
      "id": "runtime.exact-zip",
      "kind": "matrix",
      "layer": "F2",
      "matrix": {
        "source": "scenario-registry",
        "selector": "smoke"
      },
      "requires_factorio": true
    },
    {
      "id": "runtime.full",
      "kind": "matrix",
      "layer": "F3",
      "matrix": {
        "source": "scenario-registry",
        "selector": "full"
      },
      "requires_factorio": true
    },
    {
      "id": "runtime.upgrade",
      "kind": "runtime",
      "layer": "F4",
      "command": "./validation/tests/runtime/Test-MIRUpgradeMatrix.ps1 -FactorioBin <factorio> -FromZip <prior-release> -ToZip <candidate> -FromVersion <upgrade-from> -ToVersion <upgrade-to> -FixtureName <upgrade-fixture> -OutputPath .work/artifacts/assurance/<upgrade-to>-upgrade-proof.json",
      "requires_factorio": true,
      "inputs": [
        "candidate",
        "prior-release",
        "factorio",
        "upgrade-fixture",
        "fixtures/upgrade-modset-source/**",
        "validation/tests/runtime/Test-MIRUpgradeMatrix.ps1",
        "spec/schemas/upgrade-matrix.schema.json",
        "scenario-harness",
        "settings"
      ]
    },
    {
      "id": "runtime.ecosystem",
      "kind": "runtime",
      "layer": "F4",
      "command": "./tools/mir.ps1 release gate --profile release-targeted-<target> --factorio <factorio> --candidate <candidate> --no-git-pull --skip-strict-gate --skip-build --skip-clean-git-status",
      "requires_factorio": true,
      "inputs": [
        "candidate",
        "factorio",
        "mod-lock",
        "ecosystem-profile",
        "scenario-harness",
        "runtime.full"
      ]
    },
    {
      "id": "seal.verify",
      "kind": "promotion",
      "layer": "F4",
      "command": "./tools/mir.ps1 assurance check-seal --seal <seal>",
      "requires_factorio": false,
      "inputs": [
        "candidate-seal",
        "candidate",
        "package-source",
        "test-catalog",
        "scenario-harness",
        "evidence"
      ]
    }
  ]
}
