name: Feature request
description: Suggest an improvement and tell us how you would use it.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What would you like MIR to do?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: How would this help you?
      description: Describe your use case or the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Examples, related mods or screenshots are welcome.
