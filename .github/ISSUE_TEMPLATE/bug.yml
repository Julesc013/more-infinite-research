name: Bug or mod compatibility problem
description: Tell us about a crash, loading failure, unexpected behavior, or problem with another mod.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Factorio and MIR versions
      description: Include the versions if you know them. "Not sure" is fine.
  - type: textarea
    id: mods
    attributes:
      label: Which other mods seem involved?
      description: Names or a mod list help; include versions if available.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce, if known
      description: Tell us what you were doing when it happened. It is okay if you cannot reproduce it.
  - type: textarea
    id: evidence
    attributes:
      label: Optional attachments
      description: Error text, screenshots, factorio-current.log, a settings export or a small save can help. Check attachments for personal information before posting.
