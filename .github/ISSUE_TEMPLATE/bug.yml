name: Bug or mod compatibility problem
description: Tell us about a crash, loading failure, unexpected behavior, or problem with another mod.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem once; you do not need to diagnose it or remove mods one by one.
        The optional [support collector](https://github.com/Julesc013/more-infinite-research/blob/dev/SUPPORT.md#collect-the-available-files-in-one-zip) gathers available logs and existing exports in one ZIP, even after a startup failure. It can also include exact settings and a save you select. Review attachments and use private sharing for personal inputs.
        We retain supplied evidence with the case and own investigation and verification.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Factorio and MIR versions
      description: Include the versions if you know them. "Not sure" is fine.
  - type: textarea
    id: mods
    attributes:
      label: Which other mods seem involved?
      description: Names or a mod list help; include versions if available.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce, if known
      description: Tell us what you were doing when it happened. It is okay if you cannot reproduce it.
  - type: textarea
    id: evidence
    attributes:
      label: Optional attachments
      description: A support ZIP, error text, screenshots or an existing file/link can help. If you already supplied a file in this report or a linked discussion, point us to it; there is no need to upload it again. Check attachments for personal information before posting.
