name: MIR 3 Terminal Promotion Check

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact terminal release to promote
        required: true
        type: choice
        options:
          - 3.2.9
          - 2.5.9
      candidate_sha:
        description: Exact immutable candidate commit from the allocation authority
        required: true
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  group: mir3-terminal-promotion-${{ inputs.release }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  promotion-verification:
    name: promotion-verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: validate
        name: Validate exact candidate, archive, acceptance, seals, and promotion boundary
        shell: pwsh
        run: |
          ./tools/commands/release/Test-MIR3TerminalPromotionCandidate.ps1 `
            -Release '${{ inputs.release }}' `
            -CandidateSha '${{ inputs.candidate_sha }}' `
            -OutputPath 'build/results/terminal-promotion/${{ inputs.release }}.json'
      - name: Preserve exact promotion verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir3-terminal-promotion-${{ inputs.release }}-${{ inputs.candidate_sha }}
          path: build/results/terminal-promotion/${{ inputs.release }}.json
          if-no-files-found: warn
      - name: Attach required verification context to the immutable candidate
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE: ${{ inputs.release }}
        with:
          script: |
            const passed = process.env.VALIDATION_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'verification-gate',
              head_sha: process.env.CANDIDATE_SHA,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              details_url: runUrl,
              output: {
                title: `MIR 3 ${process.env.RELEASE} terminal promotion verification`,
                summary: passed
                  ? 'The exact allocated candidate, archive, maintainer acceptance, target seal, family readiness, remote candidate ref, and fast-forward boundary passed the current package-excluded promotion controller.'
                  : 'Terminal promotion verification failed closed. Inspect the workflow evidence; branch promotion is forbidden.'
              }
            });
            if (!passed) core.setFailed('Terminal promotion verification did not pass.');

