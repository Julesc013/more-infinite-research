name: MIR Control Plane v5

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact immutable qualification-source commit"
        required: true
        type: string
      release:
        description: "Governed release record"
        required: true
        type: string
      target:
        description: "Factorio target"
        required: true
        type: string
      mode:
        description: "Verification freshness mode"
        required: true
        type: string
      prior_release:
        description: "Trusted-runner path to the exact prior release archive"
        required: true
        type: string
      local_mod_zip_dir:
        description: "Trusted-runner path to the governed local mod ZIP closure"
        required: false
        type: string
        default: ""
    secrets:
      FACTORIO_BIN:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact immutable qualification-source commit"
        required: true
        default: "29f81addc0eec9b571afd6428c9e3529c4497a1b"
      release:
        description: "Governed release record"
        required: true
        default: "3.2.2"
      target:
        description: "Factorio target"
        required: true
        type: choice
        options:
          - "2.0"
          - "2.1"
      mode:
        description: "Verification freshness mode"
        required: true
        type: choice
        default: "calibrate-fresh"
        options:
          - "calibrate-fresh"
          - "qualify-incremental"
      prior_release:
        description: "Trusted-runner path to the exact prior release archive"
        required: true
      local_mod_zip_dir:
        description: "Trusted-runner path to the governed local mod ZIP closure"
        required: false

permissions:
  contents: read

env:
  MIR_CP_TRUST_CLASS: ci
  MIR_PROTECTED_ENVIRONMENT: release-candidate
  MIR_TRUSTED_RUNNER: self-hosted-windows

jobs:
  context:
    name: verification-context
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    outputs:
      context_id: ${{ steps.export.outputs.context_id }}
      environments: ${{ steps.export.outputs.environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - name: Verify immutable source and package lock
        shell: pwsh
        env:
          MIR_CP_RELEASE: ${{ inputs.release }}
          MIR_CP_TARGET: ${{ inputs.target }}
          MIR_CP_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $record = Get-Content -Raw -LiteralPath ".mir/releases/records/$env:MIR_CP_RELEASE.json" | ConvertFrom-Json
          if ([string]$record.target -ne $env:MIR_CP_TARGET) { throw "Release target mismatch." }
          $expectedSource = [string]$record.package.source_commit
          if ($env:MIR_CP_TARGET -eq "2.0") {
            $proofRow = @($record.proofs.backport_reconstruction)
            if ($proofRow.Count -ne 1) { throw "Target 2.0 requires one governed reconstruction proof." }
            $proof = Get-Content -Raw -LiteralPath ([string]$proofRow[0].path) | ConvertFrom-Json
            $expectedSource = [string]$proof.integration_commit
          }
          if ($expectedSource -ne $env:MIR_CP_SOURCE_REF) { throw "Qualification-source commit mismatch." }
          if ((git -C source rev-parse HEAD).Trim() -ne $env:MIR_CP_SOURCE_REF) { throw "Source checkout mismatch." }
          ./tools/commands/control/Invoke-MIRControlPlane.ps1 package-freeze -AllLocks | Out-Host
      - id: package-build
        name: Build exact candidate from immutable package source
        shell: pwsh
        env:
          MIR_CP_TARGET: ${{ inputs.target }}
        run: |
          $targetKey = switch ($env:MIR_CP_TARGET) { '2.1' {'f210'} '2.0' {'f200'} '1.1' {'f110'} '1.0' {'f100'} default { throw 'Unsupported target.' } }
          $result = ./source/tools/commands/package/Build-MIRPackage.ps1 -RepoRoot source -Target $targetKey -CandidateId MIR4-CONTROL-PLANE -OutputDir build/packages/control-plane
          "archive=$([string]$result.archive_path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: export
        name: Materialize context and exact environment matrix
        shell: pwsh
        env:
          MIR_CP_MODE: ${{ inputs.mode }}
          MIR_CP_RELEASE: ${{ inputs.release }}
          MIR_CP_TARGET: ${{ inputs.target }}
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
        run: |
          $record = Get-Content -Raw -LiteralPath ".mir/releases/records/$env:MIR_CP_RELEASE.json" | ConvertFrom-Json
          $candidate = '${{ steps.package-build.outputs.archive }}'
          $result = ./tools/commands/control/New-MIRVerificationContext.ps1 -Mode $env:MIR_CP_MODE -Target $env:MIR_CP_TARGET `
            -Release $env:MIR_CP_RELEASE -Stage release -CandidatePath $candidate -SourceRepoRoot source -FactorioBin $env:FACTORIO_BIN -OutputRoot build/results/verification-context |
            ConvertFrom-Json
          "context_id=$([string]$result.context_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $registry = Get-Content -Raw -LiteralPath (Join-Path $result.path "expanded-scenarios.json") | ConvertFrom-Json
          $rows = @($registry.batches | Where-Object process_required | ForEach-Object {
            [ordered]@{
              batch_id = [string]$_.id
              safe_id = ([string]$_.environment_signature).Substring(0, 16).ToLowerInvariant()
              environment_signature = [string]$_.environment_signature
            }
          })
          "environments=$(@{include=$rows} | ConvertTo-Json -Depth 8 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Record context completion as immutable evidence
        shell: pwsh
        run: |
          $context = "build/results/verification-context/${{ steps.export.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation record-context -ContextPath $context `
            -TrustClass $env:MIR_CP_TRUST_CLASS -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: mir-v5-context
          path: |
            build/results/verification-context/${{ steps.export.outputs.context_id }}
            build/results/evidence
            build/results/control-plane-v5/results
          if-no-files-found: error

  static:
    name: static-task-graph
    needs: context
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Execute static and evaluation nodes in topological order
        shell: pwsh
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation run-set -ContextPath $context `
            -Kind static,evaluation -ExcludeTask shadow.equivalence -SourceRepoRoot source `
            -TrustClass $env:MIR_CP_TRUST_CLASS -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: mir-v5-evidence-static
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
          if-no-files-found: error

  package:
    name: package-task-graph
    needs: context
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Execute package nodes in topological order
        shell: pwsh
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation run-set -ContextPath $context `
            -Kind package -ExcludeTask verification.context -SourceRepoRoot source `
            -TrustClass $env:MIR_CP_TRUST_CLASS -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: mir-v5-evidence-package
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
          if-no-files-found: error

  environments:
    name: environment / ${{ matrix.safe_id }}
    needs: context
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.context.outputs.environments) }}
    concurrency:
      group: mir-v5-${{ matrix.environment_signature }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Capture one exact Factorio environment and evaluate offline
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation environment -ContextPath $context `
            -BatchId '${{ matrix.batch_id }}' -FactorioBin $env:FACTORIO_BIN `
            -SourceRepoRoot source -TrustClass protected-release -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-evidence-environment-${{ matrix.safe_id }}
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
          if-no-files-found: error

  transitions:
    name: upgrade-and-approved-delta
    if: always()
    needs: [context, package, environments]
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    concurrency:
      group: mir-v5-transition-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Capture exact upgrade and approved-delta observations
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ inputs.prior_release }}
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation upgrade -ContextPath $context `
            -FactorioBin $env:FACTORIO_BIN -PriorRelease $env:MIR_PRIOR_RELEASE -SourceRepoRoot source `
            -TrustClass protected-release -EvidenceRoot build/results/evidence
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation approved-delta -ContextPath $context `
            -FactorioBin $env:FACTORIO_BIN -PriorRelease $env:MIR_PRIOR_RELEASE -SourceRepoRoot source `
            -TrustClass protected-release -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-evidence-transitions
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
            build/results/control-plane-v5/upgrade-evidence.json
            build/results/control-plane-v5/approved-delta.json
            build/results/control-plane-v5/approved-delta-raw
          if-no-files-found: error

  ecosystem:
    name: ecosystem-closure
    if: always()
    needs: [context, package, transitions]
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    concurrency:
      group: mir-v5-ecosystem-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Capture the governed local-mod ecosystem closure
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_LOCAL_MOD_ZIPS: ${{ inputs.local_mod_zip_dir }}
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation ecosystem -ContextPath $context `
            -FactorioBin $env:FACTORIO_BIN -LocalModDir $env:MIR_LOCAL_MOD_ZIPS -SourceRepoRoot source `
            -TrustClass protected-release -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-evidence-ecosystem
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
            build/results/control-plane-v5/ecosystem
          if-no-files-found: error

  performance:
    name: performance-exclusive
    if: always()
    needs: [context, static, package, environments, transitions, ecosystem]
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    concurrency:
      group: mir-v5-performance-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Run fresh paired performance qualification alone
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ inputs.prior_release }}
          MIR_LOCAL_MOD_ZIPS: ${{ inputs.local_mod_zip_dir }}
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation performance -ContextPath $context `
            -FactorioBin $env:FACTORIO_BIN -PriorRelease $env:MIR_PRIOR_RELEASE `
            -LocalModZipDir $env:MIR_LOCAL_MOD_ZIPS -SourceRepoRoot source `
            -TrustClass protected-release -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-evidence-performance
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
            build/results/control-plane-v5/performance-evidence.json
          if-no-files-found: error

  manual:
    name: exact-manual-attestation
    if: always()
    needs: [context, transitions, ecosystem, performance]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Remove coordination copies from the worker input
        shell: pwsh
        run: |
          if (Test-Path build/results/evidence) { Remove-Item -LiteralPath build/results/evidence -Recurse -Force }
          if (Test-Path build/results/control-plane-v5/results) { Remove-Item -LiteralPath build/results/control-plane-v5/results -Recurse -Force }
      - name: Admit only a maintainer-authored exact-candidate attestation
        shell: pwsh
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation run-set -ContextPath $context `
            -Kind manual -TrustClass $env:MIR_CP_TRUST_CLASS -EvidenceRoot build/results/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-evidence-manual
          path: |
            build/results/evidence
            build/results/control-plane-v5/results
          if-no-files-found: error

  verification-gate:
    name: MIR / verification-gate
    if: always()
    needs: [context, static, package, environments, transitions, ecosystem, performance, manual]
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source
      - name: Isolate nested source checkout from controller status
        shell: pwsh
        run: Add-Content -LiteralPath (git rev-parse --git-path info/exclude) -Value "/source/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mir-v5-context
          path: build/results
      - name: Download isolated immutable worker objects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: mir-v5-evidence-*
          path: build/results/control-plane-worker-evidence
      - name: Import content-addressed worker objects deterministically
        shell: pwsh
        run: |
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation import-workers `
            -ContextPath "build/results/verification-context/${{ needs.context.outputs.context_id }}" `
            -WorkerRoot build/results/control-plane-worker-evidence -EvidenceRoot build/results/evidence |
            Tee-Object -FilePath build/results/control-plane-v5/worker-import.json
      - name: Require exact evidence for every task and environment
        shell: pwsh
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          ./tools/commands/control/Invoke-MIRControlPlaneWork.ps1 -Operation aggregate -ContextPath $context `
            -AggregateTaskId qualification.full -TrustClass protected-release -EvidenceRoot build/results/evidence |
            Tee-Object -FilePath build/results/control-plane-v5/aggregate-result.json
      - name: Admit reconstruction, seal, shadow cutover, and promotion
        shell: pwsh
        env:
          MIR_CP_TARGET: ${{ inputs.target }}
        run: |
          $context = "build/results/verification-context/${{ needs.context.outputs.context_id }}"
          if ($env:MIR_CP_TARGET -eq "2.0") {
            ./tools/commands/control/Invoke-MIRControlPlane.ps1 backport -ContextPath $context -EvidenceRoot build/results/evidence | Out-Host
          }
          ./tools/commands/control/Invoke-MIRControlPlane.ps1 seal -ContextPath $context -EvidenceRoot build/results/evidence |
            Tee-Object -FilePath build/results/control-plane-v5/seal-result.json
          ./tools/commands/control/Invoke-MIRControlPlane.ps1 release -ContextPath $context -TaskId shadow.equivalence `
            -SourceRepoRoot source -TrustClass protected-release -EvidenceRoot build/results/evidence | Out-Host
          ./tools/commands/control/Invoke-MIRControlPlane.ps1 promotion -ContextPath $context -EvidenceRoot build/results/evidence |
            Tee-Object -FilePath build/results/control-plane-v5/promotion-result.json
      - name: Record exact target qualification attestation
        shell: pwsh
        env:
          MIR_CP_CONTEXT_ID: ${{ needs.context.outputs.context_id }}
          MIR_CP_SOURCE_REF: ${{ inputs.source_ref }}
          MIR_CP_TARGET: ${{ inputs.target }}
        run: |
          $sourceCommit = (git -C source rev-parse HEAD).Trim()
          $sourceTree = (git -C source rev-parse 'HEAD^{tree}').Trim()
          if ($sourceCommit -cne $env:MIR_CP_SOURCE_REF) { throw 'Qualification source checkout mismatch.' }
          $target = switch ($env:MIR_CP_TARGET) {
            '2.0' { 'F200' }
            '2.1' { 'F210' }
            default { throw 'Qualification target is unsupported.' }
          }
          $context = "build/results/verification-context/$env:MIR_CP_CONTEXT_ID"
          $candidate = Get-Content -Raw -LiteralPath (Join-Path $context 'candidate-descriptor.json') | ConvertFrom-Json -Depth 20
          $environmentLocks = Get-Content -Raw -LiteralPath (Join-Path $context 'environment-locks.json') | ConvertFrom-Json -Depth 20
          $contextManifestPath = Join-Path $context 'context-manifest.json'
          $contextManifest = Get-Content -Raw -LiteralPath $contextManifestPath | ConvertFrom-Json -Depth 20
          $factorioLocks = @($environmentLocks.factorio | Where-Object { [string]$_.source -ceq 'context-materialization' })
          if ($factorioLocks.Count -ne 1) { throw 'Qualification context must bind exactly one materialized Factorio lock.' }
          $factorio = $factorioLocks[0]
          if ([string]$candidate.target -cne $env:MIR_CP_TARGET -or [string]$environmentLocks.target -cne $env:MIR_CP_TARGET -or
              [string]$candidate.source_commit -cne $sourceCommit -or [string]$candidate.source_tree -cne $sourceTree) {
            throw 'Qualification context does not bind the nested source and requested target.'
          }
          foreach ($path in @(
            (Join-Path $context 'candidate-descriptor.json'),
            (Join-Path $context 'environment-locks.json'),
            $contextManifestPath,
            'build/results/control-plane-v5/aggregate-result.json',
            'build/results/control-plane-v5/worker-import.json',
            'build/results/control-plane-v5/seal-result.json',
            'build/results/control-plane-v5/promotion-result.json'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Qualification attestation input is missing: $path" }
          }
          $aggregate = Get-Content -Raw -LiteralPath 'build/results/control-plane-v5/aggregate-result.json' | ConvertFrom-Json -Depth 20
          $seal = Get-Content -Raw -LiteralPath 'build/results/control-plane-v5/seal-result.json' | ConvertFrom-Json -Depth 20
          $promotion = Get-Content -Raw -LiteralPath 'build/results/control-plane-v5/promotion-result.json' | ConvertFrom-Json -Depth 20
          if ([string]$aggregate.status -cne 'passed' -or [string]$aggregate.context_digest -cne $env:MIR_CP_CONTEXT_ID -or
              [string]$aggregate.plan_id -cne [string]$contextManifest.plan_id -or [string]$aggregate.aggregate_task -cne 'qualification.full' -or
              [string]$aggregate.manifest_object -notmatch '^[A-Fa-f0-9]{64}$' -or [string]$seal.status -cne 'passed' -or
              [string]$seal.context_digest -cne $env:MIR_CP_CONTEXT_ID -or [string]$seal.release -cne [string]$candidate.release -or
              [string]$seal.seal_object -notmatch '^[A-Fa-f0-9]{64}$' -or [string]$seal.task_object -notmatch '^[A-Fa-f0-9]{64}$' -or
              [string]$promotion.status -cne 'passed' -or [string]$promotion.context_digest -cne $env:MIR_CP_CONTEXT_ID -or
              [string]$promotion.task_id -cne 'promotion' -or [string]$promotion.object_digest -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'Qualification aggregate does not bind the exact successful context.'
          }
          if ([string]$factorio.version -eq '' -or [string]$factorio.installation_sha256 -notmatch '^[A-Fa-f0-9]{64}$' -or
              [string]$factorio.binary.sha256 -notmatch '^[A-Fa-f0-9]{64}$' -or [int64]$factorio.binary.bytes -le 0 -or
              [string]$factorio.official_data.sha256 -notmatch '^[A-Fa-f0-9]{64}$' -or [int]$factorio.official_data.file_count -le 0) {
            throw 'Qualification context Factorio lock is incomplete.'
          }
          if ($target -eq 'F200' -and [string]$factorio.version -cne '2.0.77') {
            throw 'F200 qualification requires exact Factorio 2.0.77.'
          }
          if ($target -eq 'F210') {
            try {
              $profile = Get-Content -Raw -LiteralPath 'source/validation/profiles/factorio-2.1.json' | ConvertFrom-Json -Depth 20
              $floor = [version]([string]$profile.minimum_factorio_version)
              $actual = [version]([string]$factorio.version)
            } catch { throw 'F210 qualification engine version is invalid.' }
            if ($actual.Major -ne 2 -or $actual.Minor -ne 1 -or $actual -lt $floor) {
              throw "F210 qualification requires Factorio 2.1.x at or above $floor."
            }
          }
          $sha256 = {
            param([string]$Path)
            return (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToUpperInvariant()
          }
          $record = [ordered]@{
            schema = 1
            kind = 'MIR4TargetQualificationAttestationV1'
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_job = $env:GITHUB_JOB
            workflow_ref = $env:GITHUB_REF
            workflow_commit = $env:GITHUB_SHA
            source_ref = $env:MIR_CP_SOURCE_REF
            source_commit = $sourceCommit
            source_tree = $sourceTree
            target = $target
            factorio_version = $env:MIR_CP_TARGET
            context = [ordered]@{
              id = $env:MIR_CP_CONTEXT_ID
              release = [string]$candidate.release
              candidate_id = [string]$candidate.candidate_id
              plan_id = [string]$contextManifest.plan_id
              manifest_sha256 = & $sha256 $contextManifestPath
              candidate_descriptor_sha256 = & $sha256 (Join-Path $context 'candidate-descriptor.json')
              environment_locks_sha256 = & $sha256 (Join-Path $context 'environment-locks.json')
            }
            package = [ordered]@{
              archive_sha256 = [string]$candidate.archive_sha256
              content_sha256 = [string]$candidate.content_sha256
              bytes = [int64]$candidate.bytes
              entry_count = [int]$candidate.entries
              source_sha256 = [string]$candidate.source_sha256
            }
            engine = [ordered]@{
              version = [string]$factorio.version
              installation_sha256 = [string]$factorio.installation_sha256
              binary_sha256 = [string]$factorio.binary.sha256
              binary_bytes = [int64]$factorio.binary.bytes
              official_data_sha256 = [string]$factorio.official_data.sha256
              official_data_file_count = [int]$factorio.official_data.file_count
            }
            evidence = [ordered]@{
              qualification_manifest_sha256 = ([string]$aggregate.manifest_object).ToUpperInvariant()
              aggregate_result_sha256 = & $sha256 'build/results/control-plane-v5/aggregate-result.json'
              worker_import_sha256 = & $sha256 'build/results/control-plane-v5/worker-import.json'
              seal_result_sha256 = & $sha256 'build/results/control-plane-v5/seal-result.json'
              promotion_result_sha256 = & $sha256 'build/results/control-plane-v5/promotion-result.json'
              seal_object_sha256 = ([string]$seal.seal_object).ToUpperInvariant()
              seal_task_object_sha256 = ([string]$seal.task_object).ToUpperInvariant()
              promotion_task_object_sha256 = ([string]$promotion.object_digest).ToUpperInvariant()
            }
          }
          $path = 'build/results/control-plane-v5/target-qualification-attestation.json'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($path))) | Out-Null
          [IO.File]::WriteAllText($path, ($record | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mir-v5-target-qualification-${{ inputs.target }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/results/control-plane-v5/target-qualification-attestation.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          include-hidden-files: true
          name: mir-v5-qualification-${{ needs.context.outputs.context_id }}
          path: |
            build/results/verification-context/${{ needs.context.outputs.context_id }}
            build/results/evidence
            build/results/control-plane-v5/aggregate-result.json
            build/results/control-plane-v5/worker-import.json
            build/results/control-plane-v5/seal-result.json
            build/results/control-plane-v5/promotion-result.json
          if-no-files-found: error
