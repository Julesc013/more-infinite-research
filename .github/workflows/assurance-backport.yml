name: Assurance Backport Matrix

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Trusted backport source commit"
        required: true
      baseline_sha:
        description: "Published target baseline"
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ["2.1", "2.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Materialize target plan
        shell: pwsh
        env:
          MIR_BACKPORT_BASELINE_SHA: ${{ inputs.baseline_sha }}
          MIR_BACKPORT_TARGET: ${{ matrix.target }}
        run: ./tools/mir.ps1 assurance backport --target $env:MIR_BACKPORT_TARGET --baseline $env:MIR_BACKPORT_BASELINE_SHA --output "build/results/assurance/backport-$($env:MIR_BACKPORT_TARGET).json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          include-hidden-files: true
          name: assurance-backport-plan-${{ matrix.target }}-${{ inputs.candidate_sha }}
          path: build/results/assurance/**
          if-no-files-found: error
