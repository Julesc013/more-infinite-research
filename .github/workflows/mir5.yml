name: MIR 5 host controls

on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - ".github/workflows/mir5.yml"
      - "source/mir5/**"
      - "tests/mir5/**"
      - "tools/mir5/**"
      - "spec/mir5/**"
      - "docs/mir5/**"
      - "sdk/mir5/**"
      - "targets/mir5/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select the pinned Python ABI
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          architecture: x64
          check-latest: false
      - name: Provision the pinned Lua 5.2 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -ErrorAction Stop).Source
          $runtime = Join-Path $PWD 'build/tmp/mir5-lua52-runtime'
          New-Item -ItemType Directory -Path $runtime -ErrorAction Stop | Out-Null
          $requirements = Join-Path $runtime 'requirements.txt'
          [IO.File]::WriteAllText($requirements, "lupa==2.6 --hash=sha256:b74f944fe46c421e25d0f8692aef1e842192f6f7f68034201382ac440ef9ea67`n", [Text.UTF8Encoding]::new($false))
          & $python -m pip --isolated install --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --target $runtime --requirement $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Lupa installation failed.' }
          $probe = @'
          import sys
          from pathlib import Path
          runtime = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(runtime))
          import lupa
          from lupa import lua52
          assert lupa.__version__ == "2.6"
          assert Path(lua52.__file__).name == "lua52.cp314-win_amd64.pyd"
          '@
          & $python -c $probe $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Lua 5.2 backend probe failed.' }
          "MIR5_LUA_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run MIR 5 host and package controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -ErrorAction Stop).Source
          function Invoke-HostControl([string[]] $Arguments) {
            & $python -B @Arguments
            if ($LASTEXITCODE -ne 0) { throw "MIR 5 host control failed: $($Arguments -join ' ')" }
          }
          Invoke-HostControl @('tests/mir5/test_generator.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_caps.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_api.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_runtime_api.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_fixture_controls.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_lifecycle.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_properties.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_replay.py', '--lua-runtime-dir', $env:MIR5_LUA_RUNTIME)
          Invoke-HostControl @('tests/mir5/test_package.py')
          Invoke-HostControl @('tests/mir5/test_pack.py')
          Invoke-HostControl @('tools/mir5/check_pack.py')
