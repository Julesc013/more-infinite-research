name: Assurance Targeted Runtime

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Trusted full source commit"
        required: true
      baseline_sha:
        description: "Qualified comparison commit"
        required: true
      target:
        description: "Factorio target line"
        required: true
        default: "2.1"

permissions:
  contents: read

jobs:
  plan:
    name: verification-plan
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ inputs.target }}-
      - name: Build exact candidate once
        shell: pwsh
        env:
          MIR_ASSURANCE_TARGET: ${{ inputs.target }}
        run: ./tools/mir.ps1 assurance build --target $env:MIR_ASSURANCE_TARGET
      - name: Create impact-selected plan
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_ASSURANCE_BASELINE_SHA: ${{ inputs.baseline_sha }}
          MIR_ASSURANCE_TARGET: ${{ inputs.target }}
        run: ./tools/mir.ps1 verify plan --target $env:MIR_ASSURANCE_TARGET --baseline $env:MIR_ASSURANCE_BASELINE_SHA --profile targeted --factorio $env:FACTORIO_BIN --output build/results/assurance/verification-plan.json
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw -LiteralPath build/results/assurance/verification-plan.json | ConvertFrom-Json
          "matrix=$(@{ include = @($plan.work) } | ConvertTo-Json -Depth 10 -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          include-hidden-files: true
          name: mir-targeted-plan-and-candidate
          path: |
            build/results/assurance/verification-plan.json
            dist/*.zip
          if-no-files-found: error

  tests:
    name: ${{ matrix.test_id }}
    needs: plan
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: mir-${{ matrix.safe_test_id }}-${{ matrix.fingerprint }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mir-targeted-plan-and-candidate
          path: .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ inputs.target }}-
      - name: Reuse, adopt, or run exact test instance
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_ASSURANCE_FINGERPRINT: ${{ matrix.fingerprint }}
          MIR_ASSURANCE_TARGET: ${{ inputs.target }}
          MIR_ASSURANCE_TEST_ID: ${{ matrix.test_id }}
        run: ./tools/mir.ps1 verify run-one --target $env:MIR_ASSURANCE_TARGET --plan build/results/assurance/verification-plan.json --test $env:MIR_ASSURANCE_TEST_ID --fingerprint $env:MIR_ASSURANCE_FINGERPRINT --factorio $env:FACTORIO_BIN
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          include-hidden-files: true
          name: mir-targeted-evidence-${{ matrix.safe_test_id }}
          path: build/results/assurance/evidence/${{ matrix.safe_test_id }}/${{ matrix.fingerprint }}
          if-no-files-found: warn

  verification-gate:
    name: verification-gate
    if: always()
    needs:
      - plan
      - tests
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mir-targeted-plan-and-candidate
          path: .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ inputs.target }}-
      - name: Download isolated worker evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mir-targeted-evidence-*
          path: build/results/assurance/worker-evidence
      - name: Import exact worker evidence deterministically
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_ASSURANCE_TARGET: ${{ inputs.target }}
        run: ./tools/mir.ps1 verify import-workers --target $env:MIR_ASSURANCE_TARGET --plan build/results/assurance/verification-plan.json --factorio $env:FACTORIO_BIN --workers build/results/assurance/worker-evidence --artifact-prefix mir-targeted-evidence-
      - name: Aggregate targeted gate
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_ASSURANCE_TARGET: ${{ inputs.target }}
        run: ./tools/mir.ps1 verify gate --target $env:MIR_ASSURANCE_TARGET --plan build/results/assurance/verification-plan.json --factorio $env:FACTORIO_BIN --output build/results/assurance/targeted-summary.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ inputs.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          include-hidden-files: true
          name: assurance-targeted-${{ inputs.target }}-${{ inputs.candidate_sha }}
          path: |
            build/results/assurance/verification-plan.json
            build/results/assurance/worker-import.json
            build/results/assurance/evidence-bundle.json
            build/results/assurance/targeted-summary.json
          if-no-files-found: warn
