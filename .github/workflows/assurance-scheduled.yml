name: Assurance Scheduled Breadth

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: verification-plan
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-2.1-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-2.1-
      - name: Build exact candidate
        shell: pwsh
        run: ./tools/mir.ps1 assurance build --target 2.1
      - name: Materialize forced breadth plan
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ secrets.MIR_PRIOR_RELEASE_3_1_9 }}
        run: ./tools/mir.ps1 verify plan --target 2.1 --profile full --factorio $env:FACTORIO_BIN --prior $env:MIR_PRIOR_RELEASE --no-reuse --output build/results/assurance/verification-plan.json
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw -LiteralPath build/results/assurance/verification-plan.json | ConvertFrom-Json
          "matrix=$(@{ include = @($plan.work) } | ConvertTo-Json -Depth 10 -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          include-hidden-files: true
          name: mir-scheduled-plan-and-candidate
          path: |
            build/results/assurance/verification-plan.json
            dist/*.zip
          if-no-files-found: error

  tests:
    name: ${{ matrix.test_id }}
    needs: plan
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: mir-${{ matrix.safe_test_id }}-${{ matrix.fingerprint }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mir-scheduled-plan-and-candidate
          path: .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-2.1-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-2.1-
      - name: Force exact test instance
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ secrets.MIR_PRIOR_RELEASE_3_1_9 }}
        run: ./tools/mir.ps1 verify run-one --target 2.1 --plan build/results/assurance/verification-plan.json --test '${{ matrix.test_id }}' --fingerprint '${{ matrix.fingerprint }}' --factorio $env:FACTORIO_BIN --prior $env:MIR_PRIOR_RELEASE --no-reuse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          include-hidden-files: true
          name: mir-scheduled-evidence-${{ matrix.safe_test_id }}
          path: build/results/assurance/evidence/${{ matrix.safe_test_id }}/${{ matrix.fingerprint }}
          if-no-files-found: warn

  verification-gate:
    name: verification-gate
    if: always()
    needs:
      - plan
      - tests
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mir-scheduled-plan-and-candidate
          path: .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-2.1-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-2.1-
      - name: Download isolated worker evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mir-scheduled-evidence-*
          path: build/results/assurance/worker-evidence
      - name: Import exact worker evidence deterministically
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ secrets.MIR_PRIOR_RELEASE_3_1_9 }}
        run: ./tools/mir.ps1 verify import-workers --target 2.1 --plan build/results/assurance/verification-plan.json --factorio $env:FACTORIO_BIN --prior $env:MIR_PRIOR_RELEASE --workers build/results/assurance/worker-evidence --artifact-prefix mir-scheduled-evidence-
      - name: Aggregate forced breadth gate
        shell: pwsh
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
          MIR_PRIOR_RELEASE: ${{ secrets.MIR_PRIOR_RELEASE_3_1_9 }}
        run: ./tools/mir.ps1 verify gate --target 2.1 --plan build/results/assurance/verification-plan.json --factorio $env:FACTORIO_BIN --prior $env:MIR_PRIOR_RELEASE --output build/results/assurance/scheduled-summary.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: build/results/assurance/evidence
          key: mir-ledger-${{ runner.os }}-2.1-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          include-hidden-files: true
          name: assurance-scheduled-2.1-${{ github.sha }}
          path: |
            build/results/assurance/verification-plan.json
            build/results/assurance/worker-import.json
            build/results/assurance/evidence-bundle.json
            build/results/assurance/scheduled-summary.json
          if-no-files-found: warn
