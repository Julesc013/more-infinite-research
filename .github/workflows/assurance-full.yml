name: Assurance Full Qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact immutable qualification-source commit"
        required: true
      release:
        description: "Governed release record"
        required: true
      target:
        description: "Factorio target"
        required: true
        type: choice
        options:
          - "2.0"
          - "2.1"
      mode:
        description: "Verification freshness mode"
        required: true
        type: choice
        default: "calibrate-fresh"
        options:
          - "calibrate-fresh"
          - "qualify-incremental"
      prior_release:
        description: "Trusted-runner path to the exact prior release archive"
        required: true
      local_mod_zip_dir:
        description: "Trusted-runner path to the governed local mod ZIP closure"
        required: false

permissions:
  contents: read

jobs:
  control-plane-v5:
    uses: ./.github/workflows/control-plane-v5.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      release: ${{ inputs.release }}
      target: ${{ inputs.target }}
      mode: ${{ inputs.mode }}
      prior_release: ${{ inputs.prior_release }}
      local_mod_zip_dir: ${{ inputs.local_mod_zip_dir }}
    secrets: inherit
