name: MIR 5 host controls

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-plan:
    name: verification-plan
    runs-on: windows-latest
    outputs:
      plan_artifact: ${{ steps.artifact.outputs.plan_artifact }}
      plan_sha256: ${{ steps.bind.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact published historical sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin bd9774f323b6eb1561c1d9ff0c91ecc3f7acd1d1
          if ($LASTEXITCODE -ne 0) { throw 'Exact published historical oracle fetch failed.' }
          git fetch --no-tags --depth=1 origin 8643cc91bc915e008556a5315dbb0a743247e7ab
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 4.7.3 repair-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 5c51ed46d1762b4fca7480f05a057482bbbedb0a
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured F210 K2 profile-source fetch failed.' }
          git fetch --no-tags --depth=1 origin a9754abcd7405e1ddffa9f4dc8051b71d00855fe
          if ($LASTEXITCODE -ne 0) { throw 'Exact native fixture seed-order source fetch failed.' }
          git fetch --no-tags --depth=1 origin 98bab2c2d346dc508c0f008d824ebc867d920595
          if ($LASTEXITCODE -ne 0) { throw 'Exact oil reset fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 32ddafc4fece8d0c3a998a897ee9de1a3e32053e
          if ($LASTEXITCODE -ne 0) { throw 'Exact runtime science-input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin c37fca88667d550660f5b9c0efd7f272b56d6025
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured Bob/Angel science-oil fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 09a66acc9c613617f95074f23f3fd9a4aab4765b
          if ($LASTEXITCODE -ne 0) { throw 'Exact pre-disabled native owner cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin ce48d0d78c68bc78779a8449f50e4dc0e6b0bc9c
          if ($LASTEXITCODE -ne 0) { throw 'Exact F200 foreign cap baseline fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 24dd0497e8f550b8b2bc2dc74b885d7a606dcf08
          if ($LASTEXITCODE -ne 0) { throw 'Exact corrected F200 cap queue fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 9ef64ff41e0c7140467df044dfe20837f1fa5a40
          if ($LASTEXITCODE -ne 0) { throw 'Exact legacy boolean cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin d8c6f9e1990d5b5540901d6fd4fa3c5a9e970979
          if ($LASTEXITCODE -ne 0) { throw 'Exact raw-close input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 70e4f235dfd94e9be09d317377e8661608390069
          if ($LASTEXITCODE -ne 0) { throw 'Exact order-neutral input metadata-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 7cf634060cde6441031e744c7d155b0647fa0851
          if ($LASTEXITCODE -ne 0) { throw 'Exact removal operand fixture-source fetch failed.' }
      - id: bind
        name: Bind the exact ordered host-control plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = 'tests/Test-MIR5HostControls.ps1'
          $sourceCommit = (& git rev-parse HEAD).Trim().ToUpperInvariant()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim().ToUpperInvariant()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -notmatch '^[0-9A-F]{40}$' -or $sourceTree -notmatch '^[0-9A-F]{40}$') {
            throw 'Unable to resolve the checked-out source commit and tree.'
          }
          $driverHash = (Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToUpperInvariant()
          $hostPlan = & $driver -Plan
          if ($null -eq $hostPlan) { throw 'MIR5 host plan command produced no result.' }
          if ([string]$hostPlan.kind -cne 'MIR5HostControlsPlanV1' -or
              [bool]$hostPlan.native_execution -or [bool]$hostPlan.release_qualification) {
            throw 'MIR5 host plan has an invalid execution boundary.'
          }
          $controls = @($hostPlan.controls)
          if ($controls.Count -eq 0) { throw 'MIR5 host plan has no controls.' }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($control in $controls) {
            $path = [string]$control.path
            if ([string]::IsNullOrWhiteSpace($path) -or [IO.Path]::IsPathRooted($path) -or
                $path.Contains('..') -or -not $seen.Add($path)) {
              throw "MIR5 host plan has an invalid or duplicate control path: $path"
            }
            $tracked = @(& git ls-files --error-unmatch -- $path)
            if ($LASTEXITCODE -ne 0 -or $tracked.Count -ne 1 -or [string]$tracked[0] -cne $path) {
              throw "MIR5 host plan control is not one tracked checkout file: $path"
            }
          }
          $record = [ordered]@{
            schema = 1
            kind = 'MIR5HostGatePlanV1'
            source = [ordered]@{ commit = $sourceCommit; tree = $sourceTree }
            driver = [ordered]@{ path = $driver; sha256 = $driverHash }
            controls = $controls
          }
          $outputDirectory = Join-Path $PWD 'build/host-gate'
          [IO.Directory]::CreateDirectory($outputDirectory) | Out-Null
          $outputPath = Join-Path $outputDirectory 'plan.json'
          [IO.File]::WriteAllText($outputPath, (($record | ConvertTo-Json -Depth 32) + "`n"), [Text.UTF8Encoding]::new($false))
          $planHash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToUpperInvariant()
          "plan_sha256=$planHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: artifact
        name: Bind plan artifact identity
        shell: pwsh
        run: |
          "plan_artifact=mir5-host-plan-${{ github.run_id }}-${{ github.run_attempt }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preserve the bound host-control plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: ${{ steps.artifact.outputs.plan_artifact }}
          path: build/host-gate/plan.json
          if-no-files-found: error

  host-controls:
    name: host-controls
    needs: verification-plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact published historical sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin bd9774f323b6eb1561c1d9ff0c91ecc3f7acd1d1
          if ($LASTEXITCODE -ne 0) { throw 'Exact published historical oracle fetch failed.' }
          git fetch --no-tags --depth=1 origin 8643cc91bc915e008556a5315dbb0a743247e7ab
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 4.7.3 repair-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 5c51ed46d1762b4fca7480f05a057482bbbedb0a
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured F210 K2 profile-source fetch failed.' }
          git fetch --no-tags --depth=1 origin a9754abcd7405e1ddffa9f4dc8051b71d00855fe
          if ($LASTEXITCODE -ne 0) { throw 'Exact native fixture seed-order source fetch failed.' }
          git fetch --no-tags --depth=1 origin 98bab2c2d346dc508c0f008d824ebc867d920595
          if ($LASTEXITCODE -ne 0) { throw 'Exact oil reset fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 32ddafc4fece8d0c3a998a897ee9de1a3e32053e
          if ($LASTEXITCODE -ne 0) { throw 'Exact runtime science-input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin c37fca88667d550660f5b9c0efd7f272b56d6025
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured Bob/Angel science-oil fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 09a66acc9c613617f95074f23f3fd9a4aab4765b
          if ($LASTEXITCODE -ne 0) { throw 'Exact pre-disabled native owner cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin ce48d0d78c68bc78779a8449f50e4dc0e6b0bc9c
          if ($LASTEXITCODE -ne 0) { throw 'Exact F200 foreign cap baseline fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 24dd0497e8f550b8b2bc2dc74b885d7a606dcf08
          if ($LASTEXITCODE -ne 0) { throw 'Exact corrected F200 cap queue fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 9ef64ff41e0c7140467df044dfe20837f1fa5a40
          if ($LASTEXITCODE -ne 0) { throw 'Exact legacy boolean cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin d8c6f9e1990d5b5540901d6fd4fa3c5a9e970979
          if ($LASTEXITCODE -ne 0) { throw 'Exact raw-close input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 70e4f235dfd94e9be09d317377e8661608390069
          if ($LASTEXITCODE -ne 0) { throw 'Exact order-neutral input metadata-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 7cf634060cde6441031e744c7d155b0647fa0851
          if ($LASTEXITCODE -ne 0) { throw 'Exact removal operand fixture-source fetch failed.' }
      - name: Restore the bound host-control plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.verification-plan.outputs.plan_artifact }}
          path: build/host-gate
      - name: Verify plan artifact readback against this checkout
        shell: pwsh
        env:
          MIR5_HOST_PLAN_SHA256: ${{ needs.verification-plan.outputs.plan_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $planPath = 'build/host-gate/plan.json'
          if (-not (Test-Path -LiteralPath $planPath -PathType Leaf)) { throw 'Bound MIR5 host plan artifact is absent.' }
          $actualPlanHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualPlanHash -cne $env:MIR5_HOST_PLAN_SHA256) { throw 'Bound MIR5 host plan artifact hash differs.' }
          $bound = Get-Content -Raw -LiteralPath $planPath | ConvertFrom-Json -Depth 32
          $sourceCommit = (& git rev-parse HEAD).Trim().ToUpperInvariant()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim().ToUpperInvariant()
          if ($LASTEXITCODE -ne 0 -or [int]$bound.schema -ne 1 -or [string]$bound.kind -cne 'MIR5HostGatePlanV1' -or
              [string]$bound.source.commit -cne $sourceCommit -or [string]$bound.source.tree -cne $sourceTree) {
            throw 'Bound MIR5 host plan does not describe this checkout.'
          }
          $driver = [string]$bound.driver.path
          if ($driver -cne 'tests/Test-MIR5HostControls.ps1' -or -not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw 'Bound MIR5 host plan has an invalid driver identity.'
          }
          $driverHash = (Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToUpperInvariant()
          if ([string]$bound.driver.sha256 -cne $driverHash) { throw 'Bound MIR5 host driver hash differs.' }
          $current = & $driver -Plan
          if ($null -eq $current -or [string]$current.kind -cne 'MIR5HostControlsPlanV1' -or
              [bool]$current.native_execution -or [bool]$current.release_qualification) {
            throw 'Current MIR5 host plan has an invalid execution boundary.'
          }
          $boundControls = @($bound.controls)
          $currentControls = @($current.controls)
          if ($boundControls.Count -eq 0 -or $boundControls.Count -ne $currentControls.Count) {
            throw 'Bound MIR5 host control count differs.'
          }
          for ($index = 0; $index -lt $boundControls.Count; $index++) {
            $boundControl = $boundControls[$index]
            $currentControl = $currentControls[$index]
            if ([string]$boundControl.path -cne [string]$currentControl.path -or
                [bool]$boundControl.lua -ne [bool]$currentControl.lua) {
              throw "Bound MIR5 host control differs at index $index."
            }
          }
      - name: Select the pinned Python ABI
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          architecture: x64
          check-latest: false
      - name: Provision the pinned Lua 5.2 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python -ErrorAction Stop).Source
          $runtime = Join-Path $PWD 'build/tmp/mir5-lua52-runtime'
          New-Item -ItemType Directory -Path $runtime -ErrorAction Stop | Out-Null
          $requirements = Join-Path $runtime 'requirements.txt'
          [IO.File]::WriteAllText($requirements, "lupa==2.6 --hash=sha256:b74f944fe46c421e25d0f8692aef1e842192f6f7f68034201382ac440ef9ea67`n", [Text.UTF8Encoding]::new($false))
          & $python -m pip --isolated install --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --target $runtime --requirement $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Lupa installation failed.' }
          $probe = @'
          import sys
          from pathlib import Path
          runtime = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(runtime))
          import lupa
          from lupa import lua52
          assert lupa.__version__ == "2.6"
          assert Path(lua52.__file__).name == "lua52.cp314-win_amd64.pyd"
          '@
          & $python -c $probe $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Lua 5.2 backend probe failed.' }
          "MIR5_LUA_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the bound MIR5 host controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/Test-MIR5HostControls.ps1 -LuaRuntimeDir $env:MIR5_LUA_RUNTIME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-tooling-controls:
    name: native-tooling-controls
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run current native tooling guards without an engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controls = @(
            'tests/tooling/Test-MIRNativeProbeResources.ps1',
            'tests/tooling/Test-MIRImmutableInputStaging.ps1',
            'tests/tooling/Test-MIRLibraryActivation.ps1',
            'tests/tooling/Test-MIRDirectLibraryStartupMeasurement.ps1',
            'tests/tooling/Test-MIRDevelopmentHealth.ps1',
            'tests/tooling/Test-MIRArtifactStorageOptimization.ps1'
          )
          foreach ($control in $controls) {
            & pwsh -NoLogo -NoProfile -File $control
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
