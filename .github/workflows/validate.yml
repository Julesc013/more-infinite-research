name: MIR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIR_VALIDATION_TARGET: ${{ (github.ref == 'refs/heads/tmp/2.0' || github.ref == 'refs/heads/legacy' || github.head_ref == 'tmp/2.0' || github.head_ref == 'legacy' || github.base_ref == 'tmp/2.0' || github.base_ref == 'legacy') && '2.0' || '2.1' }}

jobs:
  plan:
    name: verification-plan
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore persistent evidence ledger
        uses: actions/cache/restore@v4
        with:
          path: .work/artifacts/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ github.ref_name }}-
            mir-ledger-${{ runner.os }}-
      - name: Diagnose verifier
        shell: pwsh
        run: ./tools/mir.ps1 assurance doctor --target $env:MIR_VALIDATION_TARGET --json
      - name: Build byte-bound development archive
        shell: pwsh
        run: ./tools/mir.ps1 assurance build --target $env:MIR_VALIDATION_TARGET
      - name: Isolate exact development candidate from historical distributions
        shell: pwsh
        run: |
          $info = Get-Content -Raw -LiteralPath info.json | ConvertFrom-Json
          $archiveName = "$($info.name)_$($info.version).zip"
          $source = Join-Path $PWD "dist/$archiveName"
          $candidateRoot = Join-Path $PWD ".work/candidate"
          $candidate = Join-Path $candidateRoot $archiveName
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Development candidate was not built: $source"
          }
          New-Item -ItemType Directory -Force -Path $candidateRoot | Out-Null
          Copy-Item -LiteralPath $source -Destination $candidate -Force
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash) {
            throw "Isolated development candidate differs from the exact build output."
          }
          Remove-Item -LiteralPath $source -Force
          "MIR_DEVELOPMENT_CANDIDATE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Materialize content-addressed verification plan
        shell: pwsh
        run: ./tools/mir.ps1 verify plan --target $env:MIR_VALIDATION_TARGET --profile fast --candidate $env:MIR_DEVELOPMENT_CANDIDATE --output .work/output/verification-plan.json
      - id: matrix
        name: Export required work
        shell: pwsh
        run: |
          $plan = Get-Content -Raw -LiteralPath .work/output/verification-plan.json | ConvertFrom-Json
          $work = @($plan.work)
          if ($work.Count -eq 0) {
            $work = @([ordered]@{
              test_id = "reuse-only"
              safe_test_id = "reuse-only"
              fingerprint = "reuse-only"
              no_op = $true
            })
          }
          $matrix = @{ include = $work } | ConvertTo-Json -Depth 10 -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: mir-verification-plan
          path: .work/output/verification-plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mir-development-candidate
          path: .work/candidate/*.zip
          if-no-files-found: error

  tests:
    name: ${{ matrix.test_id }}
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: mir-${{ matrix.safe_test_id }}-${{ matrix.fingerprint }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.no_op != true }}
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: ${{ matrix.no_op != true }}
        with:
          name: mir-verification-plan
          path: .work/output
      - uses: actions/download-artifact@v4
        if: ${{ matrix.no_op != true }}
        with:
          name: mir-development-candidate
          path: .work/candidate
      - name: Resolve exact development candidate
        if: ${{ matrix.no_op != true }}
        shell: pwsh
        run: |
          $info = Get-Content -Raw -LiteralPath info.json | ConvertFrom-Json
          $candidate = Join-Path $PWD ".work/candidate/$($info.name)_$($info.version).zip"
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Transferred development candidate is absent: $candidate"
          }
          "MIR_DEVELOPMENT_CANDIDATE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore persistent evidence ledger
        if: ${{ matrix.no_op != true }}
        uses: actions/cache/restore@v4
        with:
          path: .work/artifacts/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ github.ref_name }}-
            mir-ledger-${{ runner.os }}-
      - name: Reuse, adopt, or run exact test instance
        if: ${{ matrix.no_op != true }}
        shell: pwsh
        run: ./tools/mir.ps1 verify run-one --target $env:MIR_VALIDATION_TARGET --candidate $env:MIR_DEVELOPMENT_CANDIDATE --plan .work/output/verification-plan.json --test '${{ matrix.test_id }}' --fingerprint '${{ matrix.fingerprint }}'
      - name: Confirm reuse-only plan needs no worker
        if: ${{ matrix.no_op == true }}
        shell: pwsh
        run: Write-Host "All required fingerprints were adopted from trusted reusable evidence."
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.no_op != true }}
        with:
          include-hidden-files: true
          name: mir-evidence-${{ matrix.safe_test_id }}
          path: .work/artifacts/assurance/evidence/${{ matrix.safe_test_id }}/${{ matrix.fingerprint }}
          if-no-files-found: warn

  verification-gate:
    name: verification-gate
    if: always()
    needs:
      - plan
      - tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mir-verification-plan
          path: .work/output
      - uses: actions/download-artifact@v4
        with:
          name: mir-development-candidate
          path: .work/candidate
      - name: Resolve exact development candidate
        shell: pwsh
        run: |
          $info = Get-Content -Raw -LiteralPath info.json | ConvertFrom-Json
          $candidate = Join-Path $PWD ".work/candidate/$($info.name)_$($info.version).zip"
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Transferred development candidate is absent: $candidate"
          }
          "MIR_DEVELOPMENT_CANDIDATE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore persistent evidence ledger
        uses: actions/cache/restore@v4
        with:
          path: .work/artifacts/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mir-ledger-${{ runner.os }}-${{ github.ref_name }}-
            mir-ledger-${{ runner.os }}-
      - name: Download isolated worker evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: mir-evidence-*
          path: .work/artifacts/assurance/worker-evidence
      - name: Import exact worker evidence deterministically
        shell: pwsh
        run: ./tools/mir.ps1 verify import-workers --target $env:MIR_VALIDATION_TARGET --candidate $env:MIR_DEVELOPMENT_CANDIDATE --plan .work/output/verification-plan.json --workers .work/artifacts/assurance/worker-evidence --artifact-prefix mir-evidence-
      - name: Require exact trusted evidence for every planned instance
        shell: pwsh
        run: ./tools/mir.ps1 verify gate --target $env:MIR_VALIDATION_TARGET --candidate $env:MIR_DEVELOPMENT_CANDIDATE --plan .work/output/verification-plan.json --output .work/artifacts/assurance/evidence-bundle.json
      - name: Save updated persistent evidence ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/artifacts/assurance/evidence
          key: mir-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: mir-verification-evidence
          path: |
            .work/output/verification-plan.json
            .work/artifacts/assurance/worker-import.json
            .work/artifacts/assurance/evidence-bundle.json
          if-no-files-found: warn
