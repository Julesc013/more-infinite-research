name: MIR 5 host controls

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      native_case:
        description: Optional reviewed native case; ordinary host checks remain the default
        type: choice
        default: none
        options:
          - none
          - worker-storage-finite-four
          - worker-storage-legacy-idle
      native_mode:
        description: Compose never starts Factorio; Execute requires the reviewed native assignment
        type: choice
        default: Compose
        options:
          - Compose
          - Execute

permissions:
  contents: read

jobs:
  verification-plan:
    name: verification-plan
    if: github.event_name != 'workflow_dispatch' || inputs.native_case == 'none'
    runs-on: windows-latest
    outputs:
      plan_artifact: ${{ steps.artifact.outputs.plan_artifact }}
      plan_sha256: ${{ steps.bind.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact published historical sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin bd9774f323b6eb1561c1d9ff0c91ecc3f7acd1d1
          if ($LASTEXITCODE -ne 0) { throw 'Exact published historical oracle fetch failed.' }
          git fetch --no-tags --depth=1 origin 6776d2c749e99a8c75d7cf36470dfc800c85e661
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured MIR5 settings fetch failed.' }
          git fetch --no-tags --depth=1 origin 8643cc91bc915e008556a5315dbb0a743247e7ab
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 4.7.3 repair-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 29da2a250efa9235c9bde0f5bf9f4a9013f990a3
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 5.0.11 worker-history source fetch failed.' }
          git fetch --no-tags --depth=1 origin 411b74c364bee277b7f8bedc80679aa602935682
          if ($LASTEXITCODE -ne 0) { throw 'Exact automatic worker owner-contract regression source fetch failed.' }
          git fetch --no-tags --depth=1 origin 17e78c4d5d339413668e30e8eb422b915d390179
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 5.0.17 native-owner producer source fetch failed.' }
          git fetch --no-tags --depth=1 origin a6ace8a48dd59b3f5eb46722273d7545e0de7011
          if ($LASTEXITCODE -ne 0) { throw 'Exact passive Library personal-view fixture source fetch failed.' }
          git fetch --no-tags --depth=1 origin 57b8cd6da9b07a76f6b328dc7442d0c223c1c619
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer counterfactual source fetch failed.' }
          git fetch --no-tags --depth=1 origin c528c3990ab3479760537cc7208bd69423f7d4fd
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer continuity-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 3c6cf808745fe88741ceea0a33bf950cec8f8176
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin ef6e173a628fd8acd5e95975c40c515c2cc2ba23
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin b96435710ab415dcff9aa5614fc9868956f6d5af
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive v014 current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 0dac003903a317137cf993b5bd22074a3e5013a8
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive v015 current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin b8be5c1cdffcde416fe1afe03c294a7924a5e52c
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained direct Availability actor-source fetch failed.' }
          git fetch --no-tags --depth=1 origin d5b1870841722afdad80e115a0eb38b24dc035c4
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer counterfactual source fetch failed.' }
          git fetch --no-tags --depth=1 origin d88e1b13c334235dc1a7457af733ce812cd2d99c
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer counterfactual source fetch failed.' }
          git fetch --no-tags --depth=1 origin e794de8b198e1b53affcb9bbd7291a5b7c8cf1cb
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer counterfactual source fetch failed.' }
          git fetch --no-tags --depth=1 origin 5c51ed46d1762b4fca7480f05a057482bbbedb0a
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured F210 K2 profile-source fetch failed.' }
          git fetch --no-tags --depth=1 origin a9754abcd7405e1ddffa9f4dc8051b71d00855fe
          if ($LASTEXITCODE -ne 0) { throw 'Exact native fixture seed-order source fetch failed.' }
          git fetch --no-tags --depth=1 origin 98bab2c2d346dc508c0f008d824ebc867d920595
          if ($LASTEXITCODE -ne 0) { throw 'Exact oil reset fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 32ddafc4fece8d0c3a998a897ee9de1a3e32053e
          if ($LASTEXITCODE -ne 0) { throw 'Exact runtime science-input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin c37fca88667d550660f5b9c0efd7f272b56d6025
          if ($LASTEXITCODE -ne 0) { throw 'Exact captured Bob/Angel science-oil fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 09a66acc9c613617f95074f23f3fd9a4aab4765b
          if ($LASTEXITCODE -ne 0) { throw 'Exact pre-disabled native owner cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin ce48d0d78c68bc78779a8449f50e4dc0e6b0bc9c
          if ($LASTEXITCODE -ne 0) { throw 'Exact F200 foreign cap baseline fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 24dd0497e8f550b8b2bc2dc74b885d7a606dcf08
          if ($LASTEXITCODE -ne 0) { throw 'Exact corrected F200 cap queue fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 9ef64ff41e0c7140467df044dfe20837f1fa5a40
          if ($LASTEXITCODE -ne 0) { throw 'Exact legacy boolean cap fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin d8c6f9e1990d5b5540901d6fd4fa3c5a9e970979
          if ($LASTEXITCODE -ne 0) { throw 'Exact raw-close input fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 70e4f235dfd94e9be09d317377e8661608390069
          if ($LASTEXITCODE -ne 0) { throw 'Exact order-neutral input metadata-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 7cf634060cde6441031e744c7d155b0647fa0851
          if ($LASTEXITCODE -ne 0) { throw 'Exact removal operand fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 4fadd571dfddc93d8ac9f3482b7105d09c9fa4a7
          if ($LASTEXITCODE -ne 0) { throw 'Exact r14 F210 observer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 94806c5508d60698c4f0ecb72fd7e267344e622d
          if ($LASTEXITCODE -ne 0) { throw 'Exact r15 observer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 2fd5d0fcfd1e4173284bbae8d61a8293d439977c
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained Library render actor fetch failed.' }
          git fetch --no-tags --depth=1 origin 15f1c5d02574873dbbac7957c254acc2563b7341
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained 0.1.5 Library render fixture fetch failed.' }
