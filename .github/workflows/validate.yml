          git fetch --no-tags --depth=1 origin c528c3990ab3479760537cc7208bd69423f7d4fd
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained multiplayer continuity-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 3c6cf808745fe88741ceea0a33bf950cec8f8176
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin ef6e173a628fd8acd5e95975c40c515c2cc2ba23
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin b96435710ab415dcff9aa5614fc9868956f6d5af
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive v014 current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin 0dac003903a317137cf993b5bd22074a3e5013a8
          if ($LASTEXITCODE -ne 0) { throw 'Exact responsive v015 current Linux multiplayer fixture-source fetch failed.' }
          git fetch --no-tags --depth=1 origin b8be5c1cdffcde416fe1afe03c294a7924a5e52c
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained direct Availability actor-source fetch failed.' }
