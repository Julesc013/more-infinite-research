name: MIR4 Target Build
on:
  workflow_dispatch:
    inputs:
      source_release_record: {description: Governed source release record path, required: true, type: string}
      candidate_id: {description: Governed candidate ID, required: true, type: string}
      source_commit: {description: Exact source commit, required: true, type: string}
      source_tree: {description: Exact source tree, required: true, type: string}
      target_distribution_record_set: {description: Governed target record set path, required: true, type: string}
      release_plan_digest: {description: Governed release plan SHA-256, required: true, type: string}
      proof_root: {description: Governed proof root, required: true, type: string}
      seal_root: {description: Governed seal root, required: true, type: string}
permissions: {contents: read}
jobs:
  governed-target-matrix:
    runs-on: [self-hosted, Windows]
    env:
      MIR4_CANDIDATE_ID: ${{ inputs.candidate_id }}
      MIR4_PROOF_ROOT: ${{ inputs.proof_root }}
      MIR4_RELEASE_PLAN_DIGEST: ${{ inputs.release_plan_digest }}
      MIR4_SEAL_ROOT: ${{ inputs.seal_root }}
      MIR4_SOURCE_COMMIT: ${{ inputs.source_commit }}
      MIR4_SOURCE_RELEASE_RECORD: ${{ inputs.source_release_record }}
      MIR4_SOURCE_TREE: ${{ inputs.source_tree }}
      MIR4_TARGET_RECORD_SET: ${{ inputs.target_distribution_record_set }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, ref: "${{ inputs.source_commit }}"}
      - name: Run non-production target-build rehearsal dry-run
        shell: pwsh
        run: |
          $p=@{Phase='target-build';Operation='DryRun';SourceReleaseRecord=$env:MIR4_SOURCE_RELEASE_RECORD;CandidateId=$env:MIR4_CANDIDATE_ID;SourceCommit=$env:MIR4_SOURCE_COMMIT;SourceTree=$env:MIR4_SOURCE_TREE;TargetDistributionRecordSet=$env:MIR4_TARGET_RECORD_SET;ReleasePlanDigest=$env:MIR4_RELEASE_PLAN_DIGEST;ProofRoot=$env:MIR4_PROOF_ROOT;SealRoot=$env:MIR4_SEAL_ROOT;OutputPath='build/results/mir4-target-build/request.json'}
          ./tools/commands/mir4/Invoke-MIR4ReleaseWorkflow.ps1 @p
