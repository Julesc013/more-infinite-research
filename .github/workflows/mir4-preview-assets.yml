name: MIR4 Preview Assets
on:
  workflow_dispatch:
    inputs:
      source_release_record: {description: Governed source release record path, required: true, type: string}
      candidate_id: {description: Governed candidate ID, required: true, type: string}
      source_commit: {description: Exact source commit, required: true, type: string}
      source_tree: {description: Exact source tree, required: true, type: string}
      target_distribution_record_set: {description: Governed target record set path, required: true, type: string}
      release_plan_digest: {description: Governed release plan SHA-256, required: true, type: string}
      proof_root: {description: Governed proof root, required: true, type: string}
      seal_root: {description: Governed seal root, required: true, type: string}
permissions: {contents: read}
jobs:
  deterministic-v1-assets:
    runs-on: windows-latest
    env:
      MIR4_CANDIDATE_ID: ${{ inputs.candidate_id }}
      MIR4_PROOF_ROOT: ${{ inputs.proof_root }}
      MIR4_RELEASE_PLAN_DIGEST: ${{ inputs.release_plan_digest }}
      MIR4_SEAL_ROOT: ${{ inputs.seal_root }}
      MIR4_SOURCE_COMMIT: ${{ inputs.source_commit }}
      MIR4_SOURCE_RELEASE_RECORD: ${{ inputs.source_release_record }}
      MIR4_SOURCE_TREE: ${{ inputs.source_tree }}
      MIR4_TARGET_RECORD_SET: ${{ inputs.target_distribution_record_set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, ref: "${{ inputs.source_commit }}"}
      - name: Validate governed preview request and build four V1 assets
        shell: pwsh
        run: |
          $p=@{Phase='preview-assets';Operation='Execute';SourceReleaseRecord=$env:MIR4_SOURCE_RELEASE_RECORD;CandidateId=$env:MIR4_CANDIDATE_ID;SourceCommit=$env:MIR4_SOURCE_COMMIT;SourceTree=$env:MIR4_SOURCE_TREE;TargetDistributionRecordSet=$env:MIR4_TARGET_RECORD_SET;ReleasePlanDigest=$env:MIR4_RELEASE_PLAN_DIGEST;ProofRoot=$env:MIR4_PROOF_ROOT;SealRoot=$env:MIR4_SEAL_ROOT;OutputRoot='build/mir4/release-phase-engine/hosted-preview';OutputPath='build/results/mir4-preview-assets/request.json'}
          ./tools/commands/mir4/Invoke-MIR4ReleaseWorkflow.ps1 @p
      - name: Preserve exact preview bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mir4-v1-preview-${{ inputs.source_commit }}
          path: |
            build/mir4/release-phase-engine/hosted-preview/**/artifacts/execute/preview/mir4-api-sdk-v1-preview.zip
            build/mir4/release-phase-engine/hosted-preview/**/artifacts/execute/preview/mir4-mep-v1-preview.zip
            build/mir4/release-phase-engine/hosted-preview/**/artifacts/execute/preview/mir4-reference-extension-v1-preview.zip
            build/mir4/release-phase-engine/hosted-preview/**/artifacts/execute/preview/mir4-inspector-v1-preview.zip
            build/mir4/release-phase-engine/hosted-preview/**/artifacts/execute/preview/preview-assets.json
          if-no-files-found: error
