name: Branch Policy

on:
  push:
    branches:
      - main
      - dev
      - legacy
      - 'release/**'
  pull_request:
    branches:
      - main
      - dev
      - legacy
      - 'release/**'
  workflow_dispatch:
    inputs:
      terminal_release:
        description: Optional exact terminal release to verify for promotion
        required: false
        default: none
        type: choice
        options:
          - none
          - 3.2.11
          - 3.2.10
          - 3.2.9
          - 2.5.9
      terminal_candidate_sha:
        description: Exact immutable candidate commit from the allocation authority
        required: false
        default: ""
        type: string
      terminal_operation:
        description: Exact governed operation performed by the terminal controller
        required: false
        default: promotion
        type: choice
        options:
          - promotion
          - post-publication-sync
      terminal_candidate_ref:
        description: Exact refs/heads remote authority for post-publication synchronization
        required: false
        default: ""
        type: string
      terminal_promotion_branch:
        description: Protected branch receiving the exact verified candidate
        required: false
        default: main
        type: choice
        options:
          - main
          - legacy

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  branch-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate permanent branch policy
        shell: pwsh
        run: .\validation\tests\release\Test-MIRBranchPolicy.ps1

  terminal-promotion:
    name: promotion-verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.terminal_release != 'none' }}
    runs-on: windows-latest
    env:
      MIR_TERMINAL_CANDIDATE_REF: ${{ inputs.terminal_candidate_ref }}
      MIR_TERMINAL_CANDIDATE_SHA: ${{ inputs.terminal_candidate_sha }}
      MIR_TERMINAL_CONTROLLER_SHA: ${{ github.sha }}
      MIR_TERMINAL_OPERATION: ${{ inputs.terminal_operation }}
      MIR_TERMINAL_PROMOTION_BRANCH: ${{ inputs.terminal_promotion_branch }}
      MIR_TERMINAL_RELEASE: ${{ inputs.terminal_release }}
    steps:
      - name: Check out the dispatched package-excluded controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: controller
          ref: ${{ github.sha }}
      - name: Check out the exact immutable candidate separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: candidate
          ref: ${{ inputs.terminal_candidate_sha }}
      - id: validate
        name: Validate exact candidate, archive, acceptance, seals, and promotion boundary
        shell: pwsh
        run: |
          ./controller/tools/commands/release/Test-MIR3TerminalPromotionCandidate.ps1 `
            -Release $env:MIR_TERMINAL_RELEASE `
            -CandidateSha $env:MIR_TERMINAL_CANDIDATE_SHA `
            -ControllerSha $env:MIR_TERMINAL_CONTROLLER_SHA `
            -Operation $env:MIR_TERMINAL_OPERATION `
            -CandidateRef $env:MIR_TERMINAL_CANDIDATE_REF `
            -PromotionBranch $env:MIR_TERMINAL_PROMOTION_BRANCH `
            -RepoRoot ./candidate `
            -OutputPath "build/results/terminal-promotion/$($env:MIR_TERMINAL_RELEASE).json"
      - name: Preserve exact promotion verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mir3-terminal-promotion-${{ inputs.terminal_release }}-${{ inputs.terminal_candidate_sha }}
          path: candidate/build/results/terminal-promotion/${{ inputs.terminal_release }}.json
          if-no-files-found: warn
      - name: Attach required verification context to the immutable candidate
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          CANDIDATE_SHA: ${{ inputs.terminal_candidate_sha }}
          RELEASE: ${{ inputs.terminal_release }}
          OPERATION: ${{ inputs.terminal_operation }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Terminal candidate SHA must be a full lowercase Git commit.');
              return;
            }
            const passed = process.env.VALIDATION_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'terminal-promotion-verification',
              head_sha: sha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              details_url: runUrl,
              output: {
                title: `MIR 3 ${process.env.RELEASE} ${process.env.OPERATION} verification`,
                summary: passed
                  ? 'The exact candidate, archive, release authority, remote candidate ref, and requested terminal boundary passed the current package-excluded controller.'
                  : 'Terminal promotion verification failed closed. Inspect the workflow evidence; branch promotion is forbidden.'
              }
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: 'terminal-promotion-verification',
              target_url: runUrl,
              description: passed
                ? `Exact MIR 3 candidate passed ${process.env.OPERATION} verification.`
                : 'Terminal promotion verification failed closed.'
            });
            if (!passed) core.setFailed('Terminal promotion verification did not pass.');
