name: Branch Policy

on:
  push:
    branches:
      - main
      - dev
      - legacy
  pull_request:
    branches:
      - main
      - dev
      - legacy
  workflow_dispatch:
    inputs:
      terminal_release:
        description: Optional exact terminal release to verify for promotion
        required: false
        default: none
        type: choice
        options:
          - none
          - 3.2.10
          - 3.2.9
          - 2.5.9
      terminal_candidate_sha:
        description: Exact immutable candidate commit from the allocation authority
        required: false
        default: ""
        type: string
      terminal_operation:
        description: Exact governed operation performed by the terminal controller
        required: false
        default: promotion
        type: choice
        options:
          - promotion
          - post-publication-sync
      terminal_candidate_ref:
        description: Exact refs/heads remote authority for post-publication synchronization
        required: false
        default: ""
        type: string
      terminal_promotion_branch:
        description: Protected branch receiving the exact verified candidate
        required: false
        default: main
        type: choice
        options:
          - main
          - legacy

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  branch-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate permanent branch policy
        shell: pwsh
        run: .\validation\tests\release\Test-MIRBranchPolicy.ps1

  terminal-promotion:
    name: promotion-verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.terminal_release != 'none' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.terminal_candidate_sha }}
      - id: validate
        name: Validate exact candidate, archive, acceptance, seals, and promotion boundary
        shell: pwsh
        run: |
          ./tools/commands/release/Test-MIR3TerminalPromotionCandidate.ps1 `
            -Release '${{ inputs.terminal_release }}' `
            -CandidateSha '${{ inputs.terminal_candidate_sha }}' `
            -Operation '${{ inputs.terminal_operation }}' `
            -CandidateRef '${{ inputs.terminal_candidate_ref }}' `
            -PromotionBranch '${{ inputs.terminal_promotion_branch }}' `
            -OutputPath 'build/results/terminal-promotion/${{ inputs.terminal_release }}.json'
      - name: Preserve exact promotion verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir3-terminal-promotion-${{ inputs.terminal_release }}-${{ inputs.terminal_candidate_sha }}
          path: build/results/terminal-promotion/${{ inputs.terminal_release }}.json
          if-no-files-found: warn
      - name: Attach required verification context to the immutable candidate
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          CANDIDATE_SHA: ${{ inputs.terminal_candidate_sha }}
          RELEASE: ${{ inputs.terminal_release }}
          OPERATION: ${{ inputs.terminal_operation }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Terminal candidate SHA must be a full lowercase Git commit.');
              return;
            }
            const passed = process.env.VALIDATION_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'terminal-promotion-verification',
              head_sha: sha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              details_url: runUrl,
              output: {
                title: `MIR 3 ${process.env.RELEASE} ${process.env.OPERATION} verification`,
                summary: passed
                  ? 'The exact candidate, archive, release authority, remote candidate ref, and requested terminal boundary passed the current package-excluded controller.'
                  : 'Terminal promotion verification failed closed. Inspect the workflow evidence; branch promotion is forbidden.'
              }
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: 'terminal-promotion-verification',
              target_url: runUrl,
              description: passed
                ? `Exact MIR 3 candidate passed ${process.env.OPERATION} verification.`
                : 'Terminal promotion verification failed closed.'
            });
            if (!passed) core.setFailed('Terminal promotion verification did not pass.');
