name: Branch Policy

on:
  push:
    branches:
      - main
      - dev
      - legacy
      - 'release/**'
  pull_request:
    branches:
      - main
      - dev
      - legacy
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate permanent branch policy
        shell: pwsh
        run: .\tests\release\Test-MIRBranchPolicy.ps1
