name: Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full source commit SHA to validate"
        required: true
      archive_sha256:
        description: "Expected SHA-256 of the exact release archive"
        required: true
      release_profile:
        description: "Release-targeted run profile"
        required: true
        default: "release-targeted-2.1"

jobs:
  exact-candidate:
    runs-on: [self-hosted, Windows]
    environment: release-candidate
    steps:
      - name: Check out immutable release controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: controller

      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate

      - name: Verify immutable source identity
        shell: pwsh
        run: |
          if ((git -C candidate rev-parse HEAD).Trim() -ne '${{ inputs.candidate_sha }}') {
            throw 'Checked-out source does not match candidate_sha.'
          }
          if (git -C candidate status --porcelain --untracked-files=all) {
            throw 'Release-candidate checkout is not clean.'
          }
          if (git -C controller status --porcelain --untracked-files=all) {
            throw 'Release-controller checkout is not clean.'
          }

      - name: Build and verify exact archive
        id: package
        shell: pwsh
        run: |
          Push-Location candidate
          try {
            ./tools/commands/package/Build-MIRPackage.ps1
            $info = Get-Content info.json -Raw | ConvertFrom-Json
          } finally {
            Pop-Location
          }
          $candidateArchive = "candidate/dist/more-infinite-research_$($info.version).zip"
          $controllerArchive = "controller/dist/more-infinite-research_$($info.version).zip"
          foreach ($archive in @($candidateArchive, $controllerArchive)) {
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Required exact candidate archive is absent: $archive"
            }
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($actual -ne '${{ inputs.archive_sha256 }}') {
              throw "Archive SHA mismatch for ${archive}: expected ${{ inputs.archive_sha256 }}, got $actual"
            }
          }
          "candidate_archive=$($candidateArchive.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "controller_archive=$($controllerArchive.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run complete exact-dist validation
        shell: pwsh
        working-directory: controller
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
        run: ./scripts/Invoke-MIRValidation.ps1 -FactorioBin $env:FACTORIO_BIN

      - name: Run strict targeted compatibility gate
        shell: pwsh
        working-directory: controller
        env:
          FACTORIO_BIN: ${{ secrets.FACTORIO_BIN }}
        run: ./tools/mir.ps1 release gate --profile '${{ inputs.release_profile }}' --no-git-pull

      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: release-candidate-${{ inputs.candidate_sha }}
          path: |
            ${{ steps.package.outputs.candidate_archive }}
            ${{ steps.package.outputs.controller_archive }}
            controller/build/results/validation/*.json
            controller/build/results/release-gate/**
          if-no-files-found: error
