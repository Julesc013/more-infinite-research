name: Assurance Promotion Check

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Sealed source commit"
        required: true
      seal_path:
        description: "Tracked candidate seal path"
        required: true
        default: ".mir/evidence/candidate-seals/mir-3.2.1-factorio-2.1.json"

permissions:
  contents: read

jobs:
  verify-seal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify sealed bytes and evidence only
        shell: pwsh
        env:
          MIR_SEAL_PATH: ${{ inputs.seal_path }}
        run: ./tools/mir.ps1 assurance check-seal --seal $env:MIR_SEAL_PATH --json
