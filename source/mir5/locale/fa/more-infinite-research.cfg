[technology-name]
more-infinite-research.research_gears=بهره وری چرخ دنده آهنی

[technology-description]
more-infinite-research.recipe_productivity=بهره وری دستور غذا را برای دستور العمل های انتخابی افزایش می دهد. حداکثر سقف بهره وری فاکتوریو همچنان اعمال می شود. سطوح بی نهایت اضافی ممکن است زمانی که دستور پخت به سقف خود برسد، اثر عملی نداشته باشد.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]پیشرفته:[/color][/font] تعمیر دیوار و دروازه غیرفعال
ips-enable-stream=[font=default-bold]__1__[/font] — فعال کنید
ips-cost-base-stream=[font=default-bold]__1__[/font] — هزینه پایه
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — هزینه افزودنی در هر سطح
ips-cost-growth-stream=[font=default-bold]__1__[/font] — ضریب نمایی
ips-max-level-stream=[font=default-bold]__1__[/font] — حداکثر سطح
ips-research-time-stream=[font=default-bold]__1__[/font] — زمان تحقیق
mir-settings-profile-import=[font=default-bold][color=purple]پیشرفته:[/color][/font] وارد کردن نمایه تنظیمات MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — اثر در هر سطح

[mod-setting-description]
mir-enable-passive-repair=پیش‌فرض خاموش است. دیوارها و دروازه های آسیب دیده متعلق به نیروی بازیکن یا متحدان متقابل آن را پس از 10 ثانیه بدون آسیب بیشتر بازسازی رایگان می کند. تعمیرات حداکثر 1 مورد بهداشت در هر بازدید از خدمات، با 8 نهاد معلق در هر ثانیه و حداکثر 256 مورد ردیابی. صف های آسیب بزرگ با کندی ترمیم می شوند. از بسته های تعمیر استفاده نمی کند، حداکثر سلامت را تغییر نمی دهد، یا موجودیت های تخریب شده را احیا نمی کند. در مورد آسیب دریافتی در حالت فعال اعمال می شود. آسیب موجود اسکن نشده است. پس از تغییر تنظیمات راه‌اندازی به راه‌اندازی مجدد نیاز دارد.
ips-enable-stream=فناوری بی نهایت تولید شده را برای __1__ هنگامی که دستور العمل ها، جلوه ها، پیش نیازها و بسته های علمی آن در دسترس هستند ایجاد می کند. برای جلوگیری از تولید این فناوری توسط MIR، آن را غیرفعال کنید.
ips-cost-base-stream=واحدهای تحقیقاتی مورد نیاز برای اولین سطح تولید شده __1__. باید حداقل 1 باشد. سطوح بعدی از این مقدار و ضریب رشد هزینه محاسبه می شود.
ips-cost-linear-increment-stream=واحدهای تحقیقاتی برای هر سطح بعدی __1__ قبل از اعمال ضریب نمایی اضافه شد. از 0 برای هزینه های ثابت یا صرفاً نمایی استفاده کنید.
ips-cost-growth-stream=برای هر سطح بعدی __1__ ضریب اعمال می‌شود. از 1 برای هزینه های ثابت، 1.5 برای 50% رشد در هر سطح، یا 2 برای دوبرابر کردن هزینه ها استفاده کنید.
ips-max-level-stream=بالاترین سطح تولید شده برای __1__. برای سطوح بی نهایت روی 0 تنظیم کنید.
ips-research-time-stream=ثانیه در هر واحد تحقیقاتی برای __1__. برای استفاده از پیش‌فرض MIR برای این فناوری، روی 0 تنظیم کنید. این زمان کل تحقیق نیست. زمان کل نیز به هزینه تحقیق، تعداد آزمایشگاه، سرعت آزمایشگاه و ماژول ها بستگی دارد.
mir-settings-profile-import=یک رشته نمایه تنظیمات MIR را در اینجا بچسبانید تا مقادیر تنظیم راه‌اندازی صادر شده را به‌عنوان یک لایه لغو در طول تولید نمونه اولیه اعمال کنید. برای تنظیمات عادی خالی بگذارید. با /mir-settings-export از یک ذخیره فعال صادر کنید، سپس پس از تغییر این مقدار دوباره راه اندازی کنید.
ips-effect-per-level-stream=جلوه لایه پایه اولیه را در هر سطح برای __1__ تنظیم می‌کند. سطوح و جلوه‌های بعدی مرتبط به نسبت مقیاس‌بندی می‌شوند. اثرات درصد استفاده از نقاط درصد. افکت های شمارش و فاصله از واحدهای بومی خود استفاده می کنند.
