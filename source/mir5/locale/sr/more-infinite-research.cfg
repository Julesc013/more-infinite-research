[technology-name]
more-infinite-research.research_spoilage_preservation=Очување кварења
more-infinite-research.research_agricultural_growth_speed=Брзина раста пољопривреде
more-infinite-research.research_gears=Продуктивност гвозденог зупчаника

[technology-description]
more-infinite-research.spoilage_preservation=Повећава глобални модификатор времена квара кроз ограничени ефекат скрипте. Постојећи предмети који се могу покварити могу задржати своје тренутне рокове за плијен док се не тестирају у игри.
more-infinite-research.agricultural_growth_speed=Скраћује преостало време раста за новозасађене пољопривредне торањске биљке кроз ограничени ефекат скрипте.
more-infinite-research.recipe_productivity=Повећава продуктивност рецептура за изабране рецепте. Фацторио-ова максимална продуктивност и даље важи; додатни бесконачни нивои можда неће имати практичан ефекат када рецепт достигне свој максимум.

[modifier-description]
more-infinite-research.spoilage_preservation=Време кварења: +__1__% по нивоу
more-infinite-research.agricultural_growth_speed=Брзина раста пољопривреде: +__1__% по нивоу

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Компатибилност:[/color][/font] Дозволите све модуле у постојећим слотовима
mir-enable-passive-repair=[font=default-bold][color=purple]напредно:[/color][/font] Пасивна поправка зидова и капија
ips-enable-stream=[font=default-bold]__1__[/font] — омогућити
ips-cost-base-stream=[font=default-bold]__1__[/font] — основни трошак
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — адитивна цена по нивоу
ips-cost-growth-stream=[font=default-bold]__1__[/font] — експоненцијални множилац
ips-max-level-stream=[font=default-bold]__1__[/font] — максимални ниво
ips-research-time-stream=[font=default-bold]__1__[/font] — време истраживања
mir-settings-profile-import=[font=default-bold][color=purple]напредно:[/color][/font] Увезите профил подешавања МИР-а
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — ефекат по нивоу

[mod-setting-description]
mir-note-experimental-spoilage=Ризична технологија. Омогућено подразумевано. Његов глобални/скриптни ефекат на целој мапи може променити време кварења; постојеће покварљиве наслаге могу задржати тренутне рокове док се не поправе или потврде. Онемогућите га пре учитавања чувања ако је очување постојећег времена кварења критично.
mir-note-agriculture-growth=Односи се на новозасађене пољопривредне културе. Постојећи засађени усеви се не мењају.
mir-unrestricted-modules=Експериментално и разбијање равнотеже. Када је омогућен, сваки постојећи рецепт прихвата свих пет ефеката модула и сваки постојећи пријемник модула са слотовима прихвата сваку откривену категорију модула. Ово не додаје уторе за модуле нити мења прототипове модула и може омогућити продуктивност, квалитет и петље модификованих модула.
mir-enable-passive-repair=Подразумевано искључено. Даје оштећеним зидовима и капијама у власништву силе играча или његових заједничких савезника бесплатну регенерацију након 10 секунди без даљег оштећења. Поправке највише 1 здравственог стања по посети сервису, са 8 нерешених ентитета који се сервисирају сваке секунде и највише 256 праћених. Велики редови оштећења поправљају се спорије. Не користи пакете за поправку, не мења максимално здравље или оживљава уништене ентитете. Односи се на штету примљену док је омогућена; постојећа оштећења се не скенирају. Захтева поновно покретање након промене ове поставке за покретање.
ips-enable-stream=Ствара генерисану бесконачну технологију за __1__ када су његови рецепти, ефекти, предуслови и научни пакети доступни. Онемогућите ово да спречите МИР да генерише ову технологију.
ips-cost-base-stream=Истраживачке јединице потребне за први генерисани ниво __1__. Мора бити најмање 1. Каснији нивои се израчунавају из ове вредности и фактора раста трошкова.
ips-cost-linear-increment-stream=Истраживачке јединице су додате за сваки каснији ниво __1__ пре него што се примени експоненцијални множилац. Користите 0 за фиксне или чисто експоненцијалне трошкове.
ips-cost-growth-stream=Множилац се примењује на сваки каснији ниво __1__. Користите 1 за паушалне трошкове, 1,5 за раст од 50% по нивоу или 2 за удвостручење трошкова.
ips-max-level-stream=Највиши генерисани ниво за __1__. Поставите на 0 за бесконачне нивое.
ips-research-time-stream=Секунди по истраживачкој јединици за __1__. Подесите на 0 да бисте користили МИР подразумеване вредности за ову технологију. Ово није укупно време истраживања; укупно време такође зависи од трошкова истраживања, броја лабораторија, брзине лабораторије и модула.
mir-settings-profile-import=Овде налепите стринг профила подешавања МИР-а да бисте применили извезене вредности подешавања за покретање као слој за замена током генерисања прототипа. Оставите празно за нормална подешавања. Извезите помоћу /мир-сеттингс-екпорт из активног чувања, а затим поново покрените након промене ове вредности.
ips-effect-per-level-stream=Поставља примарни ефекат основног нивоа по нивоу за __1__. Повезани каснији нивои и ефекти се пропорционално скалирају. Процентуални ефекти користе процентне поене; ефекти бројања и удаљености користе своје изворне јединице.
