ips-effect-per-level-stream=[font=default-bold]__1__[/font] — ефекат по нивоу

[mod-setting-description]
mir-enable-passive-repair=Подразумевано искључено. Даје оштећеним зидовима и капијама у власништву силе играча или његових заједничких савезника бесплатну регенерацију након 10 секунди без даљег оштећења. Поправке највише 1 здравственог стања по посети сервису, са 8 нерешених ентитета који се сервисирају сваке секунде и највише 256 праћених. Велики редови оштећења поправљају се спорије. Не користи пакете за поправку, не мења максимално здравље или оживљава уништене ентитете. Односи се на штету примљену док је омогућена; постојећа оштећења се не скенирају. Захтева поновно покретање након промене ове поставке за покретање.
ips-enable-stream=Ствара генерисану бесконачну технологију за __1__ када су његови рецепти, ефекти, предуслови и научни пакети доступни. Онемогућите ово да спречите МИР да генерише ову технологију.
ips-cost-base-stream=Истраживачке јединице потребне за први генерисани ниво __1__. Мора бити најмање 1. Каснији нивои се израчунавају из ове вредности и фактора раста трошкова.
ips-cost-linear-increment-stream=Истраживачке јединице су додате за сваки каснији ниво __1__ пре него што се примени експоненцијални множилац. Користите 0 за фиксне или чисто експоненцијалне трошкове.
ips-cost-growth-stream=Множилац се примењује на сваки каснији ниво __1__. Користите 1 за паушалне трошкове, 1,5 за раст од 50% по нивоу или 2 за удвостручење трошкова.
ips-max-level-stream=Највиши генерисани ниво за __1__. Поставите на 0 за бесконачне нивое.
ips-research-time-stream=Секунди по истраживачкој јединици за __1__. Подесите на 0 да бисте користили МИР подразумеване вредности за ову технологију. Ово није укупно време истраживања; укупно време такође зависи од трошкова истраживања, броја лабораторија, брзине лабораторије и модула.
mir-settings-profile-import=Овде налепите стринг профила подешавања МИР-а да бисте применили извезене вредности подешавања за покретање као слој за замена током генерисања прототипа. Оставите празно за нормална подешавања. Извезите помоћу /мир-сеттингс-екпорт из активног чувања, а затим поново покрените након промене ове вредности.
ips-effect-per-level-stream=Поставља примарни ефекат основног нивоа по нивоу за __1__. Повезани каснији нивои и ефекти се пропорционално скалирају. Процентуални ефекти користе процентне поене; ефекти бројања и удаљености користе своје изворне јединице.
