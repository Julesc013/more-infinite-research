[technology-name]
more-infinite-research.research_gears=Produktiviteti i rrotave me ingranazhe hekuri

[technology-description]
more-infinite-research.recipe_productivity=Rrit produktivitetin e recetave për recetat e zgjedhura. Kufiri maksimal i produktivitetit të Factorio ende vlen; Nivelet shtesë të pafundme mund të mos kenë efekt praktik sapo një recetë të arrijë kufirin e saj.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]E avancuar:[/color][/font] Riparim pasiv i mureve dhe portës
ips-enable-stream=[font=default-bold]__1__[/font] — aktivizo
ips-cost-base-stream=[font=default-bold]__1__[/font] — kostoja bazë
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — kosto shtesë për nivel
ips-cost-growth-stream=[font=default-bold]__1__[/font] — rritja e kostos
ips-max-level-stream=[font=default-bold]__1__[/font] — niveli maksimal
ips-research-time-stream=[font=default-bold]__1__[/font] — koha e kërkimit
mir-settings-profile-import=[font=default-bold][color=purple]E avancuar:[/color][/font] Importo profilin e cilësimeve MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efekt për nivel

[mod-setting-description]
mir-enable-passive-repair=Parazgjedhja e çaktivizuar. Jep mure dhe porta të dëmtuara në pronësi të forcës së lojtarit ose aleatëve të tij të ndërsjellë rigjenerim falas pas 10 sekondash pa dëmtime të mëtejshme. Riparime maksimumi 1 shëndetësor për vizitë shërbimi, me 8 subjekte pezull të servisuara çdo sekondë dhe maksimumi 256 të gjurmuara. Radhët e mëdha të dëmeve riparohen më ngadalë. Nuk përdor paketa riparimi, nuk ndryshon shëndetin maksimal ose nuk ringjall entitetet e shkatërruara. Zbatohet për dëmtimin e marrë kur është aktivizuar; dëmtimi ekzistues nuk skanohet. Kërkon një rinisje pas ndryshimit të këtij cilësimi të nisjes.
ips-enable-stream=Krijon teknologjinë e pafund të gjeneruar për __1__ kur recetat, efektet, kushtet paraprake dhe paketat shkencore janë të disponueshme. Çaktivizoni këtë për të parandaluar që MIR të gjenerojë këtë teknologji.
ips-cost-base-stream=Kërkohen njësi kërkimore për nivelin e parë të gjeneruar prej __1__. Duhet të jetë së paku 1. Nivelet e mëvonshme llogariten nga kjo vlerë dhe nga faktori i rritjes së kostos.
ips-cost-linear-increment-stream=Njësi kërkimore të shtuara për çdo nivel të mëvonshëm prej __1__ përpara se të aplikohet shumëzuesi eksponencial. Përdorni 0 për kosto fikse ose thjesht eksponenciale.
ips-cost-growth-stream=Shumëzuesi i aplikuar për çdo nivel të mëvonshëm prej __1__. Përdorni 1 për kostot e sheshta, 1.5 për rritje 50% për nivel, ose 2 për dyfishimin e kostove.
ips-max-level-stream=Niveli më i lartë i gjeneruar për __1__. Vendoseni në 0 për nivele të pafundme.
ips-research-time-stream=Sekonda për njësi kërkimore për __1__. Vendoseni në 0 për të përdorur parazgjedhjen e MIR për këtë teknologji. Kjo nuk është koha totale e hulumtimit; koha totale varet gjithashtu nga kostoja e kërkimit, numri i laboratorit, shpejtësia e laboratorit dhe modulet.
mir-settings-profile-import=Ngjitni një varg të profilit të cilësimeve MIR këtu për të aplikuar vlerat e eksportuara të konfigurimit të nisjes si një shtresë anashkaluese gjatë krijimit të prototipit. Lëreni bosh për cilësimet normale. Eksporto me /mir-settings-export nga një kurs aktiv, më pas rifillo pasi të ndryshosh këtë vlerë.
ips-effect-per-level-stream=Vendos efektin primar të nivelit bazë për nivel për __1__. Nivelet dhe efektet e mëvonshme të lidhura janë shkallëzuar proporcionalisht. Efektet në përqindje përdorin pikë përqindjeje; efektet e numërimit dhe distancës përdorin njësitë e tyre amtare.
