[technology-name]
more-infinite-research.research_spoilage_preservation=貪腐保存
more-infinite-research.research_agricultural_growth_speed=農業成長速度
more-infinite-research.research_gears=鐵齒輪生產力

[technology-description]
more-infinite-research.spoilage_preservation=透過有界腳本效果增加全域破壞時間修改器。現有的可破壞物品可能會保留當前的破壞期限，直到在遊戲中進行測試。
more-infinite-research.agricultural_growth_speed=透過有限的腳本效果縮短新種植的農業塔式植物的剩餘生長時間。
more-infinite-research.recipe_productivity=提高所選配方的配方生產率。異星工廠的最高生產力上限仍然適用；一旦配方達到上限，額外的無限等級可能沒有實際效果。

[modifier-description]
more-infinite-research.spoilage_preservation=腐敗時間：+__1__% 每等級
more-infinite-research.agricultural_growth_speed=農業成長速度：+__1__% 每等級

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]相容性：[/color][/font] 允許現有插槽中的所有模組
mir-enable-passive-repair=[font=default-bold][color=purple]高級：[/color][/font]被動牆與維脩大門
ips-enable-stream=[font=default-bold]__1__[/font] — 啟用
ips-cost-base-stream=[font=default-bold]__1__[/font] — 基本成本
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — 每等級的附加成本
ips-cost-growth-stream=[font=default-bold]__1__[/font] — 指數乘數
ips-max-level-stream=[font=default-bold]__1__[/font] — 最高級別
ips-research-time-stream=[font=default-bold]__1__[/font] — 研究時間
mir-settings-profile-import=[font=default-bold][color=purple]進階：[/color][/font] 匯入 MIR 設定設定檔
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — 每等級效果

[mod-setting-description]
mir-note-experimental-spoilage=危險技術。預設啟用。其全域/地圖範圍內的腳本效果可以改變破壞時間；現有的易損壞堆疊可能會保留目前的截止日期，直到重建或重新驗證為止。如果保留現有的損壞時間至關重要，請在載入儲存之前停用它。
mir-note-agriculture-growth=適用於新種植的塔式作物。現有種植作物不會重新調整規模。
mir-unrestricted-modules=實驗性且打破平衡。啟用後，每個現有配方都會接受所有五個模組效果，每個帶有插槽的現有模組接收器都會接受每個發現的模組類別。這不會添加模組插槽或更改模組原型，並且可以實現生產力、品質和模組化模組循環。
mir-enable-passive-repair=預設關閉。 10 秒後，為玩家部隊或其共同盟友所擁有的受損牆壁和大門提供免費再生，而不會造成進一步傷害。每次服務存取最多修復 1 個運作狀況，每秒服務 8 個待處理實體，最多追蹤 256 個實體。大的損壞隊列修復速度較慢。不使用修理包、改變最大生命值或復活被破壞的實體。適用於啟用時受到的傷害；不掃描現有損壞。更改此啟動設定後需要重新啟動。
ips-enable-stream=當其配方、效果、先決條件和科學包可用時，為__1__創建生成的無限技術。停用此選項可防止 MIR 產生該技術。
ips-cost-base-stream=第一個生成等級__1__所需的研究單位。必須至少為 1。後續等級根據該值和成本增長因子計算。
ips-cost-linear-increment-stream=為每個更高級別添加的研究單位 __1__ 在應用指數乘數之前。使用 0 表示固定或純指數成本。
ips-cost-growth-stream=乘數應用於__1__ 的每個後續等級。使用 1 表示固定成本，使用 1.5 表示每等級成長 50%，或使用 2 表示成本加倍。
ips-max-level-stream=__1__ 的最高生成等級。設定為 0 表示無限等級。
ips-research-time-stream=__1__ 每個研究單位的秒數。設定為 0 以使用 MIR 對此技術的預設設定。這不是總的研究時間；總時間還取決於研究成本、實驗室數量、實驗室速度和模組。
mir-settings-profile-import=在此處貼上 MIR 設定設定檔字串，以在原型產生期間套用匯出的啟動設定值作為覆蓋層。對於正常設定留空。使用 /mir-settings-export 從活動保存匯出，然後在變更此值後重新啟動。
ips-effect-per-level-stream=設定__1__每個等級的主要基礎層效果。相關的後續層和效果按比例縮放。百分比效應使用百分點；計數和距離效果使用其原生單位。
