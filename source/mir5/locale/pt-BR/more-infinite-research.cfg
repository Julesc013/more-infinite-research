[technology-name]
more-infinite-research.research_gears=Produtividade de engrenagens de ferro

[technology-description]
more-infinite-research.recipe_productivity=Aumenta a produtividade das receitas selecionadas. O limite máximo de produtividade do Factorio ainda se aplica; níveis infinitos adicionais podem não ter efeito prático quando uma receita atinge seu limite.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Avançado:[/color][/font] Reparação passiva de paredes e portões
ips-enable-stream=[font=default-bold]__1__[/font] — ativar
ips-cost-base-stream=[font=default-bold]__1__[/font] — custo base
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — custo aditivo por nível
ips-cost-growth-stream=[font=default-bold]__1__[/font] — crescimento de custos
ips-max-level-stream=[font=default-bold]__1__[/font] — nível máximo
ips-research-time-stream=[font=default-bold]__1__[/font] — tempo de pesquisa
mir-settings-profile-import=[font=default-bold][color=purple]Avançado:[/color][/font] Importar perfil de configurações MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efeito por nível

[mod-setting-description]
mir-enable-passive-repair=Padrão desativado. Concede a paredes e portões danificados de propriedade da força do jogador ou de seus aliados mútuos regeneração gratuita após 10 segundos sem mais danos. Repara no máximo 1 saúde por visita de serviço, com 8 entidades pendentes atendidas a cada segundo e no máximo 256 rastreadas. Grandes filas de danos são reparadas mais lentamente. Não usa pacotes de reparo, altera a saúde máxima ou revive entidades destruídas. Aplica-se ao dano recebido enquanto ativado; os danos existentes não são verificados. Requer reinicialização após alterar esta configuração de inicialização.
ips-enable-stream=Cria a tecnologia infinita gerada para __1__ quando suas receitas, efeitos, pré-requisitos e pacotes científicos estão disponíveis. Desative isto para evitar que o MIR gere esta tecnologia.
ips-cost-base-stream=Unidades de pesquisa necessárias para o primeiro nível gerado de __1__. Deve ser pelo menos 1. Os níveis posteriores são calculados a partir deste valor e do fator de crescimento de custo.
ips-cost-linear-increment-stream=Unidades de pesquisa adicionadas para cada nível posterior de __1__ antes que o multiplicador exponencial seja aplicado. Use 0 para custos fixos ou puramente exponenciais.
ips-cost-growth-stream=Multiplicador aplicado a cada nível posterior de __1__. Use 1 para custos fixos, 1,5 para crescimento de 50% por nível ou 2 para duplicar custos.
ips-max-level-stream=Nível gerado mais alto para __1__. Defina como 0 para níveis infinitos.
ips-research-time-stream=Segundos por unidade de pesquisa para __1__. Defina como 0 para usar o padrão MIR para esta tecnologia. Este não é o tempo total de pesquisa; o tempo total também depende do custo da pesquisa, contagem do laboratório, velocidade do laboratório e módulos.
mir-settings-profile-import=Cole uma string de perfil de configurações MIR aqui para aplicar valores de configuração de inicialização exportados como uma camada de substituição durante a geração do protótipo. Deixe em branco para configurações normais. Exporte com /mir-settings-export de um salvamento ativo e reinicie após alterar esse valor.
ips-effect-per-level-stream=Define o efeito da camada base primária por nível para __1__. Os níveis e efeitos posteriores relacionados são dimensionados proporcionalmente. Os efeitos percentuais usam pontos percentuais; efeitos de contagem e distância usam suas unidades nativas.
