[technology-name]
more-infinite-research.research_gears=פרודוקטיביות של גלגל שיניים מברזל

[technology-description]
more-infinite-research.recipe_productivity=מגביר את פרודוקטיביות המתכונים עבור המתכונים שנבחרו. מכסת הפרודוקטיביות המקסימלית של פקטוריו עדיין חלה; לרמות אינסופיות נוספות ייתכן שלא תהיה השפעה מעשית ברגע שמתכון מגיע למכסה.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]מתקדם:[/color][/font] תיקון קיר ושער פסיבי
ips-enable-stream=[font=default-bold]__1__[/font] — אפשר
ips-cost-base-stream=[font=default-bold]__1__[/font] — עלות בסיס
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — עלות נוספת לרמה
ips-cost-growth-stream=[font=default-bold]__1__[/font] — מכפיל מעריכי
ips-max-level-stream=[font=default-bold]__1__[/font] — רמה מקסימלית
ips-research-time-stream=[font=default-bold]__1__[/font] — זמן מחקר
mir-settings-profile-import=[font=default-bold][color=purple]מתקדם:[/color][/font] ייבוא פרופיל הגדרות MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — השפעה לכל רמה

[mod-setting-description]
mir-enable-passive-repair=ברירת מחדל כבויה. מעניק לחומות ושערים פגומים בבעלות כוח השחקן או בעלי בריתו ההדדיים התחדשות חינם לאחר 10 שניות ללא נזק נוסף. תיקונים לכל היותר בריאות 1 לכל ביקור שירות, כאשר 8 ישויות ממתינות מטופלות בכל שנייה ולכל היותר 256 במעקב. תורי נזקים גדולים מתקנים לאט יותר. אינו משתמש בחבילות תיקון, אינו משנה בריאות מקסימלית או מחייה ישויות שנהרסו. חל על נזק שהתקבל בזמן מופעל; נזק קיים אינו נסרק. דורש הפעלה מחדש לאחר שינוי הגדרת הפעלה זו.
ips-enable-stream=יוצר את הטכנולוגיה האינסופית שנוצרה עבור __1__ כאשר המתכונים, האפקטים, הדרישות המוקדמות וחבילות המדע שלה זמינים. השבת זאת כדי למנוע מ-MIR ליצור טכנולוגיה זו.
ips-cost-base-stream=יחידות מחקר נדרשות לרמה הראשונה שנוצרה של __1__. חייב להיות לפחות 1. רמות מאוחרות יותר מחושבות מערך זה ומגורם הגידול בעלויות.
ips-cost-linear-increment-stream=יחידות מחקר שנוספו עבור כל רמה מאוחרת יותר של __1__ לפני הפעלת המכפיל האקספוננציאלי. השתמש ב-0 עבור עלויות קבועות או אקספוננציאליות בלבד.
ips-cost-growth-stream=מכפיל מוחל על כל רמה מאוחרת יותר של __1__. השתמש ב-1 עבור עלויות אחידות, 1.5 עבור צמיחה של 50% לכל רמה, או 2 עבור הכפלת עלויות.
ips-max-level-stream=הרמה הגבוהה ביותר שנוצרה עבור __1__. הגדר ל-0 עבור אינסוף רמות.
ips-research-time-stream=שניות ליחידת מחקר עבור __1__. הגדר ל-0 כדי להשתמש בברירת המחדל של MIR עבור טכנולוגיה זו. זה לא זמן מחקר כולל; הזמן הכולל תלוי גם בעלות המחקר, ספירת המעבדה, מהירות המעבדה והמודולים.
mir-settings-profile-import=הדבק כאן מחרוזת פרופיל הגדרות MIR כדי להחיל ערכי הגדרות הפעלה מיוצאים כשכבת עקיפה במהלך יצירת אב טיפוס. השאר ריק עבור הגדרות רגילות. ייצא עם /mir-settings-export משמירה פעילה, ולאחר מכן הפעל מחדש לאחר שינוי ערך זה.
ips-effect-per-level-stream=מגדיר את אפקט שכבת הבסיס הראשית לכל רמה עבור __1__. שכבות והשפעות מאוחרות יותר קשורות מותאמות באופן פרופורציונלי. אחוז ההשפעות משתמש באחוזים; אפקטים של ספירה ומרחק משתמשים ביחידות המקוריות שלהם.
