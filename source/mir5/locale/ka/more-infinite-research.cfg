[technology-name]
more-infinite-research.research_gears=რკინის გადაცემათა კოლოფის პროდუქტიულობა

[technology-description]
more-infinite-research.recipe_productivity=ზრდის რეცეპტის პროდუქტიულობას შერჩეული რეცეპტებისთვის. Factorio-ს მაქსიმალური პროდუქტიულობის ზღვარი კვლავ მოქმედებს; დამატებით უსასრულო დონეებს შეიძლება არ ჰქონდეს პრაქტიკული ეფექტი, როგორც კი რეცეპტი მიაღწევს მაქსიმუმს.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]გაფართოებული:[/color][/font] პასიური კედლისა და კარიბჭის შეკეთება
ips-enable-stream=[font=default-bold]__1__[/font] — ჩართვა
ips-cost-base-stream=[font=default-bold]__1__[/font] — საბაზისო ღირებულება
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — დანამატის ღირებულება დონეზე
ips-cost-growth-stream=[font=default-bold]__1__[/font] — ექსპონენციური მულტიპლიკატორი
ips-max-level-stream=[font=default-bold]__1__[/font] — მაქსიმალური დონე
ips-research-time-stream=[font=default-bold]__1__[/font] — კვლევის დრო
mir-settings-profile-import=[font=default-bold][color=purple] გაფართოებული:[/color][/font] MIR პარამეტრების პროფილის იმპორტი
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — ეფექტი დონეზე

[mod-setting-description]
mir-enable-passive-repair=ნაგულისხმევი გამორთულია. აძლევს დაზიანებულ კედლებს და ჭიშკარს, რომელიც ეკუთვნის მოთამაშის ძალას ან მის ორმხრივ მოკავშირეებს, უფასო რეგენერაციას 10 წამის შემდეგ შემდგომი დაზიანების გარეშე. რემონტს ატარებს მაქსიმუმ 1 ჯანმრთელობაზე თითო ვიზიტზე, 8 მომლოდინე სუბიექტის მომსახურეობას ყოველ წამში და მაქსიმუმ 256 თვალყურს ადევნებს. დიდი ზიანის რიგები უფრო ნელა აღდგება. არ იყენებს სარემონტო პაკეტებს, არ ცვლის მაქსიმალურ ჯანმრთელობას და არ აცოცხლებს განადგურებულ ობიექტებს. ვრცელდება ჩართვისას მიღებულ დაზიანებაზე; არსებული დაზიანება არ არის დასკანირებული. საჭიროებს გადატვირთვას ამ გაშვების პარამეტრის შეცვლის შემდეგ.
ips-enable-stream=ქმნის გენერირებულ უსასრულო ტექნოლოგიას __1__-სთვის, როდესაც ხელმისაწვდომია მისი რეცეპტები, ეფექტები, წინაპირობები და სამეცნიერო პაკეტები. გამორთეთ ეს, რათა თავიდან აიცილოთ MIR ამ ტექნოლოგიის გენერირება.
ips-cost-base-stream=კვლევითი ერთეულები საჭიროა __1__ პირველი გენერირებული დონისთვის. უნდა იყოს მინიმუმ 1. შემდგომი დონეები გამოითვლება ამ მნიშვნელობიდან და ხარჯების ზრდის ფაქტორიდან.
ips-cost-linear-increment-stream=კვლევითი ერთეულები დამატებულია ყოველი შემდგომი დონისთვის __1__ ექსპონენციალური მულტიპლიკატორის გამოყენებამდე. გამოიყენეთ 0 ფიქსირებული ან წმინდა ექსპონენციალური ხარჯებისთვის.
ips-cost-growth-stream=მულტიპლიკატორი გამოყენებულია __1__ თითოეულ შემდგომ დონეზე. გამოიყენეთ 1 ბინა ხარჯებისთვის, 1.5 50%-იანი ზრდისთვის, ან 2 ხარჯების გაორმაგებისთვის.
ips-max-level-stream=უმაღლესი გენერირებული დონე __1__-სთვის. დააყენეთ 0-ზე უსასრულო დონეებისთვის.
ips-research-time-stream=წამი კვლევის ერთეულზე __1__. დააყენეთ 0-ზე ამ ტექნოლოგიისთვის MIR-ის ნაგულისხმევი გამოსაყენებლად. ეს არ არის მთლიანი კვლევის დრო; მთლიანი დრო ასევე დამოკიდებულია კვლევის ღირებულებაზე, ლაბორატორიის რაოდენობაზე, ლაბორატორიის სიჩქარეზე და მოდულებზე.
mir-settings-profile-import=ჩასვით აქ MIR პარამეტრების პროფილის სტრიქონი, რათა გამოიყენოს ექსპორტირებული გაშვების პარამეტრების მნიშვნელობები, როგორც გადაფარვის ფენა პროტოტიპის გენერირებისას. ნორმალური პარამეტრებისთვის ცარიელი დატოვეთ. ექსპორტი /mir-settings-export აქტიური შენახვიდან, შემდეგ გადატვირთეთ ამ მნიშვნელობის შეცვლის შემდეგ.
ips-effect-per-level-stream=ადგენს პირველადი საბაზისო დონის ეფექტს თითო დონეზე __1__-სთვის. მოგვიანებით დაკავშირებული ფენები და ეფექტები მასშტაბირებულია პროპორციულად. პროცენტული ეფექტები იყენებს პროცენტულ პუნქტებს; დათვლის და მანძილის ეფექტები იყენებენ მათ მშობლიურ ერთეულებს.
