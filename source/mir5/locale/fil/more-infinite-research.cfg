[technology-name]
more-infinite-research.research_gears=Produktibidad ng gulong ng bakal na gear

[technology-description]
more-infinite-research.recipe_productivity=Pinapataas ang pagiging produktibo ng recipe para sa mga napiling recipe. Nalalapat pa rin ang maximum productivity cap ng Factorio; Maaaring walang praktikal na epekto ang mga karagdagang infinite level kapag naabot na ng recipe ang cap nito.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Mas mataas na antas:[/color][/font] Passive wall at gate repair
ips-enable-stream=[font=default-bold]__1__[/font] — paganahin
ips-cost-base-stream=[font=default-bold]__1__[/font] — batayang gastos
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — dagdag na gastos bawat antas
ips-cost-growth-stream=[font=default-bold]__1__[/font] — paglago ng gastos
ips-max-level-stream=[font=default-bold]__1__[/font] — pinakamataas na antas
ips-research-time-stream=[font=default-bold]__1__[/font] — oras ng pananaliksik
mir-settings-profile-import=[font=default-bold][color=purple]Mas mataas na antas:[/color][/font] Mag-import ng profile ng mga setting ng MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — epekto bawat antas

[mod-setting-description]
mir-enable-passive-repair=Naka-off ang default. Nagbibigay ng libreng pagbabagong-buhay sa mga nasirang pader at gate na pag-aari ng puwersa ng manlalaro o mga kaalyado nito pagkatapos ng 10 segundo nang walang karagdagang pinsala. Nag-aayos ng hindi hihigit sa 1 kalusugan sa bawat pagbisita sa serbisyo, na may 8 nakabinbing entity na sineserbisyuhan bawat segundo at hindi hihigit sa 256 na sinusubaybayan. Mas mabagal ang pag-aayos ng malalaking pila ng pinsala. Hindi gumagamit ng mga repair pack, binabago ang maximum na kalusugan, o binubuhay ang mga nasirang entity. Nalalapat sa pinsalang natanggap habang pinagana; ang umiiral na pinsala ay hindi na-scan. Nangangailangan ng pag-restart pagkatapos baguhin ang setting ng startup na ito.
ips-enable-stream=Lumilikha ng nabuong walang katapusang teknolohiya para sa __1__ kapag available ang mga recipe, effect, prerequisite, at science pack nito. Huwag paganahin ito upang maiwasan ang MIR sa pagbuo ng teknolohiyang ito.
ips-cost-base-stream=Mga unit ng pananaliksik na kailangan para sa unang nabuong antas ng __1__. Dapat ay hindi bababa sa 1. Ang mga susunod na antas ay kinakalkula mula sa halagang ito at sa kadahilanan ng paglago ng gastos.
ips-cost-linear-increment-stream=Idinagdag ang mga unit ng pananaliksik para sa bawat susunod na antas ng __1__ bago ilapat ang exponential multiplier. Gumamit ng 0 para sa mga fixed o puro exponential na mga gastos.
ips-cost-growth-stream=Multiplier na inilapat sa bawat susunod na antas ng __1__. Gumamit ng 1 para sa mga flat na gastos, 1.5 para sa 50% na paglago bawat antas, o 2 para sa pagdodoble ng mga gastos.
ips-max-level-stream=Pinakamataas na nabuong antas para sa __1__. Itakda sa 0 para sa walang katapusang antas.
ips-research-time-stream=Segundo bawat research unit para sa __1__. Itakda sa 0 para gamitin ang default ng MIR para sa teknolohiyang ito. Hindi ito kabuuang oras ng pananaliksik; Ang kabuuang oras ay nakasalalay din sa gastos sa pananaliksik, bilang ng lab, bilis ng lab, at mga module.
mir-settings-profile-import=Mag-paste ng string ng profile ng mga setting ng MIR dito para ilapat ang mga na-export na value ng setting ng startup bilang override layer sa panahon ng pagbuo ng prototype. Iwanang blangko para sa mga normal na setting. I-export gamit ang /mir-settings-export mula sa isang aktibong pag-save, pagkatapos ay i-restart pagkatapos baguhin ang halagang ito.
ips-effect-per-level-stream=Itinatakda ang pangunahing base-tier na epekto sa bawat antas para sa __1__. Ang mga kaugnay na mga tier at epekto sa ibang pagkakataon ay nasusukat nang proporsyonal. Ang mga epekto ng porsyento ay gumagamit ng mga puntos ng porsyento; ang bilang at mga epekto ng distansya ay gumagamit ng kanilang mga katutubong yunit.
