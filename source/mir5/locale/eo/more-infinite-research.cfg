[technology-name]
more-infinite-research.research_gears=Fera dentrado produktiveco

[technology-description]
more-infinite-research.recipe_productivity=Pliigas receptan produktivecon por la elektitaj receptoj. La maksimuma produktiveca limo de Factorio ankoraŭ validas; kromaj senfinaj niveloj povas havi neniun praktikan efikon post kiam recepto atingas sian ĉapon.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Progresinta:[/color][/font] Pasiva riparo de muroj kaj pordegoj
ips-enable-stream=[font=default-bold]__1__[/font] — ebligi
ips-cost-base-stream=[font=default-bold]__1__[/font] — baza kosto
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — aldonkosto por nivelo
ips-cost-growth-stream=[font=default-bold]__1__[/font] — eksponenta multiplikato
ips-max-level-stream=[font=default-bold]__1__[/font] — maksimuma nivelo
ips-research-time-stream=[font=default-bold]__1__[/font] — tempo de esploro
mir-settings-profile-import=[font=default-bold][color=purple]Altnivela:[/color][/font] Importi MIR-agordan profilon
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efiko por nivelo

[mod-setting-description]
mir-enable-passive-repair=Defaŭlte malŝaltita. Donas al difektitaj muroj kaj pordegoj posedataj de la ludanto-forto aŭ ĝiaj reciprokaj aliancanoj liberan regeneradon post 10 sekundoj sen plia damaĝo. Riparoj maksimume 1 sano per servovizito, kun 8 pritraktataj estaĵoj servataj ĉiun sekundon kaj maksimume 256 spuritaj. Grandaj damaĝvostoj riparas pli malrapide. Ne uzas riparpakaĵojn, ŝanĝas maksimuman sanon aŭ revivigas detruitajn entojn. Aplikas al damaĝo ricevita dum ĝi estas ebligita; ekzistanta damaĝo ne estas skanita. Necesas rekomencon post ŝanĝo de ĉi tiu starta agordo.
ips-enable-stream=Kreas la generitan senfinan teknologion por __1__ kiam ĝiaj receptoj, efikoj, antaŭkondiĉoj kaj sciencaj pakoj estas disponeblaj. Malebligu ĉi tion por malhelpi MIR generi ĉi tiun teknologion.
ips-cost-base-stream=Esplorunuoj necesaj por la unua generita nivelo de __1__. Devas esti almenaŭ 1. Pli postaj niveloj estas kalkulitaj el ĉi tiu valoro kaj la kost-kreskfaktoro.
ips-cost-linear-increment-stream=Esplorunuoj aldonitaj por ĉiu pli posta nivelo de __1__ antaŭ ol la eksponenta multiplikato estas aplikata. Uzu 0 por fiksaj aŭ pure eksponentaj kostoj.
ips-cost-growth-stream=Multobligilo aplikata al ĉiu posta nivelo de __1__. Uzu 1 por plataj kostoj, 1.5 por 50% kresko per nivelo, aŭ 2 por duobligi kostojn.
ips-max-level-stream=Plej alta generita nivelo por __1__. Agordu al 0 por senfinaj niveloj.
ips-research-time-stream=Sekundoj por esplorunuo por __1__. Agordu al 0 por uzi la defaŭlton de MIR por ĉi tiu teknologio. Ĉi tio ne estas tuta esplortempo; totala tempo ankaŭ dependas de esplorkosto, laboratoriokalkulo, laboratoriorapideco, kaj moduloj.
mir-settings-profile-import=Algluu MIR-agordan profilŝnuron ĉi tie por apliki eksportitajn start-agordajn valorojn kiel anstataŭan tavolon dum prototipgenerado. Lasu malplena por normalaj agordoj. Eksportu per /mir-settings-export de aktiva konservado, tiam rekomencu post ŝanĝo de ĉi tiu valoro.
ips-effect-per-level-stream=Agordas la ĉefan baznivelan efikon per nivelo por __1__. Rilataj pli postaj partoj kaj efikoj estas proporcie skalitaj. Procentaj efikoj uzas procentpunktojn; kalkulo kaj distancaj efikoj uzas siajn denaskajn unuojn.
