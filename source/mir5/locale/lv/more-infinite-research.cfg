[technology-name]
more-infinite-research.research_gears=Dzelzs zobratu ražīgums

[technology-description]
more-infinite-research.recipe_productivity=Palielina recepšu produktivitāti atlasītajām receptēm. Joprojām ir spēkā Factorio maksimālās produktivitātes ierobežojums; papildu bezgalīgiem līmeņiem var nebūt praktiskas ietekmes, tiklīdz recepte ir sasniegusi maksimālo robežu.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Papildu:[/color][/font] Pasīvo sienu un vārtu remonts
ips-enable-stream=[font=default-bold]__1__[/font] — iespējot
ips-cost-base-stream=[font=default-bold]__1__[/font] — bāzes izmaksas
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — papildu izmaksas par līmeni
ips-cost-growth-stream=[font=default-bold]__1__[/font] — izmaksu pieaugums
ips-max-level-stream=[font=default-bold]__1__[/font] — maksimālais līmenis
ips-research-time-stream=[font=default-bold]__1__[/font] — izpētes laiks
mir-settings-profile-import=[font=default-bold][color=purple]Papildu:[/color][/font] Importēt MIR iestatījumu profilu
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efekts katrā līmenī

[mod-setting-description]
mir-enable-passive-repair=Noklusējums izslēgts. Sniedz bojātām sienām un vārtiem, kas pieder spēlētāja spēkam vai tā savstarpējiem sabiedrotajiem, pēc 10 sekundēm bez papildu bojājumiem. Remonts ne vairāk kā 1 stāvoklis vienā servisa apmeklējumā, katru sekundi tiek apkalpotas 8 neapstiprinātās entītijas un izsekotas ne vairāk kā 256. Lielas bojājumu rindas tiek novērstas lēnāk. Neizmanto remonta pakotnes, nemaina maksimālu veselības stāvokli vai atdzīvina iznīcinātās vienības. Attiecas uz bojājumiem, kas saņemti, kad tas ir iespējots; esošie bojājumi netiek skenēti. Pēc šī startēšanas iestatījuma maiņas ir nepieciešama restartēšana.
ips-enable-stream=Izveido ģenerētu bezgalīgu tehnoloģiju priekš __1__, kad ir pieejamas tās receptes, efekti, priekšnoteikumi un zinātnes pakotnes. Atspējojiet šo, lai neļautu MIR ģenerēt šo tehnoloģiju.
ips-cost-base-stream=Pētniecības vienības, kas nepieciešamas pirmajam ģenerētajam __1__ līmenim. Jābūt vismaz 1. Vēlāki līmeņi tiek aprēķināti no šīs vērtības un izmaksu pieauguma faktora.
ips-cost-linear-increment-stream=Pētniecības vienības, kas pievienotas katram nākamajam __1__ līmenim, pirms tiek lietots eksponenciālais reizinātājs. Izmantojiet 0 fiksētām vai tīri eksponenciālām izmaksām.
ips-cost-growth-stream=Reizinātājs tiek lietots katram nākamajam __1__ līmenim. Izmantojiet 1, lai fiksētu izmaksas, 1,5, lai palielinātu 50% katrā līmenī, vai 2, lai dubultotu izmaksas.
ips-max-level-stream=Augstākais ģenerētais līmenis __1__. Iestatīt uz 0 bezgalīgiem līmeņiem.
ips-research-time-stream=Sekundes uz vienu izpētes vienību __1__. Iestatiet uz 0, lai šai tehnoloģijai izmantotu MIR noklusējuma iestatījumu. Tas nav kopējais izpētes laiks; kopējais laiks ir atkarīgs arī no izpētes izmaksām, laboratoriju skaita, laboratorijas ātruma un moduļiem.
mir-settings-profile-import=Ielīmējiet šeit MIR iestatījumu profila virkni, lai prototipa ģenerēšanas laikā lietotu eksportētās starta iestatījumu vērtības kā ignorēšanas slāni. Atstājiet tukšu parastajiem iestatījumiem. Eksportējiet ar /mir-settings-export no aktīvās saglabāšanas, pēc tam restartējiet pēc šīs vērtības maiņas.
ips-effect-per-level-stream=Iestata primāro bāzes līmeņa efektu katram līmenim __1__. Saistītie vēlākie līmeņi un efekti tiek proporcionāli mērogoti. Procentuālie efekti izmanto procentu punktus; skaitīšanas un attāluma efekti izmanto savas vietējās vienības.
