more-infinite-research.research_gears=Vas fogaskerekek termelékenysége

[technology-description]
more-infinite-research.recipe_productivity=Növeli a receptek termelékenységét a kiválasztott recepteknél. A Factorio maximális termelékenységi korlátja továbbra is érvényes; a további végtelen szinteknek nincs gyakorlati hatása, ha egy recept eléri a felső határt.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Speciális:[/color][/font] Passzív fal- és kapujavítás
ips-enable-stream=[font=default-bold]__1__[/font] — engedélyezés
ips-cost-base-stream=[font=default-bold]__1__[/font] – alapköltség
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — adalék költség szintenként
ips-cost-growth-stream=[font=default-bold]__1__[/font] — költségnövekedés
