[technology-name]
more-infinite-research.research_gears=Năng suất bánh răng sắt

[technology-description]
more-infinite-research.recipe_productivity=Tăng năng suất công thức cho các công thức đã chọn. Giới hạn năng suất tối đa của Factorio vẫn được áp dụng; các cấp độ vô hạn bổ sung có thể không có tác dụng thực tế khi công thức đạt đến giới hạn.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Nâng cao:[/color][/font]Sửa chữa tường và cổng thụ động
ips-enable-stream=[font=default-bold]__1__[/font] — bật
ips-cost-base-stream=[font=default-bold]__1__[/font] — giá cơ bản
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — chi phí cộng thêm cho mỗi cấp độ
ips-cost-growth-stream=[font=default-bold]__1__[/font] — hệ số nhân
ips-max-level-stream=[font=default-bold]__1__[/font] — cấp độ tối đa
ips-research-time-stream=[font=default-bold]__1__[/font] — thời gian nghiên cứu
mir-settings-profile-import=[font=default-bold][color=purple]Nâng cao:[/color][/font] Nhập hồ sơ cài đặt MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — hiệu ứng trên mỗi cấp độ

[mod-setting-description]
mir-enable-passive-repair=Mặc định tắt. Cung cấp cho các bức tường và cổng bị hư hỏng thuộc sở hữu của lực lượng người chơi hoặc các đồng minh chung của họ được tái sinh miễn phí sau 10 giây mà không bị thiệt hại thêm. Sửa chữa tối đa 1 sức khỏe cho mỗi lượt truy cập dịch vụ, với 8 thực thể đang chờ xử lý được phục vụ mỗi giây và tối đa 256 thực thể được theo dõi. Hàng đợi thiệt hại lớn sửa chữa chậm hơn. Không sử dụng gói sửa chữa, thay đổi lượng máu tối đa hoặc hồi sinh các thực thể bị tiêu diệt. Áp dụng cho sát thương nhận được khi kích hoạt; thiệt hại hiện có không được quét. Yêu cầu khởi động lại sau khi thay đổi cài đặt khởi động này.
ips-enable-stream=Tạo ra công nghệ vô hạn được tạo ra cho __1__ khi có sẵn các công thức, hiệu ứng, điều kiện tiên quyết và gói khoa học. Tắt tính năng này để ngăn MIR tạo ra công nghệ này.
ips-cost-base-stream=Đơn vị nghiên cứu cần thiết cho cấp độ được tạo đầu tiên là __1__. Ít nhất phải bằng 1. Các mức sau này được tính từ giá trị này và hệ số tăng trưởng chi phí.
ips-cost-linear-increment-stream=Đơn vị nghiên cứu được thêm vào cho mỗi cấp độ sau của __1__ trước khi áp dụng hệ số nhân. Sử dụng 0 cho chi phí cố định hoặc hoàn toàn theo cấp số nhân.
ips-cost-growth-stream=Hệ số nhân được áp dụng cho từng cấp độ sau của __1__. Sử dụng 1 cho chi phí cố định, 1,5 để tăng trưởng 50% cho mỗi cấp hoặc 2 để tăng gấp đôi chi phí.
ips-max-level-stream=Mức được tạo cao nhất cho __1__. Đặt thành 0 cho cấp độ vô hạn.
ips-research-time-stream=Giây trên mỗi đơn vị nghiên cứu cho __1__. Đặt thành 0 để sử dụng mặc định của MIR cho công nghệ này. Đây không phải là tổng thời gian nghiên cứu; tổng thời gian cũng phụ thuộc vào chi phí nghiên cứu, số lượng phòng thí nghiệm, tốc độ phòng thí nghiệm và mô-đun.
mir-settings-profile-import=Dán chuỗi hồ sơ cài đặt MIR vào đây để áp dụng các giá trị cài đặt khởi động đã xuất làm lớp ghi đè trong quá trình tạo nguyên mẫu. Để trống cho cài đặt bình thường. Xuất bằng /mir-settings-export từ một lần lưu đang hoạt động, sau đó khởi động lại sau khi thay đổi giá trị này.
ips-effect-per-level-stream=Đặt hiệu ứng cấp cơ sở chính cho mỗi cấp cho __1__. Các cấp độ và hiệu ứng liên quan sau này được chia tỷ lệ theo tỷ lệ. Hiệu ứng phần trăm sử dụng điểm phần trăm; hiệu ứng đếm và khoảng cách sử dụng đơn vị gốc của chúng.
