[technology-name]
more-infinite-research.research_gears=Продуктивность железных шестерён

[technology-description]
more-infinite-research.recipe_productivity=Увеличивает производительность выбранных рецептов. Ограничение максимальной производительности Factorio по-прежнему действует; дополнительные бесконечные уровни могут не иметь практического эффекта, когда рецепт достигнет своего предела.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Дополнительно:[/color][/font] Ремонт пассивных стен и ворот
ips-enable-stream=[font=default-bold]__1__[/font] — включить
ips-cost-base-stream=[font=default-bold]__1__[/font] — базовая стоимость
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — дополнительная стоимость за уровень
ips-cost-growth-stream=[font=default-bold]__1__[/font] — экспоненциальный множитель
ips-max-level-stream=[font=default-bold]__1__[/font] — максимальный уровень
ips-research-time-stream=[font=default-bold]__1__[/font] — время исследования
mir-settings-profile-import=[font=default-bold][color=purple]Дополнительно:[/color][/font] Импорт профиля настроек MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — эффект за уровень

[mod-setting-description]
mir-enable-passive-repair=По умолчанию выключено. Дает поврежденным стенам и воротам, принадлежащим игроку или его общим союзникам, бесплатную регенерацию через 10 секунд без дальнейшего повреждения. Восстанавливает не более 1 здоровья за одно посещение службы, при этом каждую секунду обслуживается 8 ожидающих объектов и отслеживается не более 256. Большие очереди повреждений восстанавливаются медленнее. Не использует ремонтные пакеты, не изменяет максимальное здоровье и не воскрешает уничтоженные сущности. Применяется к урону, полученному при включении; существующие повреждения не сканируются. Требуется перезагрузка после изменения этого параметра запуска.
ips-enable-stream=Создаёт сгенерированную бесконечную технологию для __1__, когда доступны её рецепты, эффекты, необходимые условия и научные пакеты. Отключите это, чтобы MIR не мог генерировать эту технологию.
ips-cost-base-stream=Исследовательские единицы, необходимые для первого сгенерированного уровня __1__. Должно быть не менее 1. Последующие уровни рассчитываются на основе этого значения и коэффициента роста стоимости.
ips-cost-linear-increment-stream=Исследовательские единицы добавляются для каждого последующего уровня __1__ до применения экспоненциального множителя. Используйте 0 для фиксированных или чисто экспоненциальных затрат.
ips-cost-growth-stream=Множитель применяется к каждому последующему уровню __1__. Используйте 1 для фиксированных затрат, 1,5 для роста на 50% за уровень или 2 для удвоения затрат.
ips-max-level-stream=Самый высокий сгенерированный уровень для __1__. Установите значение 0 для бесконечных уровней.
ips-research-time-stream=Секунд на единицу исследования для __1__. Установите значение 0, чтобы использовать настройки MIR по умолчанию для этой технологии. Это не общее время исследования; общее время также зависит от стоимости исследования, количества лабораторий, скорости работы лаборатории и модулей.
mir-settings-profile-import=Вставьте сюда строку профиля настроек MIR, чтобы применить экспортированные значения параметров запуска в качестве слоя переопределения во время создания прототипа. Оставьте пустым для обычных настроек. Экспортируйте с помощью /mir-settings-export из активного сохранения, а затем перезапустите после изменения этого значения.
ips-effect-per-level-stream=Устанавливает основной эффект базового уровня для каждого уровня для __1__. Соответствующие более поздние уровни и эффекты масштабируются пропорционально. Процентные эффекты используют процентные точки; Эффекты счета и расстояния используют свои собственные единицы измерения.
