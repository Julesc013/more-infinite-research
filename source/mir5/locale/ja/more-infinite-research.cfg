[technology-name]
more-infinite-research.research_gears=鉄歯車の生産性

[technology-description]
more-infinite-research.recipe_productivity=選択したレシピの生産性を向上させます。 Factorio の最大生産性の上限は引き続き適用されます。レシピが上限に達すると、追加の無限レベルは実際的な効果を持たなくなる可能性があります。

[mod-setting-name]
ips-enable-stream=[font=default-bold]__1__[/font] — 有効にする
ips-cost-base-stream=[font=default-bold]__1__[/font] — 基本コスト
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — レベルごとの追加コスト
ips-cost-growth-stream=[font=default-bold]__1__[/font] — 指数乗数
ips-max-level-stream=[font=default-bold]__1__[/font] — 最大レベル
ips-research-time-stream=[font=default-bold]__1__[/font] — 研究時間
mir-settings-profile-import=[font=default-bold][color=purple]詳細:[/color][/font] MIR 設定プロファイルのインポート
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — レベルごとの効果

[mod-setting-description]
ips-enable-stream=__1__ のレシピ、効果、前提条件、サイエンス パックが利用可能な場合、生成された無限テクノロジーを作成します。 MIR がこのテクノロジーを生成しないようにするには、これを無効にします。
ips-cost-base-stream=__1__ の最初に生成されたレベルに必要な研究ユニット。少なくとも 1 である必要があります。後のレベルは、この値とコスト増加率から計算されます。
ips-cost-linear-increment-stream=指数乗数が適用される前に、__1__ の後のレベルごとに研究ユニットが追加されます。固定コストまたは純粋に指数関数的なコストの場合は 0 を使用します。
ips-cost-growth-stream=__1__ の後の各レベルに適用される乗数。コストが一定の場合は 1、レベルごとに 50% 成長する場合は 1.5、コストが 2 倍の場合は 2 を使用します。
ips-max-level-stream=__1__ の最高生成レベル。無限レベルの場合は 0 に設定します。
ips-research-time-stream=__1__ の研究単位あたりの秒数。このテクノロジーに MIR のデフォルトを使用するには、0 に設定します。これは総調査時間ではありません。合計時間は、研究コスト、ラボの数、ラボの速度、モジュールによっても異なります。
mir-settings-profile-import=MIR 設定プロファイル文字列をここに貼り付けて、プロトタイプ生成中にエクスポートされたスタートアップ設定値をオーバーライド レイヤーとして適用します。通常の設定の場合は空白のままにします。 /mir-settings-export を使用してアクティブな保存からエクスポートし、この値を変更した後に再起動します。
ips-effect-per-level-stream=__1__ のレベルごとのプライマリ基本層エフェクトを設定します。関連する後続の層と効果は比例してスケールされます。パーセンテージ効果はパーセンテージ ポイントを使用します。カウントと距離の効果では、ネイティブ単位が使用されます。
