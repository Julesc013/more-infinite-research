[technology-name]
more-infinite-research.research_gears=Productividad de engranajes de hierro

[technology-description]
more-infinite-research.recipe_productivity=Aumenta la productividad de las recetas seleccionadas. El límite máximo de productividad de Factorio sigue aplicándose; los niveles infinitos adicionales pueden no tener ningún efecto práctico una vez que una receta alcanza su límite.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Avanzado:[/color][/font] Reparación pasiva de paredes y portones
ips-enable-stream=[font=default-bold]__1__[/font] — habilitar
ips-cost-base-stream=[font=default-bold]__1__[/font] — costo base
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — costo aditivo por nivel
ips-cost-growth-stream=[font=default-bold]__1__[/font] — crecimiento de costos
ips-max-level-stream=[font=default-bold]__1__[/font] — nivel máximo
ips-research-time-stream=[font=default-bold]__1__[/font] — tiempo de investigación
mir-settings-profile-import=[font=default-bold][color=purple]Avanzado:[/color][/font] Importar perfil de configuración MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efecto por nivel

[mod-setting-description]
mir-enable-passive-repair=Desactivado predeterminado. Proporciona a los muros y puertas dañados propiedad de la fuerza del jugador o de sus aliados mutuos regeneración gratuita después de 10 segundos sin sufrir más daños. Repara como máximo 1 salud por visita de servicio, con 8 entidades pendientes atendidas cada segundo y como máximo 256 rastreadas. Las colas de daños grandes se reparan más lentamente. No utiliza paquetes de reparación, no cambia la salud máxima ni revive entidades destruidas. Se aplica al daño recibido mientras está habilitado; Los daños existentes no se analizan. Requiere un reinicio después de cambiar esta configuración de inicio.
ips-enable-stream=Crea la tecnología infinita generada para __1__ cuando sus recetas, efectos, requisitos previos y paquetes científicos están disponibles. Desactívelo para evitar que MIR genere esta tecnología.
ips-cost-base-stream=Unidades de investigación necesarias para el primer nivel generado de __1__. Debe ser al menos 1. Los niveles posteriores se calculan a partir de este valor y el factor de crecimiento de costos.
ips-cost-linear-increment-stream=Unidades de investigación agregadas para cada nivel posterior de __1__ antes de que se aplique el multiplicador exponencial. Utilice 0 para costos fijos o puramente exponenciales.
ips-cost-growth-stream=Multiplicador aplicado a cada nivel posterior de __1__. Utilice 1 para costos fijos, 1,5 para un crecimiento del 50% por nivel o 2 para duplicar costos.
ips-max-level-stream=Nivel más alto generado para __1__. Establezca en 0 para niveles infinitos.
ips-research-time-stream=Segundos por unidad de investigación para __1__. Establezca en 0 para utilizar el valor predeterminado de MIR para esta tecnología. Este no es el tiempo total de investigación; El tiempo total también depende del costo de la investigación, el número de laboratorios, la velocidad del laboratorio y los módulos.
mir-settings-profile-import=Pegue una cadena de perfil de configuración MIR aquí para aplicar los valores de configuración de inicio exportados como una capa de anulación durante la generación del prototipo. Déjelo en blanco para la configuración normal. Exporte con /mir-settings-export desde un guardado activo, luego reinicie después de cambiar este valor.
ips-effect-per-level-stream=Establece el efecto de nivel base principal por nivel para __1__. Los niveles y efectos posteriores relacionados se escalan proporcionalmente. Los efectos porcentuales utilizan puntos porcentuales; Los efectos de conteo y distancia utilizan sus unidades nativas.
