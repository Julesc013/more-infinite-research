[technology-name]
more-infinite-research.research_gears=철 기어 휠 생산성

[technology-description]
more-infinite-research.recipe_productivity=선택한 레시피의 레시피 생산성이 향상됩니다. Factorio의 최대 생산성 한도는 여전히 적용됩니다. 레시피가 한도에 도달하면 추가 무한 레벨은 실질적인 효과가 없을 수 있습니다.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]고급의:[/color][/font] 패시브 벽 및 게이트 수리
ips-enable-stream=[font=default-bold]__1__[/font] - 할 수 있게 하다
ips-cost-base-stream=[font=default-bold]__1__[/font] — 기본 비용
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — 레벨당 추가 비용
ips-cost-growth-stream=[font=default-bold]__1__[/font] — 지수 승수
ips-max-level-stream=[font=default-bold]__1__[/font] — 최대 레벨
ips-research-time-stream=[font=default-bold]__1__[/font] — 연구 시간
mir-settings-profile-import=[font=default-bold][color=purple]고급의:[/color][/font] MIR 설정 프로필 가져오기
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — 레벨당 효과

[mod-setting-description]
mir-enable-passive-repair=기본값은 꺼져 있습니다. 플레이어 부대나 상호 동맹이 소유한 손상된 벽과 관문은 추가 피해 없이 10초 후에 무료로 재생됩니다. 서비스 방문당 최대 1개의 상태를 수리하며, 초당 8개의 보류 엔터티가 서비스되고 최대 256개가 추적됩니다. 피해 대기열이 크면 복구 속도가 더 느려집니다. 수리 팩을 사용하지 않고 최대 체력을 변경하거나 파괴된 개체를 부활시키지 않습니다. 활성화된 동안 받은 피해에 적용됩니다. 기존 손상은 스캔되지 않습니다. 이 시작 설정을 변경한 후에는 다시 시작해야 합니다.
ips-enable-stream=레시피, 효과, 전제 조건 및 과학 팩을 사용할 수 있을 때 __1__에 대해 생성된 무한 기술을 만듭니다. MIR이 이 기술을 생성하지 못하도록 하려면 이 옵션을 비활성화합니다.
ips-cost-base-stream=__1__의 첫 번째 생성 레벨에 필요한 연구 단위입니다. 1 이상이어야 합니다. 이후 수준은 이 값과 비용 증가율을 사용하여 계산됩니다.
ips-cost-linear-increment-stream=지수 승수가 적용되기 전 __1__의 각 이후 레벨에 연구 단위가 추가되었습니다. 고정 비용 또는 순수 지수 비용에는 0을 사용합니다.
ips-cost-growth-stream=__1__의 각 이후 레벨에 적용되는 승수입니다. 고정 비용에는 1을 사용하고, 레벨당 50% 성장에는 1.5를 사용하고, 비용을 두 배로 늘리려면 2를 사용합니다.
ips-max-level-stream=__1__에 대해 가장 높은 생성 수준. 무한 수준의 경우 0으로 설정합니다.
ips-research-time-stream=__1__에 대한 연구 단위당 초. 이 기술에 대해 MIR의 기본값을 사용하려면 0으로 설정하십시오. 이는 총 조사 시간이 아닙니다. 총 시간은 연구 비용, 연구실 수, 연구실 속도 및 모듈에 따라 달라집니다.
mir-settings-profile-import=프로토타입 생성 중에 내보낸 시작 설정 값을 재정의 레이어로 적용하려면 여기에 MIR 설정 프로필 문자열을 붙여넣습니다. 일반 설정의 경우 비워 두세요. 활성 저장에서 /mir-settings-export를 사용하여 내보낸 다음 이 값을 변경한 후 다시 시작하세요.
ips-effect-per-level-stream=__1__의 레벨당 기본 기본 계층 효과를 설정합니다. 관련된 이후 단계와 효과는 비례적으로 조정됩니다. 백분율 효과는 백분율 포인트를 사용합니다. 개수 및 거리 효과는 기본 단위를 사용합니다.
