[technology-name]
more-infinite-research.research_gears=Productivitatea roții dințate din fier

[technology-description]
more-infinite-research.recipe_productivity=Mărește productivitatea rețetelor pentru rețetele selectate. Limita maximă de productivitate a Factorio încă se aplică; nivelurile infinite suplimentare pot să nu aibă efect practic odată ce o rețetă își atinge limita.

[mod-setting-name]
mir-enable-passive-repair=[font=default-bold][color=purple]Avansat:[/color][/font] Reparații pasive de pereți și porți
ips-enable-stream=[font=default-bold]__1__[/font] — activați
ips-cost-base-stream=[font=default-bold]__1__[/font] — cost de bază
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — cost aditiv pe nivel
ips-cost-growth-stream=[font=default-bold]__1__[/font] — creșterea costurilor
ips-max-level-stream=[font=default-bold]__1__[/font] — nivel maxim
ips-research-time-stream=[font=default-bold]__1__[/font] — timpul de cercetare
mir-settings-profile-import=[font=default-bold][color=purple]Avansat:[/color][/font] Importați profilul de setări MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efect pe nivel

[mod-setting-description]
mir-enable-passive-repair=Dezactivat implicit. Oferă zidurilor și porților deteriorate deținute de forța jucătorului sau de aliații săi reciproci regenerare gratuită după 10 secunde fără alte daune. Reparații cel mult 1 sănătate per vizită de service, cu 8 entități în așteptare deservite în fiecare secundă și cel mult 256 urmărite. Cozile mari de daune se repara mai lent. Nu folosește pachete de reparații, nu modifică sănătatea maximă sau nu revigorează entitățile distruse. Se aplică daunelor primite în timp ce este activat; daunele existente nu sunt scanate. Necesită o repornire după modificarea acestei setări de pornire.
ips-enable-stream=Creează tehnologia infinită generată pentru __1__ atunci când rețetele, efectele, cerințele preliminare și pachetele științifice ale acesteia sunt disponibile. Dezactivați acest lucru pentru a împiedica MIR să genereze această tehnologie.
ips-cost-base-stream=Unități de cercetare necesare pentru primul nivel generat de __1__. Trebuie să fie cel puțin 1. Nivelurile ulterioare sunt calculate din această valoare și factorul de creștere a costurilor.
ips-cost-linear-increment-stream=Unități de cercetare adăugate pentru fiecare nivel ulterior al __1__ înainte ca multiplicatorul exponențial să fie aplicat. Utilizați 0 pentru costuri fixe sau pur exponențiale.
ips-cost-growth-stream=Multiplicator aplicat fiecărui nivel ulterior al __1__. Utilizați 1 pentru costuri fixe, 1,5 pentru o creștere de 50% pe nivel sau 2 pentru dublarea costurilor.
ips-max-level-stream=Cel mai înalt nivel generat pentru __1__. Setați la 0 pentru niveluri infinite.
ips-research-time-stream=Secunde per unitate de cercetare pentru __1__. Setați la 0 pentru a utiliza valoarea implicită a MIR pentru această tehnologie. Acesta nu este timpul total de cercetare; timpul total depinde și de costul cercetării, numărul de laboratoare, viteza de laborator și module.
mir-settings-profile-import=Lipiți aici un șir de profil de setări MIR pentru a aplica valorile exportate ale setărilor de pornire ca strat de înlocuire în timpul generării prototipului. Lăsați necompletat pentru setările normale. Exportați cu /mir-settings-export dintr-o salvare activă, apoi reporniți după modificarea acestei valori.
ips-effect-per-level-stream=Setează efectul de nivel de bază primar pe nivel pentru __1__. Nivelurile și efectele ulterioare asociate sunt scalate proporțional. Efectele procentuale folosesc puncte procentuale; efectele de numărare și distanță își folosesc unitățile native.
