[technology-description]
more-infinite-research.spoilage_preservation=Augmente le modificateur global du temps de détérioration grâce à un effet scripté limité. Les objets susceptibles d'être endommagés existants peuvent conserver leurs délais de destruction actuels jusqu'à ce qu'ils soient testés dans le jeu.
more-infinite-research.agricultural_growth_speed=Raccourcit le temps de croissance restant pour les plantes agricoles en tour nouvellement plantées grâce à un effet script limité.
more-infinite-research.recipe_productivity=Augmente la productivité des recettes sélectionnées. La limite maximale de productivité de Factorio s'applique toujours ; les niveaux infinis supplémentaires peuvent n'avoir aucun effet pratique une fois qu'une recette atteint sa limite.
more-infinite-research.cargo_bay_unloading_distance=Augmente la distance maximale entre une aire d'atterrissage de fret et les baies de déchargement connectées.
more-infinite-research.cargo_landing_pad_count=Augmente le nombre d'aires d'atterrissage de fret que chaque force peut construire par surface.
more-infinite-research.direct_effect=Ajoute un bonus répétable à l'infini. Les packs de science sont choisis à partir des laboratoires actifs afin que la technologie reste recherchable avec les ensembles de mods compatibles.
more-infinite-research.electric_shooting_speed=Augmente la vitesse de tir des armes électriques. Chez la vanille, cela affecte la défense contre les décharges ; avec Space Age, cela affecte également les armes Tesla lorsque la catégorie de munitions Tesla est disponible.
more-infinite-research.flamethrower_shooting_speed=Augmente la vitesse de tir des armes lance-flammes et des tourelles lance-flammes.
more-infinite-research.lab_productivity=Augmente les progrès de recherche obtenus à partir de chaque pack scientifique consommé, en utilisant le modificateur natif de productivité de recherche en laboratoire.

[modifier-description]
more-infinite-research.spoilage_preservation=Temps de détérioration : +__1__% par niveau
more-infinite-research.agricultural_growth_speed=Vitesse de croissance agricole : +__1__% par niveau

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Compatibilité :[/color][/font] Autoriser tous les modules dans les emplacements existants
mir-enable-passive-repair=[font=default-bold][color=purple]Avancé :[/color][/font] Réparation passive de murs et de portails
ips-enable-stream=[font=default-bold]__1__[/font] — activer
ips-cost-base-stream=[font=default-bold]__1__[/font] — coût de base
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — coût additif par niveau
ips-cost-growth-stream=[font=default-bold]__1__[/font] — croissance des coûts
ips-max-level-stream=[font=default-bold]__1__[/font] — niveau maximum
ips-research-time-stream=[font=default-bold]__1__[/font] — temps de recherche
mir-settings-profile-import=[font=default-bold][color=purple]Avancé :[/color][/font] Importer le profil de paramètres MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — effet par niveau

[mod-setting-description]
mir-note-experimental-spoilage=Technologie risquée. Activé par défaut. Son effet scripté global/à l'échelle de la carte peut modifier le moment de la détérioration ; les piles altérables existantes peuvent conserver les délais actuels jusqu'à ce qu'elles soient reconstruites ou revalidées. Désactivez-le avant de charger une sauvegarde s'il est essentiel de préserver le timing de détérioration existant.
mir-note-agriculture-growth=S'applique aux cultures en tour agricoles nouvellement plantées. Les cultures plantées existantes ne sont pas redimensionnées.
mir-unrestricted-modules=Expérimental et révolutionnaire. Lorsqu'elle est activée, chaque recette existante accepte les cinq effets de module et chaque récepteur de module existant avec emplacements accepte chaque catégorie de module découverte. Cela n'ajoute pas d'emplacements de modules ni ne modifie les prototypes de modules, et peut permettre des boucles de productivité, de qualité et de modules modifiés.
mir-enable-passive-repair=Désactivé par défaut. Donne une régénération gratuite aux murs et portes endommagés appartenant à la force du joueur ou à ses alliés communs après 10 secondes sans dégâts supplémentaires. Répare au maximum 1 santé par visite de service, avec 8 entités en attente entretenues chaque seconde et au maximum 256 suivies. Les files d'attente de dégâts importants se réparent plus lentement. N'utilise pas de packs de réparation, ne modifie pas la santé maximale et ne fait pas revivre les entités détruites. S'applique aux dégâts reçus pendant l'activation ; Les dommages existants ne sont pas analysés. Nécessite un redémarrage après avoir modifié ce paramètre de démarrage.
ips-enable-stream=Crée la technologie infinie générée pour __1__ lorsque ses recettes, effets, prérequis et packs scientifiques sont disponibles. Désactivez cette option pour empêcher MIR de générer cette technologie.
ips-cost-base-stream=Unités de recherche requises pour le premier niveau généré de __1__. Doit être au moins égal à 1. Les niveaux ultérieurs sont calculés à partir de cette valeur et du facteur de croissance des coûts.
ips-cost-linear-increment-stream=Unités de recherche ajoutées pour chaque niveau ultérieur de __1__ avant l'application du multiplicateur exponentiel. Utilisez 0 pour les coûts fixes ou purement exponentiels.
ips-cost-growth-stream=Multiplicateur appliqué à chaque niveau ultérieur de __1__. Utilisez 1 pour les coûts fixes, 1,5 pour une croissance de 50 % par niveau ou 2 pour doubler les coûts.
ips-max-level-stream=Niveau généré le plus élevé pour __1__. Réglez sur 0 pour des niveaux infinis.
ips-research-time-stream=Secondes par unité de recherche pour __1__. Réglez sur 0 pour utiliser la valeur par défaut de MIR pour cette technologie. Il ne s’agit pas d’un temps de recherche total ; la durée totale dépend également du coût de la recherche, du nombre de laboratoires, de la vitesse du laboratoire et des modules.
mir-settings-profile-import=Collez ici une chaîne de profil de paramètres MIR pour appliquer les valeurs de paramètres de démarrage exportées en tant que couche de remplacement lors de la génération du prototype. Laissez vide pour les paramètres normaux. Exportez avec /mir-settings-export depuis une sauvegarde active, puis redémarrez après avoir modifié cette valeur.
ips-effect-per-level-stream=Définit l'effet de niveau de base principal par niveau pour __1__. Les niveaux et effets ultérieurs associés sont mis à l’échelle proportionnellement. Les effets de pourcentage utilisent des points de pourcentage ; les effets de comptage et de distance utilisent leurs unités natives.
