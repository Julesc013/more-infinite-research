mir-prototype-quality-cap-engine-default=Palikite kiekvieno įrenginio kokybės ir poveikio ribą. Mašinos be individualaus limito naudoja Factorio labai aukštas +100000% kokybės efekto lubas.
mir-prototype-quality-cap-bonus-50=Užfiksuokite teigiamus kokybės efektus esant +50%. Tai riboja mašinos kokybės premijos efektus, o ne kokybės pakopas ar elementų tikimybių formules.
