[technology-description]
more-infinite-research.spoilage_preservation=Увеличивает глобальный модификатор времени порчи посредством ограниченного скриптового эффекта. Существующие портящиеся предметы могут сохранять текущие сроки порчи до проверки в игре.
more-infinite-research.agricultural_growth_speed=Сокращает оставшееся время роста недавно посаженных сельскохозяйственными башнями растений посредством ограниченного скриптового эффекта.
more-infinite-research.recipe_productivity=Увеличивает производительность выбранных рецептов. Ограничение максимальной производительности Factorio по-прежнему действует; дополнительные бесконечные уровни могут не иметь практического эффекта, когда рецепт достигнет своего предела.
more-infinite-research.cargo_bay_unloading_distance=Увеличивает максимальное расстояние между грузовой посадочной площадкой и подключёнными разгрузочными отсеками.
more-infinite-research.cargo_landing_pad_count=Увеличивает количество грузовых посадочных площадок, которые каждая фракция может построить на поверхности.
more-infinite-research.direct_effect=Добавляет бесконечно повторяемый бонус.
more-infinite-research.electric_shooting_speed=Увеличивает скорость стрельбы электрического оружия. В базовой игре это влияет на электроразрядную защиту; со Space Age это также влияет на оружие Теслы, если доступна категория боеприпасов Теслы.
more-infinite-research.flamethrower_shooting_speed=Увеличивает скорость стрельбы из огнеметного оружия и огнеметных турелей.
more-infinite-research.lab_productivity=Увеличивает прогресс исследований, получаемый от каждого использованного научного пакета, используя собственный модификатор производительности лабораторных исследований.

[modifier-description]
more-infinite-research.spoilage_preservation=Время порчи: +__1__% за уровень.
more-infinite-research.agricultural_growth_speed=Скорость роста растений: +__1__% за уровень.

