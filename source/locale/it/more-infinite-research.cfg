mir-prototype-quality-cap-bonus-2500=Blocca gli effetti di qualità positivi al +2500%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-25000=Blocca gli effetti di qualità positivi al +25000%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-300=Blocca gli effetti di qualità positivi al +300%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-400=Blocca gli effetti di qualità positivi al +400%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-50=Blocca gli effetti di qualità positivi al +50%. Ciò limita gli effetti bonus sulla qualità della macchina, non i livelli di qualità o le formule di probabilità degli oggetti.
mir-prototype-quality-cap-bonus-500=Blocca gli effetti di qualità positivi al +500%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-5000=Blocca gli effetti di qualità positivi al +5000%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-75=Blocca gli effetti di qualità positivi al +75%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-bonus-750=Blocca gli effetti di qualità positivi al +750%. Ciò non modifica i livelli di qualità o le formule di probabilità degli articoli.
mir-prototype-quality-cap-engine-default=Lascia inalterato il limite di effetto qualità di ciascuna macchina. Le macchine senza un limite personalizzato utilizzano il massimale di effetto qualità molto elevato del +100000% di Factorio.
