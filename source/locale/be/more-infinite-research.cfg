[technology-description]
more-infinite-research.spoilage_preservation=Павялічвае глабальны мадыфікатар часу псавання праз абмежаваны сцэнарны эфект. Існуючыя прадметы, якія можна псаваць, могуць захоўваць свае бягучыя тэрміны псавання, пакуль не будуць правераны ў гульні.
more-infinite-research.agricultural_growth_speed=Скарачае пакінуты час росту для нядаўна высаджаных сельскагаспадарчых вежавых раслін праз абмежаваны сцэнарны эфект.
more-infinite-research.recipe_productivity=Павялічвае прадукцыйнасць рэцэптаў для выбраных рэцэптаў. Абмежаванне максімальнай прадукцыйнасці Factorio па-ранейшаму дзейнічае; дадатковыя бясконцыя ўзроўні могуць не мець практычнага эфекту, як толькі рэцэпт дасягае свайго абмежавання.
more-infinite-research.cargo_bay_unloading_distance=Павялічвае максімальную адлегласць паміж грузавой пасадачнай пляцоўкай і падлучанымі разгрузнымі адсекамі.
more-infinite-research.cargo_landing_pad_count=Павялічвае колькасць грузавых пасадачных пляцовак, якія кожная сіла можа пабудаваць на паверхні.
more-infinite-research.direct_effect=Дадае бясконцы паўторны бонус. Навуковыя пакеты выбіраюцца з дзеючых лабараторый, таму тэхналогія застаецца даступнай для даследавання з дапамогай сумяшчальных набораў модаў.
more-infinite-research.electric_shooting_speed=Павялічвае хуткасць стральбы з электрычнай зброі. У ванілі гэта ўплывае на абарону ад разраду; з Space Age гэта таксама ўплывае на зброю Tesla, калі даступная катэгорыя патронаў Tesla.
more-infinite-research.flamethrower_shooting_speed=Павялічвае хуткасць стральбы для агнямётнай зброі і агнямётных вежаў.
more-infinite-research.lab_productivity=Павялічвае прагрэс даследаванняў, атрыманы ад кожнага спажытага навуковага пакета, выкарыстоўваючы ўласны мадыфікатар прадукцыйнасці лабараторных даследаванняў.

[modifier-description]
more-infinite-research.spoilage_preservation=Час псуты: +__1__% за ўзровень
more-infinite-research.agricultural_growth_speed=Хуткасць росту сельскай гаспадаркі: +__1__% за ўзровень

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Сумяшчальнасць:[/color][/font] Дазволіць усе модулі ў існуючых слотах
mir-enable-passive-repair=[font=default-bold][color=purple]Пашыраны:[/color][/font] Пасіўны рамонт сцен і варот
ips-enable-stream=[font=default-bold]__1__[/font] — уключыць
ips-cost-base-stream=[font=default-bold]__1__[/font] — базавы кошт
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — дадатковы кошт за ўзровень
ips-cost-growth-stream=[font=default-bold]__1__[/font] — экспанентны множнік
ips-max-level-stream=[font=default-bold]__1__[/font] — максімальны ўзровень
ips-research-time-stream=[font=default-bold]__1__[/font] — час даследавання
mir-settings-profile-import=[font=default-bold][color=purple]Дадаткова:[/color][/font] Імпарт профілю налад MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — эфект на ўзровень

[mod-setting-description]
mir-note-experimental-spoilage=Рызыкоўная тэхналогія. Уключана па змаўчанні. Яго глабальны/па ўсёй карце скрыптовы эфект можа змяніць час псуты; існуючыя псаваныя стэкі могуць захоўваць бягучыя тэрміны да перабудовы або паўторнай праверкі. Адключыце яго перад загрузкай захавання, калі захаванне існуючага часу псуты мае вырашальнае значэнне.
mir-note-agriculture-growth=Прымяняецца да нядаўна пасаджаных сельскагаспадарчых культур. Існуючыя пасаджаныя культуры не змяняюцца.
mir-unrestricted-modules=Эксперыментальны і парушальны баланс. Калі ўключана, кожны існуючы рэцэпт прымае ўсе пяць эфектаў модуляў, а кожны існуючы прыёмнік модуляў са слотамі прымае кожную катэгорыю знойдзенага модуля. Гэта не дадае слоты для модуляў і не змяняе прататыпы модуляў і можа забяспечыць прадукцыйнасць, якасць і цыклы мадыфікаваных модуляў.
mir-enable-passive-repair=Па змаўчанні выключана. Дае бясплатную рэгенерацыю пашкоджаным сценам і варотам, якія належаць сіле гульца або яго агульным саюзнікам, праз 10 секунд без далейшага пашкоджання. Рамантуе не больш за 1 стан здароўя за адно наведванне службы, пры гэтым кожную секунду абслугоўваецца 8 незавершаных аб'ектаў і не больш за 256 адсочваюцца. Вялікія чэргі пашкоджанняў аднаўляюцца павольней. Не выкарыстоўвае рамонтныя пакеты, не змяняе максімальны ўзровень здароўя і не ажыўляе знішчаныя сутнасці. Прымяняецца да пашкоджанняў, атрыманых пры ўключэнні; існуючыя пашкоджанні не скануюцца. Патрабуецца перазапуск пасля змены гэтай налады запуску.
ips-enable-stream=Стварае згенераваную бясконцую тэхналогію для __1__, калі даступныя яе рэцэпты, эфекты, перадумовы і навуковыя пакеты. Адключыце гэта, каб прадухіліць стварэнне гэтай тэхналогіі MIR.
ips-cost-base-stream=Даследчыя адзінкі, неабходныя для першага згенераванага ўзроўню __1__. Павінен быць не менш за 1. Пазнейшыя ўзроўні разлічваюцца з гэтага значэння і каэфіцыента росту кошту.
ips-cost-linear-increment-stream=Даследчыя адзінкі дадаюцца для кожнага наступнага ўзроўню __1__ перад прымяненнем экспанентнага множніка. Выкарыстоўвайце 0 для фіксаваных або чыста экспанентных выдаткаў.
ips-cost-growth-stream=Множнік прымяняецца да кожнага наступнага ўзроўню __1__. Выкарыстоўвайце 1 для фіксаваных выдаткаў, 1,5 для 50% росту за ўзровень або 2 для падваення выдаткаў.
ips-max-level-stream=Самы высокі згенераваны ўзровень для __1__. Усталюйце 0 для бясконцых узроўняў.
ips-research-time-stream=Секунд на адзінку даследавання для __1__. Усталюйце 0, каб выкарыстоўваць MIR па змаўчанні для гэтай тэхналогіі. Гэта не агульны час даследавання; агульны час таксама залежыць ад кошту даследавання, колькасці лабараторый, хуткасці лабараторыі і модуляў.
mir-settings-profile-import=Устаўце сюды радок профілю налад MIR, каб прымяніць экспартаваныя значэнні налад запуску ў якасці ўзроўню перавызначэння падчас стварэння прататыпа. Пакіньце пустым для звычайных налад. Экспарт з /mir-settings-export з актыўнага захавання, затым перазапусціце пасля змены гэтага значэння.
ips-effect-per-level-stream=Усталёўвае асноўны эфект базавага ўзроўню для кожнага ўзроўню для __1__. Звязаныя пазнейшыя ўзроўні і эфекты прапарцыйна маштабуюцца. Працэнтныя эфекты выкарыстоўваюць працэнтныя пункты; эфекты падліку і адлегласці выкарыстоўваюць свае родныя адзінкі.
