[technology-description]
more-infinite-research.spoilage_preservation=Eykur alþjóðlega spillingartímabreytileikann með afmörkuðum forskriftaráhrifum. Fyrirliggjandi skemmdir hlutir gætu haldið núverandi spillingarfresti þar til þeir eru prófaðir í leiknum.
more-infinite-research.agricultural_growth_speed=Styttir eftirstandandi vaxtartíma fyrir nýgróðursettar landbúnaðarturnaplöntur með afmörkuðum forskriftaráhrifum.
more-infinite-research.recipe_productivity=Eykur framleiðni uppskrifta fyrir valdar uppskriftir. Hámarksframleiðniþak Factorio gildir enn; óendanleg stig til viðbótar hafa kannski engin hagnýt áhrif þegar uppskrift nær lokinu.
more-infinite-research.cargo_bay_unloading_distance=Eykur hámarksfjarlægð milli farmlendingarpalls og tengdra losunarpláss.
more-infinite-research.cargo_landing_pad_count=Eykur fjölda farmlendingarpúða sem hver kraftur getur byggt á hverju yfirborði.
more-infinite-research.direct_effect=Bætir við óendanlega endurteknum bónus. Vísindapakkar eru valdir úr virkum rannsóknarstofum þannig að tæknin er áfram rannsóknarhæf með samhæfum mod settum.
more-infinite-research.electric_shooting_speed=Eykur tökuhraða fyrir rafvopn. Í vanillu hefur þetta áhrif á losunarvörn; með Space Age hefur það einnig áhrif á Tesla vopn þegar Tesla ammo flokkur er í boði.
more-infinite-research.flamethrower_shooting_speed=Eykur skothraða fyrir eldkastaravopn og logakastara.
more-infinite-research.lab_productivity=Eykur framfarir í rannsóknum sem fengnar eru af hverjum neyttum vísindapakka, með því að nota innfædda framleiðnibreytingar rannsóknarstofurannsókna.

[modifier-description]
more-infinite-research.spoilage_preservation=Skemmdartími: +__1__% fyrir hvert stig
more-infinite-research.agricultural_growth_speed=Vaxtarhraði landbúnaðar: +__1__% á hvert stig

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Samhæfi:[/color][/font] Leyfa allar einingar í núverandi raufum
mir-enable-passive-repair=[font=default-bold][color=purple]Ítarlegri:[/color][/font] Viðgerðir á óvirkum veggjum og hliðum
ips-enable-stream=[font=default-bold]__1__[/font] — virkja
ips-cost-base-stream=[font=default-bold]__1__[/font] — grunnkostnaður
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — viðbótarkostnaður á hvert stig
ips-cost-growth-stream=[font=default-bold]__1__[/font] — kostnaður vöxtur
ips-max-level-stream=[font=default-bold]__1__[/font] — hámarksstig
ips-research-time-stream=[font=default-bold]__1__[/font] — rannsóknartími
mir-settings-profile-import=[font=default-bold][color=purple]Ítarlegri:[/color][/font] Flytja inn MIR stillingarsnið
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — áhrif á hvert stig

[mod-setting-description]
mir-note-experimental-spoilage=Áhættusamur tækni. Sjálfgefið virkt. Alheims-/korta-breiður handritsáhrif þess geta breytt tímaskemmdum; núverandi spillanlegir staflar geta haldið núverandi frestum þar til þeir eru endurbyggðir eða endurgildir. Slökktu á því áður en vistun er hlaðin ef það er mikilvægt að varðveita núverandi tímaskemmd.
mir-note-agriculture-growth=Á við um nýgróðursett landbúnaðarturnræktun. Núverandi gróðursett uppskera er ekki endurskalað.
mir-unrestricted-modules=Tilrauna- og jafnvægisrof. Þegar virkjað er, tekur hver uppskrift sem fyrir er öll fimm einingaáhrifin og sérhver núverandi einingamóttakari með raufum tekur við öllum uppgötvuðum einingaflokkum. Þetta bætir ekki við einingaraufum eða breytir frumgerðum eininga, og gæti virkjað framleiðni, gæði og lykkjur með breyttum einingum.
mir-enable-passive-repair=Sjálfgefið slökkt. Veitir skemmdum veggjum og hliðum í eigu leikmannasveitarinnar eða gagnkvæmra bandamanna þess ókeypis endurnýjun eftir 10 sekúndur án frekari skemmda. Gerir við að hámarki 1 heilsufar í hverri þjónustuheimsókn, með 8 aðila í bið á sekúndu og í mesta lagi 256 raktar. Stórar skemmdarraðir laga hægar. Notar ekki viðgerðarpakka, breytir ekki hámarksheilsu eða endurlífgar eyðilagðar einingar. Á við um skemmdir sem berast á meðan það er virkt; núverandi skemmdir eru ekki skannaðar. Krefst endurræsingar eftir að hafa breytt þessari ræsingarstillingu.
ips-enable-stream=Býr til óendanlega tækni fyrir __1__ þegar uppskriftir hennar, áhrif, forsendur og vísindapakkar eru tiltækar. Slökktu á þessu til að koma í veg fyrir að MIR myndi þessa tækni.
ips-cost-base-stream=Rannsóknareiningar sem krafist er fyrir fyrsta myndaða stigið af __1__. Verður að vera að minnsta kosti 1. Síðari stig eru reiknuð út frá þessu gildi og kostnaðarvaxtarstuðlinum.
ips-cost-linear-increment-stream=Rannsóknareiningum bætt við fyrir hvert síðara stig af __1__ áður en veldisvísismargfaldaranum er beitt. Notaðu 0 fyrir fastan eða eingöngu veldiskostnað.
ips-cost-growth-stream=Margfaldari notaður á hvert síðara stig af __1__. Notaðu 1 fyrir flatan kostnað, 1,5 fyrir 50% vöxt á hvert stig eða 2 fyrir tvöföldun kostnaðar.
ips-max-level-stream=Hæsta myndað stig fyrir __1__. Stillt á 0 fyrir óendanlega stig.
ips-research-time-stream=Sekúndur á hverja rannsóknareiningu fyrir __1__. Stilltu á 0 til að nota sjálfgefið MIR fyrir þessa tækni. Þetta er ekki heildar rannsóknartími; Heildartími fer einnig eftir rannsóknarkostnaði, fjölda rannsóknarstofu, hraða rannsóknarstofu og einingum.
mir-settings-profile-import=Límdu MIR stillingarprófílstreng hér til að beita útfluttum ræsistillingargildum sem hnekkt lag við gerð frumgerða. Skildu eftir autt fyrir venjulegar stillingar. Flyttu út með /mir-settings-export úr virkri vistun, endurræstu síðan eftir að hafa breytt þessu gildi.
ips-effect-per-level-stream=Stillir aðal grunnstigsáhrif fyrir hvert stig fyrir __1__. Tengd síðari stig og áhrif eru skaluð hlutfallslega. Hlutfallsáhrif nota prósentustig; fjölda- og fjarlægðaráhrif nota innfæddar einingar sínar.
