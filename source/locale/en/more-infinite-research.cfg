[technology-description]
more-infinite-research.recipe_productivity=Increases recipe productivity for the selected recipes. Factorio's maximum productivity cap still applies; additional infinite levels may have no practical effect once a recipe reaches its cap.
more-infinite-research.spoilage_preservation=Increases the global spoil time modifier through a bounded scripted effect. Existing spoilable items may keep their current spoil deadlines until tested in-game.
more-infinite-research.agricultural_growth_speed=Shortens remaining growth time for newly planted agricultural tower plants through a bounded scripted effect.
more-infinite-research.cargo_bay_unloading_distance=Increases the maximum distance between a cargo landing pad and connected unloading bays.
more-infinite-research.cargo_landing_pad_count=Increases the number of cargo landing pads each force can build per surface.
more-infinite-research.direct_effect=Adds an infinite repeatable bonus. Science packs are selected from active labs so the technology remains researchable with compatible mod sets.
more-infinite-research.electric_shooting_speed=Increases shooting speed for electric weapons. In vanilla this affects discharge defense; with Space Age it also affects Tesla weapons when the tesla ammo category is available.
more-infinite-research.flamethrower_shooting_speed=Increases shooting speed for flamethrower weapons and flamethrower turrets.
more-infinite-research.lab_productivity=Increases research progress gained from each consumed science pack, using the native lab research productivity modifier.

[modifier-description]
more-infinite-research.spoilage_preservation=Spoilage time: +__1__% per level
more-infinite-research.agricultural_growth_speed=Agricultural growth speed: +__1__% per level

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Compatibility:[/color][/font] Allow all modules in existing slots
mir-enable-passive-repair=[font=default-bold][color=purple]Advanced:[/color][/font] Passive wall and gate repair
ips-enable-stream=[font=default-bold]__1__[/font] — enable
ips-cost-base-stream=[font=default-bold]__1__[/font] — base cost
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — additive cost per level
ips-cost-growth-stream=[font=default-bold]__1__[/font] — exponential multiplier
ips-max-level-stream=[font=default-bold]__1__[/font] — max level
ips-research-time-stream=[font=default-bold]__1__[/font] — research time
mir-settings-profile-import=[font=default-bold][color=purple]Advanced:[/color][/font] Import MIR settings profile
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — effect per level

mir-max-level-worker-robots-speed=[font=default-bold]Infinite worker robot speed[/font] — max level
[mod-setting-description]
mir-unrestricted-modules=Experimental and balance-breaking. When enabled, every existing recipe accepts all five module effects and every existing module receiver with slots accepts every discovered module category. This does not add module slots or change module prototypes, and may enable productivity, quality, and modded-module loops.
mir-enable-passive-repair=Default off. Gives damaged walls and gates owned by the player force or its mutual allies free regeneration after 10 seconds without further damage. Repairs at most 1 health per service visit, with 8 pending entities serviced each second and at most 256 tracked. Large damage queues repair more slowly. Does not use repair packs, change maximum health, or revive destroyed entities. Applies to damage received while enabled; existing damage is not scanned. Requires a restart after changing this startup setting.
ips-enable-stream=Creates the generated infinite technology for __1__ when its recipes, effects, prerequisites, and science packs are available. Disable this to prevent MIR from generating this technology.
ips-cost-base-stream=Research units required for the first generated level of __1__. Must be at least 1. Later levels use this value, the additive increment, and the exponential multiplier.
ips-cost-linear-increment-stream=Research units added for each later level of __1__ before the exponential multiplier is applied. Use 0 for fixed or purely exponential costs.
ips-cost-growth-stream=Exponential multiplier applied to each later level of __1__. Use 1 for fixed or linear costs, 1.5 for 50% exponential growth per level, or 2 for doubling.
ips-max-level-stream=Highest generated level for __1__. Set to 0 for infinite levels.
ips-research-time-stream=Seconds per research unit for __1__. Set to 0 to use MIR's default for this technology. This is not total research time; total time also depends on research cost, lab count, lab speed, and modules.
mir-settings-profile-import=Paste a MIR settings profile string here to apply exported startup-setting values as an override layer during prototype generation. Leave blank for normal settings. Export with /mir-settings-export from an active save, then restart after changing this value.
ips-effect-per-level-stream=Sets the primary base-tier effect per level for __1__. Related later tiers and effects are scaled proportionally. Percentage effects use percentage points; count and distance effects use their native units.
mir-note-experimental-spoilage=Risky technology. Enabled by default. Its global/map-wide scripted effect can change spoilage timing; existing spoilable stacks may retain current deadlines until rebuilt or revalidated. Disable it before loading a save if preserving existing spoilage timing is critical.
mir-note-agriculture-growth=Applies to newly planted agricultural tower crops. Existing planted crops are not rescaled.
mir-max-level-worker-robots-speed=Maximum absolute level of the native infinite worker robot speed research. 0 leaves it unlimited. The selected final level remains available; higher levels are stopped without removing earned levels or bonuses. Uses the vanilla or Space Age infinite chain without changing its science, costs or effects. Restart Factorio after changing this setting.
