[mod-setting-description]
ips-require-space-gate=When enabled, these technologies stay locked until space science is researched in vanilla, or promethium science is researched in Space Age.
mir-science-pack-ingredient-policy=Chooses how MIR adds science packs to generated technologies. Options are ordered from conservative to broad: default packs, late-game packs, progression-based packs, then all available packs.
mir-enable-base-tech=Allows MIR to extend the native __1__ chain beyond its original cap when applicable. Disable this to prevent MIR from adding its continuation.
mir-cost-base=Level-1 cost coefficient for the MIR continuation of __1__. If the first continuation is level N, a positive value is multiplied by growth^(N - 1) for that level's formula. Set to 0 to inherit the coefficient from the source research chain.
mir-cost-linear-increment=Research units added for each later MIR continuation level of __1__ before the exponential multiplier is applied. Use 0 for no additive growth.
mir-cost-growth=Exponential multiplier applied to each later MIR continuation level of __1__. Set to 0 to inherit the source research chain's growth pattern when possible; use 1 for fixed or linear costs.
mir-max-level=Highest MIR continuation level for __1__. Set to 0 for infinite levels.
mir-research-time=Seconds per research unit for the MIR continuation of __1__. Set to 0 to inherit the source research chain's research unit time when possible.
mir-effect-per-level=Sets the canonical per-level effect for the infinite __1__ continuation. Related effects are scaled proportionally from the final native baseline. Percentage effects use percentage points; count and distance effects use their native units.
mir-prefer-this-mod-for-competing-techs=When enabled, MIR prefers its own research for selected duplicate infinite research where supported. Other continuations may remain under their original mod's control.
mir-use-installed-space-age-icons=Retained for saved settings and imported profiles. MIR uses DLC artwork only while its provider is enabled; otherwise it uses base-game icons, including when this option is on. Installed but disabled DLC files cannot be checked safely during startup. Does not enable Space Age or Elevated Rails. Requires restart.
mir-unrestricted-modules=Experimental and balance-breaking. When enabled, every existing recipe accepts all five module effects and every existing module receiver with slots accepts every discovered module category. This does not add module slots or change module prototypes, and may enable productivity, quality, and modded-module loops.
mir-enable-passive-repair=Default off. Gives damaged walls and gates owned by the player force or its mutual allies free regeneration after 10 seconds without further damage. Repairs at most 1 health per service visit, with 8 pending entities serviced each second and at most 256 tracked. Large damage queues repair more slowly. Does not use repair packs, change maximum health, or revive destroyed entities. Applies to damage received while enabled; existing damage is not scanned. Requires a restart after changing this startup setting.
ips-enable-stream=Creates the generated infinite technology for __1__ when its recipes, effects, prerequisites, and science packs are available. Disable this to prevent MIR from generating this technology.
ips-cost-base-stream=Research units required for the first generated level of __1__. Must be at least 1. Later levels use this value, the additive increment, and the exponential multiplier.
ips-cost-linear-increment-stream=Research units added for each later level of __1__ before the exponential multiplier is applied. Use 0 for fixed or purely exponential costs.
ips-cost-growth-stream=Exponential multiplier applied to each later level of __1__. Use 1 for fixed or linear costs, 1.5 for 50% exponential growth per level, or 2 for doubling.
ips-max-level-stream=Highest generated level for __1__. Set to 0 for infinite levels.
ips-research-time-stream=Seconds per research unit for __1__. Set to 0 to use MIR's default for this technology. This is not total research time; total time also depends on research cost, lab count, lab speed, and modules.
mir-settings-profile-import=Paste a MIR settings profile string here to apply exported startup-setting values as an override layer during prototype generation. Leave blank for normal settings. Export with /mir-settings-export from an active save, then restart after changing this value.
ips-effect-per-level-stream=Sets the primary base-tier effect per level for __1__. Related later tiers and effects are scaled proportionally. Percentage effects use percentage points; count and distance effects use their native units.
mir-note-experimental-spoilage=Risky technology. Enabled by default. Its global/map-wide scripted effect can change spoilage timing; existing spoilable stacks may retain current deadlines until rebuilt or revalidated. Disable it before loading a save if preserving existing spoilage timing is critical.
mir-note-agriculture-growth=Applies to newly planted agricultural tower crops. Existing planted crops are not rescaled.
mir-max-level-worker-robots-speed=Maximum absolute level of the native infinite worker robot speed research. 0 leaves it unlimited. The selected final level remains available; higher levels are stopped without removing earned levels or bonuses. Uses the vanilla or Space Age infinite chain without changing its science, costs or effects. Restart Factorio after changing this setting.

mir-adjust-vanilla-weapon-speed-techs=Controls overlapping gun-speed effects in MIR-created shared weapon research. An effect is removed only when enabled dedicated MIR research supplies a positive replacement for that ammo category. Finite native research keeps its bonuses.
mir-automatic-compiler-mode=Retained for older profiles. Off or Report withholds optional recipe attachments while the newer automatic controls remain at their defaults.
mir-automatic-create-research=Retained for older profiles and the legacy automatic-setting bridge. MIR 5 uses authored research identities; this option does not create new research.
mir-automatic-productivity-action=Controls optional recipe attachments to authored research. Disabled withholds structural fallback attachments; Preview logs that decision; Apply includes admitted attachments. It does not create new research identities.
mir-automatic-require-reviewed-data=Retained for older profiles and the legacy automatic-setting bridge. MIR 5 uses authored integrations; this option does not admit unknown providers.
mir-compiler-profile=Retained for saved settings and imported profiles. Full and Classic use the same authored MIR 5 catalogue. This cannot restore research already lost in an older save; keep an untouched backup.
mir-debug-generation-report=Writes startup science and admission decisions for authored research to the Factorio log.
mir-debug-recipe-matches=When enabled, writes matched recipe names for each generated productivity stream. This can be noisy in large mod packs.
mir-debug-scripted-effects=When enabled, writes runtime log entries when scripted technologies recompute global or event-driven effects.
mir-lab-incompatibility-policy=Chooses what MIR does when the selected science packs cannot be researched by any active lab.
mir-note-cargo-pad-count=Special Space Age logistics research. Increases cargo landing pads per surface and can substantially change logistics balance.
mir-note-inserter-capacity=Risky technology. Enabled by default. Extra inserter capacity changes hand-stack counts, can break circuit-controlled inserter assumptions and blueprints, and can reduce engine optimizations. Disable it before loading a save if exact inserter behavior must remain unchanged.
mir-note-native-owner-managed-stream=When compatible native research provides this family, MIR uses its progression where the selected settings can be represented safely. Otherwise MIR may keep separate research. Restart Factorio after changing startup values.
mir-pipeline-extent-multiplier=Startup-only dropdown multiplier for recognized fluid box pipeline extent fields across prototypes, not only pipe entities. 100% leaves prototypes unchanged and does not load the pipeline pass or scan fluid boxes. Non-100% values are experimental and can affect machines, tanks, thrusters, and modded prototypes that define fluid boxes.
mir-productivity-cap-self-recycling-only=Above 1 / recycler return - 1, only production recipes with a proven non-generative self-recycling path receive the selected higher cap. At or below that threshold this checkbox has no effect. Engine unchanged uses the normal 25% return as a conservative +300% threshold without changing recycling recipes.
mir-prototype-efficiency-cap=Chooses how far efficiency effects may reduce active machine energy use. -80% (unchanged) leaves existing energy-use limits alone. Deeper reductions can approach zero active energy use without changing pollution limits.
mir-prototype-pollution-cap=Chooses how far pollution-reduction effects may reduce machine pollution. -80% (unchanged) leaves existing pollution limits alone. Deeper reductions can approach zero pollution without changing energy use.
mir-prototype-positive-power-floor=Default off. When enabled, MIR changes explicit 0W active energy_usage prototypes to 1W during prototype loading so low-power warning icons do not appear on entities that should draw a tiny non-zero amount. Leave off to preserve zero-power prototypes exactly.
mir-prototype-productivity-cap=Chooses whether MIR leaves recipe productivity caps alone or writes a startup cap to every non-parameter, non-recycling recipe. +300% (unchanged) preserves existing recipe caps; lower values shorten productivity scaling, while higher values extend it.
mir-prototype-quality-cap=Chooses whether MIR leaves machine quality-effect limits alone or writes a new positive quality cap. +100000% (unchanged) preserves existing limits and does not change quality tiers or item probability formulas.
mir-prototype-speed-cap=Chooses whether MIR leaves machine speed-effect limits alone or writes a new positive speed cap. +100000% (unchanged) preserves existing limits; lower values intentionally clamp very large speed bonuses.
mir-prototype-speed-floor=Chooses how far negative speed effects may slow supported machines. -80% (unchanged) leaves existing limits alone; deeper values remove the normal floor down to a near-stop at -99.99%.
mir-recycling-return-chance=Controls hidden generated recycling recipes only. Automatic mode reduces the normal 25% material return to at most 1 divided by the total output multiplier at the selected productivity cap. Fixed choices scale the same generated returns directly. Visible processes and recipe productivity caps are never changed.

