[technology-description]
more-infinite-research.spoilage_preservation=Øger den globale spildtidsmodifikator gennem en afgrænset script-effekt. Eksisterende spoilable genstande kan beholde deres nuværende spildeadlines, indtil de er testet i spillet.
more-infinite-research.agricultural_growth_speed=Forkorter den resterende væksttid for nyplantede landbrugstårnplanter gennem en afgrænset scripted effekt.
more-infinite-research.recipe_productivity=Øger opskriftsproduktiviteten for de valgte opskrifter. Factorios maksimale produktivitetsloft gælder stadig; yderligere uendelige niveauer har muligvis ingen praktisk effekt, når først en opskrift når sit loft.
more-infinite-research.cargo_bay_unloading_distance=Øger den maksimale afstand mellem en lastlandingsplads og tilsluttede lossepladser.
more-infinite-research.cargo_landing_pad_count=Øger antallet af lastlandingspuder, hver kraft kan bygge pr. overflade.
more-infinite-research.direct_effect=Tilføjer en uendelig gentagelig bonus. Science packs er udvalgt fra aktive laboratorier, så teknologien forbliver researchbar med kompatible modsæt.
more-infinite-research.electric_shooting_speed=Øger skydehastigheden for elektriske våben. I vanilje påvirker dette udledningsforsvaret; med Space Age påvirker det også Tesla-våben, når tesla-ammunitionskategorien er tilgængelig.
more-infinite-research.flamethrower_shooting_speed=Øger skydehastigheden for flammekastervåben og flammekastertårne.
more-infinite-research.lab_productivity=Øger forskningsfremskridt opnået fra hver forbrugt videnskabspakke ved hjælp af den oprindelige laboratorieforskningsproduktivitetsmodifikator.

[modifier-description]
more-infinite-research.spoilage_preservation=Spildtid: +__1__% pr. niveau
more-infinite-research.agricultural_growth_speed=Landbrugets væksthastighed: +__1__% pr. niveau

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Kompatibilitet:[/color][/font] Tillad alle moduler i eksisterende slots
mir-enable-passive-repair=[font=default-bold][color=purple]Avanceret:[/color][/font] Reparation af passiv væg og port
ips-enable-stream=[font=default-bold]__1__[/font] — aktiver
ips-cost-base-stream=[font=default-bold]__1__[/font] — basisomkostninger
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — additiv pris pr. niveau
ips-cost-growth-stream=[font=default-bold]__1__[/font] — omkostningsvækst
ips-max-level-stream=[font=default-bold]__1__[/font] — maks. niveau
ips-research-time-stream=[font=default-bold]__1__[/font] — forskningstid
mir-settings-profile-import=[font=default-bold][color=purple]Avanceret:[/color][/font] Importer MIR-indstillingsprofil
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — effekt pr. niveau

[mod-setting-description]
mir-note-experimental-spoilage=Risikofyldt teknologi. Aktiveret som standard. Dens globale/kort-dækkende scriptede effekt kan ændre fordærvstidspunktet; eksisterende ødelige stakke kan beholde nuværende deadlines indtil genopbygget eller genvalideret. Deaktiver det, før du indlæser en lagring, hvis det er vigtigt at bevare den eksisterende fordærvstid.
mir-note-agriculture-growth=Gælder for nyplantede landbrugstårnafgrøder. Eksisterende plantede afgrøder omskaleres ikke.
mir-unrestricted-modules=Eksperimentel og balanceforbrydende. Når den er aktiveret, accepterer hver eksisterende recept alle fem moduleffekter, og hver eksisterende modulmodtager med slots accepterer hver opdaget modulkategori. Dette tilføjer ikke modulslots eller ændrer modulprototyper og muliggør muligvis produktivitet, kvalitet og modderede modulløkker.
mir-enable-passive-repair=Deaktiveret som standard. Giver beskadigede mure og porte ejet af spillerstyrken eller dens gensidige allierede gratis regenerering efter 10 sekunder uden yderligere skade. Reparerer højst 1 helbred pr. servicebesøg, hvor 8 afventende enheder serviceres hvert sekund og højst 256 spores. Store skadekøer reparerer langsommere. Bruger ikke reparationspakker, ændrer ikke maksimal sundhed eller genopliver ødelagte enheder. Gælder skader modtaget, mens den er aktiveret; eksisterende skade scannes ikke. Kræver en genstart efter ændring af denne opstartsindstilling.
ips-enable-stream=Skaber den genererede uendelige teknologi til __1__, når dens opskrifter, effekter, forudsætninger og videnskabspakker er tilgængelige. Deaktiver dette for at forhindre MIR i at generere denne teknologi.
ips-cost-base-stream=Forskningsenheder påkrævet til det første genererede niveau af __1__. Skal være mindst 1. Senere niveauer beregnes ud fra denne værdi og omkostningsvækstfaktoren.
ips-cost-linear-increment-stream=Forskningsenheder tilføjet for hvert senere niveau af __1__ før den eksponentielle multiplikator anvendes. Brug 0 til faste eller rent eksponentielle omkostninger.
ips-cost-growth-stream=Multiplikator anvendt på hvert senere niveau af __1__. Brug 1 til faste omkostninger, 1,5 til 50 % vækst pr. niveau eller 2 for at fordoble omkostningerne.
ips-max-level-stream=Højeste genererede niveau for __1__. Indstil til 0 for uendelige niveauer.
ips-research-time-stream=Sekunder pr. forskningsenhed for __1__. Indstil til 0 for at bruge MIR's standard for denne teknologi. Dette er ikke samlet forskningstid; Samlet tid afhænger også af forskningsomkostninger, laboratorieantal, laboratoriehastighed og moduler.
mir-settings-profile-import=Indsæt en MIR-indstillingsprofilstreng her for at anvende eksporterede opstartsindstillingsværdier som et tilsidesættelseslag under prototypegenerering. Lad tom for normale indstillinger. Eksporter med /mir-settings-export fra en aktiv lagring, og genstart derefter efter at have ændret denne værdi.
ips-effect-per-level-stream=Indstiller den primære base-tier-effekt pr. niveau for __1__. Relaterede senere niveauer og effekter skaleres proportionalt. Procentuelle effekter bruger procentpoint; tælle- og afstandseffekter bruger deres oprindelige enheder.
