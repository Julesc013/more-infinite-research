[technology-description]
more-infinite-research.spoilage_preservation=Øker den globale spoil time-modifikatoren gjennom en avgrenset skripteffekt. Eksisterende spoilable gjenstander kan beholde sine nåværende spoil-frister til de er testet i spillet.
more-infinite-research.agricultural_growth_speed=Forkorter gjenværende veksttid for nyplantede landbrukstårnplanter gjennom en avgrenset skripteffekt.
more-infinite-research.recipe_productivity=Øker oppskriftsproduktiviteten for de valgte oppskriftene. Factorios maksimale produktivitetstak gjelder fortsatt; ekstra uendelige nivåer har kanskje ingen praktisk effekt når en oppskrift når toppen.
more-infinite-research.cargo_bay_unloading_distance=Øker den maksimale avstanden mellom en lastelandingsplass og tilkoblede losseplasser.
more-infinite-research.cargo_landing_pad_count=Øker antallet lastlandingsputer hver kraft kan bygge per overflate.
more-infinite-research.direct_effect=Legger til en uendelig repeterbar bonus. Vitenskapspakker er valgt fra aktive laboratorier, slik at teknologien forblir forskningbar med kompatible mod-sett.
more-infinite-research.electric_shooting_speed=Øker skytehastigheten for elektriske våpen. I vanilje påvirker dette utslippsforsvaret; med Space Age påvirker det også Tesla-våpen når tesla-ammunisjonskategorien er tilgjengelig.
more-infinite-research.flamethrower_shooting_speed=Øker skytehastigheten for flammekastervåpen og flammekastertårn.
more-infinite-research.lab_productivity=Øker forskningsfremgangen oppnådd fra hver konsumert vitenskapspakke, ved å bruke den opprinnelige laboratorieforskningsproduktivitetsmodifikatoren.

[modifier-description]
more-infinite-research.spoilage_preservation=Spoilagetid: +__1__% per nivå
more-infinite-research.agricultural_growth_speed=Landbrukets veksthastighet: +__1__% per nivå

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Kompatibilitet:[/color][/font] Tillat alle moduler i eksisterende spor
mir-enable-passive-repair=[font=default-bold][color=purple]Avansert:[/color][/font] Reparasjon av passiv vegg og port
ips-enable-stream=[font=default-bold]__1__[/font] — aktiver
ips-cost-base-stream=[font=default-bold]__1__[/font] — basiskostnad
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — tilleggskostnad per nivå
ips-cost-growth-stream=[font=default-bold]__1__[/font] — eksponentiell multiplikator
ips-max-level-stream=[font=default-bold]__1__[/font] — maks nivå
ips-research-time-stream=[font=default-bold]__1__[/font] — forskningstid
mir-settings-profile-import=[font=default-bold][color=purple]Avansert:[/color][/font] Importer MIR-innstillingsprofil
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — effekt per nivå

[mod-setting-description]
mir-note-experimental-spoilage=Risikofylt teknologi. Aktivert som standard. Dens globale/kartomfattende skriptede effekt kan endre tidspunktet for ødeleggelse; eksisterende ødelige stabler kan beholde gjeldende tidsfrister inntil gjenoppbygd eller revalidert. Deaktiver den før du laster inn en lagring hvis det er kritisk å bevare eksisterende ødeleggelsestid.
mir-note-agriculture-growth=Gjelder nyplantede landbrukstårnavlinger. Eksisterende plantede avlinger skaleres ikke på nytt.
mir-unrestricted-modules=Eksperimentell og balansebrytende. Når aktivert, aksepterer hver eksisterende oppskrift alle fem moduleffekter, og hver eksisterende modulmottaker med spor aksepterer hver oppdaget modulkategori. Dette legger ikke til modulspor eller endrer modulprototyper, og kan muliggjøre produktivitet, kvalitet og modd-modulløkker.
mir-enable-passive-repair=Standard av. Gir skadede vegger og porter eid av spillerstyrken eller dens gjensidige allierte gratis regenerering etter 10 sekunder uten ytterligere skade. Reparerer maksimalt 1 helse per servicebesøk, med 8 ventende enheter service hvert sekund og maksimalt 256 spores. Store skadekøer reparerer saktere. Bruker ikke reparasjonspakker, endrer maksimal helse eller gjenoppliver ødelagte enheter. Gjelder skade mottatt mens den er aktivert; eksisterende skade blir ikke skannet. Krever omstart etter endring av denne oppstartsinnstillingen.
ips-enable-stream=Skaper den genererte uendelige teknologien for __1__ når oppskriftene, effektene, forutsetningene og vitenskapspakkene er tilgjengelige. Deaktiver dette for å forhindre at MIR genererer denne teknologien.
ips-cost-base-stream=Forskningsenheter som kreves for det første genererte nivået av __1__. Må være minst 1. Senere nivåer beregnes fra denne verdien og kostnadsvekstfaktoren.
ips-cost-linear-increment-stream=Forskningsenheter lagt til for hvert senere nivå av __1__ før den eksponentielle multiplikatoren brukes. Bruk 0 for faste eller rent eksponentielle kostnader.
ips-cost-growth-stream=Multiplikator brukt på hvert senere nivå av __1__. Bruk 1 for flate kostnader, 1,5 for 50 % vekst per nivå, eller 2 for å doble kostnadene.
ips-max-level-stream=Høyeste genererte nivå for __1__. Sett til 0 for uendelige nivåer.
ips-research-time-stream=Sekunder per forskningsenhet for __1__. Sett til 0 for å bruke MIRs standard for denne teknologien. Dette er ikke total forskningstid; total tid avhenger også av forskningskostnader, laboratorietall, laboratoriehastighet og moduler.
mir-settings-profile-import=Lim inn en MIR-innstillingsprofilstreng her for å bruke eksporterte oppstartsinnstillingsverdier som et overstyringslag under prototypegenerering. La stå tomt for normale innstillinger. Eksporter med /mir-settings-export fra en aktiv lagring, og start deretter på nytt etter å ha endret denne verdien.
ips-effect-per-level-stream=Angir den primære basisnivåeffekten per nivå for __1__. Relaterte senere nivåer og effekter skaleres proporsjonalt. Prosentvise effekter bruker prosentpoeng; telle- og avstandseffekter bruker sine opprinnelige enheter.
