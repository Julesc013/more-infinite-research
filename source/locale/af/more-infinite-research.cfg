mir-prototype-quality-cap-bonus-400=Klem positiewe kwaliteit-effekte vas by +400%. Dit verander nie kwaliteitvlakke of itemwaarskynlikheidsformules nie.
mir-prototype-quality-cap-bonus-50=Klem positiewe kwaliteit-effekte by +50%. Dit beperk masjien kwaliteit bonus effekte, nie kwaliteit vlakke of item waarskynlikheid formules.
mir-prototype-quality-cap-bonus-500=Klem positiewe kwaliteit-effekte by +500%. Dit verander nie kwaliteitvlakke of itemwaarskynlikheidsformules nie.
mir-prototype-quality-cap-bonus-5000=Klem positiewe kwaliteit-effekte vas by +5000%. Dit verander nie kwaliteitvlakke of itemwaarskynlikheidsformules nie.
mir-prototype-quality-cap-bonus-75=Klem positiewe kwaliteit-effekte vas teen +75%. Dit verander nie kwaliteitvlakke of itemwaarskynlikheidsformules nie.
mir-prototype-quality-cap-bonus-750=Klem positiewe kwaliteit-effekte vas teen +750%. Dit verander nie kwaliteitvlakke of itemwaarskynlikheidsformules nie.
mir-prototype-quality-cap-engine-default=Laat elke masjien se kwaliteit-effeklimiet alleen. Masjiene sonder 'n pasgemaakte limiet gebruik Factorio se baie hoë +100000% kwaliteit-effek plafon.
