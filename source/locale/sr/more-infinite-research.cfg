[string-mod-setting-description]
mir-automatic-productivity-action-disabled=Не врши аутоматско откривање, прилагање или креирање. МИР-ово фиксно истраживање остаје непромењено.
mir-automatic-productivity-action-preview=Открива и класификује кандидате, затим уписује прихваћене и прескочене одлуке у Фацторио дневник. Не прилаже рецепте нити ствара истраживања.
mir-automatic-productivity-action-apply=Подразумевано. Открива кандидате и прилаже само сигурносно доказане рецепте уз компатибилна постојећа МИР истраживања. Оно не ствара истраживање само по себи; два поља за потврду испод управљају креирањем.
mir-automatic-compiler-mode-off=Застарели еквивалент Дисаблед.
mir-automatic-compiler-mode-report=Застарели еквивалент променама прегледа.
mir-automatic-compiler-mode-safe-attach=Застарели еквивалент Примени безбедне промене са онемогућеним креирањем истраживања.
mir-automatic-compiler-mode-exact-pack=Застарели еквивалент Примени безбедне промене са омогућеним креирањем истраживања и потребним ревидираним подацима о компатибилности.
mir-automatic-compiler-mode-safe-generate=Застарели еквивалент Примени безбедне промене уз креирање истраживања омогућено за регистроване експерименталне добављаче.
mir-adjust-vanilla-weapon-speed-techs-off=Онемогућите МИР-ово опционо преклапање ракета/топова бонус чишћења.
mir-adjust-vanilla-weapon-speed-techs-only-when-dedicated-tech-enabled=Уклоните МИР-ове преклапајуће ракетне/топове бонусе само када омогућена, доступна бесконачна технологија пружа тачан ефекат замене.
mir-adjust-vanilla-weapon-speed-techs-always=Увек уклоните МИР-ове преклапајуће ракете/топове бонусе. Користите само ако желите строго раздвајање.
mir-science-pack-ingredient-policy-configured=Користите конфигурисане научне пакете сваке генерисане технологије без опционог проширења састојака. МИР подразумевано.
mir-science-pack-ingredient-policy-space=Додајте свемирску науку када је доступна. Једноставно повећање тежине након ракетирања.
mir-science-pack-ingredient-policy-space-and-promethium=Додајте простор и науку о прометијуму када су доступни. Најбоље за истраживачке судопере из веома касног свемирског доба.
mir-science-pack-ingredient-policy-space-age-progression=Додајте само пакете напредовања Спаце Аге које подразумевају изабрани пакети. Не додаје неповезане модификоване пакете.
mir-science-pack-ingredient-policy-official-progression=Додајте недостајуће званичне пакете у стилу предуслова које подразумева најнапреднији званични пакет који је већ изабран.
mir-science-pack-ingredient-policy-mod-progression=Додајте недостајуће пакете компатибилне са лабораторијама на основу модификованог напредовања научног пакета и откључајте предуслове.
mir-science-pack-ingredient-policy-all-official=Користите сваку званичну базу и научни пакет Спаце Аге који постоји у тренутном сету модова.
mir-science-pack-ingredient-policy-all=Користите сваки активни научни пакет компатибилан са лабораторијама, укључујући модификоване научне пакете.
mir-lab-incompatibility-policy-reduce=Задржите технологију смањивањем њених научних пакета на највећи скуп који прихвата активна лабораторија. Најсигурније подразумевано за мод пакете.
mir-lab-incompatibility-policy-skip=Прескочите технологију ако ниједна активна лабораторија не може да истражи свој одабрани скуп научних пакета. Строжији и лакши за ревизију.
mir-lab-incompatibility-policy-engine-default=Никада немојте преписивати изабрани скуп научних пакета. МИР чува непромењен скуп који се може безбедно истражити и изоставља генерисану технологију када Фацторио не може да истражи тај тачан скуп.
mir-prototype-productivity-cap-engine-default=Оставите постојеће ограничење продуктивности сваког рецепта на миру. Рецепти без прилагођеног ограничења користе Фацториоову нормалну +300% ограничење бонуса продуктивности.
mir-prototype-productivity-cap-percent-25=Поставите ограничења продуктивности непараметарског рецепта на +25%. Ово је строга рана капа.
mir-prototype-productivity-cap-percent-50=Поставите ограничења продуктивности непараметарског рецепта на +50%. Ово је испод нормалне границе и чини да истраживање продуктивности престане да помаже.
mir-prototype-productivity-cap-percent-75=Поставите ограничења продуктивности непараметарског рецепта на +75%. Ово је испод нормалне границе и чини да истраживање продуктивности престане да помаже.
mir-prototype-productivity-cap-percent-100=Поставите ограничења продуктивности непараметарског рецепта на +100%. Ово је испод нормалне границе и чини да истраживање продуктивности престане да помаже.
mir-prototype-productivity-cap-percent-125=Поставите ограничења продуктивности непараметарског рецепта на +125%.
mir-prototype-productivity-cap-percent-150=Поставите ограничења продуктивности непараметарског рецепта на +150%.
mir-prototype-productivity-cap-percent-200=Поставите ограничења продуктивности непараметарског рецепта на +200%. Ово је испод нормалне границе и чини да истраживање продуктивности престане да помаже.
mir-prototype-productivity-cap-percent-250=Поставите ограничења продуктивности непараметарског рецепта на +250%. Ово је мало испод уобичајене границе.
mir-prototype-productivity-cap-percent-400=Поставите ограничења продуктивности непараметарског рецепта на +400%. Ово проширује скалирање продуктивности изван нормалног ограничења.
mir-prototype-productivity-cap-percent-500=Поставите ограничења продуктивности непараметарског рецепта на +500%. Ово проширује скалирање продуктивности изван нормалног ограничења.
mir-prototype-productivity-cap-percent-750=Поставите ограничења продуктивности непараметарског рецепта на +750%.
mir-prototype-productivity-cap-percent-1000=Поставите ограничења продуктивности непараметарског рецепта на +1000%. Користите за дуготрајно чување где би истраживање продуктивности требало да остане важно.
mir-prototype-productivity-cap-percent-2500=Поставите ограничења продуктивности непараметарског рецепта на +2500%. Користите за веома дуге уштеде.
mir-prototype-productivity-cap-percent-5000=Поставите ограничења продуктивности непараметарског рецепта на +5000%.
mir-prototype-productivity-cap-percent-10000=Поставите ограничења продуктивности непараметарског рецепта на +10000%. Користите само за екстремно дугорочно скалирање.
mir-prototype-productivity-cap-percent-25000=Поставите ограничења продуктивности непараметарског рецепта на +25000%. Користите само за екстремно дугорочно скалирање.
mir-prototype-productivity-cap-percent-100000=Поставите ограничења продуктивности непараметарског рецепта на +100000%. Ово је практично неограничено за већину чувања.
mir-recycling-return-chance-engine-default=Оставите сваки рецепт за рециклажу непромењеним.
mir-recycling-return-chance-match-productivity-cap=Аутоматско смањење безбедно за експлоатацију за скривене генерисане рецепте за рециклажу. Користи 1 / (1 + бонус продуктивности), ограничен на нормални принос од 25%: +400% постаје 20%, а +1000% постаје око 9,09%.
mir-recycling-return-chance-percent-25=Задржите скривене генерисане рецепте за рециклажу са нормалним повратом материјала од 25%.
mir-recycling-return-chance-percent-20=Скалирајте скривене генерисане рецепте за рециклажу до 20% поврата материјала.
mir-recycling-return-chance-percent-15=Скалирајте скривене генерисане рецепте за рециклажу до 15% поврата материјала.
mir-recycling-return-chance-percent-12-5=Скалирајте скривене генерисане рецепте за рециклажу до 12,5% поврата материјала.
mir-recycling-return-chance-percent-10=Скалирајте скривене генерисане рецепте за рециклажу до 10% поврата материјала.
mir-recycling-return-chance-percent-7-5=Скалирајте скривене генерисане рецепте за рециклажу на повраћај материјала од 7,5%.
mir-recycling-return-chance-percent-5=Скалирајте скривене генерисане рецепте за рециклажу до 5% поврата материјала.
mir-recycling-return-chance-percent-2-5=Скалирајте скривене генерисане рецепте за рециклажу до 2,5% поврата материјала.
mir-recycling-return-chance-percent-1=Скалирајте скривене генерисане рецепте за рециклажу до 1% поврата материјала.
mir-recycling-return-chance-percent-0-5=Скалирајте скривене генерисане рецепте за рециклажу до 0,5% поврата материјала.
mir-recycling-return-chance-percent-0-1=Скалирајте скривене генерисане рецепте за рециклажу на повраћај материјала од 0,1%.
mir-prototype-efficiency-cap-engine-default=Оставите ограничење ефекта употребе енергије сваке машине на миру. Машине без прилагођеног ограничења користе Фацторио-ово нормално ограничење за коришћење енергије од -80%, тако да ефекти не могу да смање активну употребу испод 20%.
mir-prototype-efficiency-cap-saving-25=Напишите ограничење потрошње енергије од -25%. Активна употреба енергије остаје 75% или више након ефеката потрошње енергије.
mir-prototype-efficiency-cap-saving-50=Напишите ограничење потрошње енергије од -50%. Активна употреба енергије остаје 50% или више након ефеката потрошње енергије на подржаним машинама.
mir-prototype-efficiency-cap-saving-75=Напишите ограничење потрошње енергије од -75%. Активна употреба енергије остаје 25% или више након ефеката потрошње енергије на подржаним машинама.
mir-prototype-efficiency-cap-saving-90=Напишите ограничење потрошње енергије од -90%. Активна потрошња енергије може пасти на 10%, што је испод нормалног пода од 20%.
mir-prototype-efficiency-cap-saving-95=Напишите ограничење потрошње енергије од -95%. Активна потрошња енергије може пасти на 5%.
mir-prototype-efficiency-cap-saving-99=Напишите ограничење потрошње енергије од -99%. Активна потрошња енергије може пасти на 1%.
mir-prototype-efficiency-cap-saving-999=Напишите ограничење потрошње енергије од -99,9%. Употреба активне енергије може пасти на 0,1%.
mir-prototype-efficiency-cap-saving-9999=Напишите ограничење потрошње енергије од -99,99%. Ово је скоро нула потрошња активне енергије, а не преписивање прототипа са нултом снагом.
mir-prototype-pollution-cap-engine-default=Оставите границу утицаја загађења сваке машине на миру. Машине без прилагођеног ограничења користе Фацторио-ову нормалну капу са ефектом загађења од -80%.
mir-prototype-pollution-cap-saving-25=Напишите ограничење за загађење од -25%. Загађење остаје 75% или више након ефеката загађења.
mir-prototype-pollution-cap-saving-50=Напишите ограничење за загађење од -50%. Загађење остаје 50% или више након утицаја загађења на подржане машине.
mir-prototype-pollution-cap-saving-75=Напишите ограничење за загађење од -75%. Загађење остаје на 25% или више након утицаја загађења на подржане машине.
mir-prototype-pollution-cap-saving-90=Напишите ограничење за загађење од -90%. Загађење може пасти на 10%, што је испод нормалног пода од 20%.
mir-prototype-pollution-cap-saving-95=Напишите ограничење за загађење од -95%. Загађење може пасти на 5%.
mir-prototype-pollution-cap-saving-99=Напишите ограничење за загађење од -99%. Загађење може пасти на 1%.
mir-prototype-pollution-cap-saving-999=Напишите ограничење за загађење од -99,9%. Загађење може пасти на 0,1%.
mir-prototype-pollution-cap-saving-9999=Напишите ограничење за загађење од -99,99%. Ово је скоро нулто загађење, а не скрипта за загађење током извршавања.
mir-prototype-speed-floor-engine-default=Оставите негативно ограничење брзине сваке машине на миру. Машине без прилагођеног ограничења користе Фацторио-ов нормални под -80% и задржавају најмање 20% брзине.
mir-prototype-speed-floor-saving-25=Причврстите негативне ефекте брзине на -25%, остављајући најмање 75% брзине.
mir-prototype-speed-floor-saving-50=Причврстите негативне ефекте брзине на -50%, остављајући најмање 50% брзине.
mir-prototype-speed-floor-saving-75=Причврстите негативне ефекте брзине на -75%, остављајући најмање 25% брзине.
mir-prototype-speed-floor-saving-90=Дозволите негативне ефекте брзине до -90%, остављајући најмање 10% брзине.
mir-prototype-speed-floor-saving-95=Дозволите негативне ефекте брзине до -95%, остављајући најмање 5% брзине.
mir-prototype-speed-floor-saving-99=Дозволите негативне ефекте брзине до -99%, остављајући најмање 1% брзине.
mir-prototype-speed-floor-saving-999=Дозволите негативне ефекте брзине на -99,9%, остављајући најмање 0,1% брзине.
mir-prototype-speed-floor-saving-9999=Дозволи негативне ефекте брзине до -99,99%, најниже Фацторио ограничење прототипа. Ово је скоро заустављање, а не нула или негативна брзина израде.
mir-prototype-speed-cap-engine-default=Оставите ограничење брзине сваке машине на миру. Машине без прилагођеног ограничења користе Фацторио-ов веома висок +100000% ефекат брзине.
mir-prototype-speed-cap-bonus-25=Позитивни ефекти на брзину стезања на +25%.
mir-prototype-speed-cap-bonus-50=Позитивни ефекти на брзину стезања на +50%. Користите ово да држите бонусе брзине чврсто ограниченим.
mir-prototype-speed-cap-bonus-75=Позитивни ефекти на брзину стезања на +75%.
