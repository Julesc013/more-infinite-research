mir-prototype-speed-cap-bonus-25000=Позитивни ефекти на брзину стезања на +25000%.
mir-prototype-speed-cap-bonus-100000=Експлицитно напишите максималну вредност ефекта брзине Фацторио. За разлику од непромењеног, ово замењује прилагођене доње границе.
mir-prototype-quality-cap-engine-default=Оставите ограничење квалитета и ефекта сваке машине на миру. Машине без прилагођеног ограничења користе Фацторио-ов веома висок +100000% ефекат квалитета плафона.
mir-prototype-quality-cap-bonus-50=Позитивни ефекти квалитета стеге на +50%. Ово ограничава бонус ефекте квалитета машине, а не нивое квалитета или формуле вероватноће предмета.
mir-prototype-quality-cap-bonus-25=Позитивни ефекти квалитета стеге на +25%. Ово не мења нивое квалитета или формуле вероватноће ставке.
mir-prototype-quality-cap-bonus-75=Позитивни ефекти квалитета стеге на +75%. Ово не мења нивое квалитета или формуле вероватноће ставке.
mir-prototype-quality-cap-bonus-100=Позитивни ефекти квалитета стеге на +100%. Ово не мења нивое квалитета или формуле вероватноће ставке.
mir-prototype-quality-cap-bonus-125=Позитивни ефекти квалитета стеге на +125%. Ово не мења нивое квалитета или формуле вероватноће ставке.
mir-prototype-quality-cap-bonus-150=Позитивни ефекти квалитета стеге на +150%. Ово не мења нивое квалитета или формуле вероватноће ставке.
