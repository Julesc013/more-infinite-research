mir-prototype-speed-cap-bonus-750=Позитивни ефекат стезаљке на брзину на +750%.
mir-prototype-speed-cap-bonus-1000=Позитивни ефекти брзине стезања на +1000%.
mir-prototype-speed-cap-bonus-2500=Позитивни ефекти на брзину стезања на +2500%.
