mir-prototype-speed-floor-engine-default=Utzi makina bakoitzaren abiadura muga negatiboa bakarrik. Muga pertsonalizaturik gabeko makinek Factorio-ren %80ko zorua erabiltzen dute eta gutxienez %20ko abiadura mantentzen dute.
