mir-prototype-quality-cap-bonus-400=Limite los efectos de calidad positivos en +400%. Esto no cambia los niveles de calidad ni las fórmulas de probabilidad de los artículos.
mir-prototype-quality-cap-bonus-50=Limite los efectos de calidad positivos en +50%. Esto limita los efectos de bonificación por calidad de la máquina, no los niveles de calidad ni las fórmulas de probabilidad de los elementos.
mir-prototype-quality-cap-bonus-500=Limite los efectos de calidad positivos en +500%. Esto no cambia los niveles de calidad ni las fórmulas de probabilidad de los artículos.
