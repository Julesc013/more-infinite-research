[technology-description]
more-infinite-research.spoilage_preservation=Zvyšuje globální modifikátor doby znehodnocení prostřednictvím ohraničeného skriptovaného efektu. Existující zkazitelné položky si mohou ponechat své aktuální lhůty, dokud nebudou testovány ve hře.
more-infinite-research.agricultural_growth_speed=Zkracuje zbývající dobu růstu pro nově vysazené zemědělské věžové rostliny prostřednictvím omezeného skriptovaného efektu.
more-infinite-research.recipe_productivity=Zvyšuje produktivitu receptur pro vybrané receptury. Stále platí limit maximální produktivity Factorio; další nekonečné úrovně nemusí mít žádný praktický účinek, jakmile recept dosáhne svého stropu.
more-infinite-research.cargo_bay_unloading_distance=Zvyšuje maximální vzdálenost mezi přistávací plochou pro náklad a připojenými vykládacími prostory.
more-infinite-research.cargo_landing_pad_count=Zvyšuje počet přistávacích ploch, které může každá síla postavit na povrchu.
more-infinite-research.direct_effect=Přidá nekonečný opakovatelný bonus. Vědecké balíčky jsou vybírány z aktivních laboratoří, takže technologii lze zkoumat pomocí kompatibilních sad modů.
more-infinite-research.electric_shooting_speed=Zvyšuje rychlost střelby pro elektrické zbraně. U vanilky to ovlivňuje obranu proti vypouštění; s Space Age to také ovlivňuje zbraně Tesla, když je k dispozici kategorie tesla munice.
more-infinite-research.flamethrower_shooting_speed=Zvyšuje rychlost střelby pro plamenometné zbraně a plamenometné věže.
more-infinite-research.lab_productivity=Zvyšuje pokrok ve výzkumu získaný z každého spotřebovaného vědeckého balíčku pomocí nativního modifikátoru produktivity laboratorního výzkumu.

[modifier-description]
more-infinite-research.spoilage_preservation=Doba znehodnocení: +__1__% za úroveň
more-infinite-research.agricultural_growth_speed=Rychlost zemědělského růstu: +__1__% na úroveň

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Kompatibilita:[/color][/font] Povolit všechny moduly ve stávajících slotech
mir-enable-passive-repair=[font=default-bold][color=purple]Pokročilé:[/color][/font] Oprava pasivních stěn a bran
ips-enable-stream=[font=default-bold]__1__[/font] — povolit
ips-cost-base-stream=[font=default-bold]__1__[/font] — základní cena
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — aditivní náklady na úroveň
ips-cost-growth-stream=[font=default-bold]__1__[/font] — exponenciální multiplikátor
ips-max-level-stream=[font=default-bold]__1__[/font] — maximální úroveň
ips-research-time-stream=[font=default-bold]__1__[/font] — čas výzkumu
mir-settings-profile-import=[font=default-bold][color=purple]Pokročilé:[/color][/font] Import profilu nastavení MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — účinek na úroveň

[mod-setting-description]
mir-note-experimental-spoilage=Riskantní technologie. Ve výchozím nastavení povoleno. Jeho globální/mapový skriptovaný efekt může změnit načasování kažení; stávající zkazitelné zásobníky si mohou ponechat aktuální termíny, dokud nebudou přestavěny nebo znovu ověřeny. Pokud je zachování stávajícího načasování znehodnocení kritické, deaktivujte jej před načtením uložení.
mir-note-agriculture-growth=Platí pro nově vysazené zemědělské věžové plodiny. Stávající vysazené plodiny se nemění.
mir-unrestricted-modules=Experimentální a narušující rovnováhu. Je-li povoleno, každý existující recept přijímá všech pět modulových efektů a každý existující modulový přijímač se sloty přijímá každou objevenou kategorii modulu. To nepřidává modulové sloty ani nemění prototypy modulů a může umožnit produktivitu, kvalitu a smyčky modifikovaných modulů.
mir-enable-passive-repair=Výchozí vypnuto. Poskytuje poškozené zdi a brány vlastněné hráčskou silou nebo jejich vzájemnými spojenci po 10 sekundách bezplatnou regeneraci bez dalšího poškození. Opraví maximálně 1 zdravotní stav na servisní návštěvu, přičemž každou sekundu bude opraveno 8 čekajících subjektů a bude sledováno maximálně 256. Velké fronty poškození se opravují pomaleji. Nepoužívá opravné balíčky, nemění maximální zdraví ani neoživuje zničené entity. Vztahuje se na poškození přijatá při aktivaci; existující poškození není skenováno. Po změně tohoto nastavení spouštění vyžaduje restart.
ips-enable-stream=Vytvoří vygenerovanou nekonečnou technologii pro __1__, když jsou k dispozici její recepty, efekty, předpoklady a vědecké balíčky. Deaktivujte toto, abyste zabránili MIR ve generování této technologie.
ips-cost-base-stream=Výzkumné jednotky požadované pro první vygenerovanou úroveň __1__. Musí být alespoň 1. Pozdější úrovně se vypočítají z této hodnoty a faktoru růstu nákladů.
ips-cost-linear-increment-stream=Výzkumné jednotky přidané pro každou pozdější úroveň __1__ před použitím exponenciálního násobitele. Použijte 0 pro fixní nebo čistě exponenciální náklady.
ips-cost-growth-stream=Násobitel použitý na každou pozdější úroveň __1__. Použijte 1 pro paušální náklady, 1,5 pro 50% růst na úroveň nebo 2 pro zdvojnásobení nákladů.
ips-max-level-stream=Nejvyšší vygenerovaná úroveň pro __1__. Nastavte na 0 pro nekonečné úrovně.
ips-research-time-stream=Sekundy na výzkumnou jednotku za __1__. Chcete-li pro tuto technologii použít výchozí nastavení MIR, nastavte na 0. Toto není celková doba výzkumu; celkový čas také závisí na nákladech na výzkum, počtu laboratoří, rychlosti laboratoře a modulech.
mir-settings-profile-import=Sem vložte řetězec profilu nastavení MIR, chcete-li použít exportované hodnoty spouštěcího nastavení jako přepisovací vrstvu během generování prototypu. Pro normální nastavení ponechte prázdné. Exportujte pomocí /mir-settings-export z aktivního uložení a po změně této hodnoty restartujte.
ips-effect-per-level-stream=Nastavuje primární efekt základní úrovně na úroveň pro __1__. Související pozdější úrovně a efekty jsou úměrně škálovány. Procentuální efekty používají procentní body; efekty počtu a vzdálenosti využívají své původní jednotky.
