[technology-description]
more-infinite-research.spoilage_preservation=制限されたスクリプト効果を通じて、グローバルなスポイルタイム修飾子を増加させます。既存のスポイル可能なアイテムは、ゲーム内でテストされるまで現在のスポイル期限を維持することができます。
more-infinite-research.agricultural_growth_speed=制限されたスクリプト効果を通じて、新しく植えられた農業タワー植物の残りの成長時間を短縮します。
more-infinite-research.recipe_productivity=選択したレシピの生産性を向上させます。 Factorio の最大生産性の上限は引き続き適用されます。レシピが上限に達すると、追加の無限レベルは実際的な効果を持たなくなる可能性があります。
more-infinite-research.cargo_bay_unloading_distance=貨物着陸パッドと接続された荷降ろしベイの間の最大距離を増やします。
more-infinite-research.cargo_landing_pad_count=各部隊が地表ごとに構築できる貨物着陸パッドの数を増やします。
more-infinite-research.direct_effect=無限に繰り返し可能なボーナスを追加します。サイエンス パックはアクティブなラボから選択されるため、テクノロジーは互換性のある MOD セットで引き続き研究可能です。
more-infinite-research.electric_shooting_speed=電気兵器の射撃速度が増加します。バニラでは、これは放電防御に影響します。スペースエイジでは、テスラ弾薬カテゴリが利用可能な場合、テスラ武器にも影響します。
more-infinite-research.flamethrower_shooting_speed=火炎放射器武器と火炎放射器タレットの射撃速度が増加します。
more-infinite-research.lab_productivity=ネイティブのラボ研究生産性修飾子を使用して、消費された各サイエンス パックから得られる研究の進捗状況を増加させます。

[modifier-description]
more-infinite-research.spoilage_preservation=腐敗時間: レベルあたり +__1__%
more-infinite-research.agricultural_growth_speed=農業の成長速度: レベルごとに +__1__%

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]互換性:[/color][/font] 既存のスロットのすべてのモジュールを許可します
mir-enable-passive-repair=[font=default-bold][color=purple]上級:[/color][/font] パッシブ壁とゲートの修復
ips-enable-stream=[font=default-bold]__1__[/font] — 有効にする
ips-cost-base-stream=[font=default-bold]__1__[/font] — 基本コスト
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — レベルごとの追加コスト
ips-cost-growth-stream=[font=default-bold]__1__[/font] — 指数乗数
ips-max-level-stream=[font=default-bold]__1__[/font] — 最大レベル
ips-research-time-stream=[font=default-bold]__1__[/font] — 研究時間
mir-settings-profile-import=[font=default-bold][color=purple]詳細:[/color][/font] MIR 設定プロファイルのインポート
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — レベルごとの効果

[mod-setting-description]
mir-note-experimental-spoilage=危険なテクノロジー。デフォルトで有効になっています。そのグローバル/マップ全体のスクリプト効果は、腐敗のタイミングを変更する可能性があります。既存の破損しやすいスタックは、再構築または再検証されるまで現在の期限を保持する場合があります。既存の破損タイミングを維持することが重要な場合は、セーブをロードする前にこれを無効にします。
mir-note-agriculture-growth=新たに植えられた農業タワー作物に適用されます。既存の作物は再スケールされません。
mir-unrestricted-modules=Experimental and balance-breaking.有効にすると、既存のすべてのレシピは 5 つのモジュール エフェクトすべてを受け入れ、スロットを持つすべての既存のモジュール レシーバーは、検出されたすべてのモジュール カテゴリを受け入れます。 This does not add module slots or change module prototypes, and may enable productivity, quality, and modded-module loops.
mir-enable-passive-repair=デフォルトはオフです。プレイヤー軍またはその相互同盟者が所有する損傷した壁と門に、10秒後にさらなるダメージを与えることなく無料で再生させます。サービス訪問ごとに最大 1 つのヘルスを修復し、毎秒 8 つの保留中のエンティティがサービスされ、最大 256 が追跡されます。大きなダメージキューの修復は遅くなります。修復パックを使用したり、最大体力を変更したり、破壊されたエンティティを復活させたりすることはありません。有効化中に受けたダメージに適用されます。既存のダメージはスキャンされません。この起動設定を変更した後は再起動が必要です。
ips-enable-stream=__1__ のレシピ、効果、前提条件、サイエンス パックが利用可能な場合、生成された無限テクノロジーを作成します。 MIR がこのテクノロジーを生成しないようにするには、これを無効にします。
ips-cost-base-stream=__1__ の最初に生成されたレベルに必要な研究ユニット。少なくとも 1 である必要があります。後のレベルは、この値とコスト増加率から計算されます。
ips-cost-linear-increment-stream=指数乗数が適用される前に、__1__ の後のレベルごとに研究ユニットが追加されます。固定コストまたは純粋に指数関数的なコストの場合は 0 を使用します。
ips-cost-growth-stream=__1__ の後の各レベルに適用される乗数。コストが一定の場合は 1、レベルごとに 50% 成長する場合は 1.5、コストが 2 倍の場合は 2 を使用します。
ips-max-level-stream=__1__ の最高生成レベル。無限レベルの場合は 0 に設定します。
ips-research-time-stream=__1__ の研究単位あたりの秒数。このテクノロジーに MIR のデフォルトを使用するには、0 に設定します。これは総調査時間ではありません。合計時間は、研究コスト、ラボの数、ラボの速度、モジュールによっても異なります。
mir-settings-profile-import=MIR 設定プロファイル文字列をここに貼り付けて、プロトタイプ生成中にエクスポートされたスタートアップ設定値をオーバーライド レイヤーとして適用します。通常の設定の場合は空白のままにします。 /mir-settings-export を使用してアクティブな保存からエクスポートし、この値を変更した後に再起動します。
ips-effect-per-level-stream=__1__ のレベルごとのプライマリ基本層エフェクトを設定します。関連する後続の層と効果は比例してスケールされます。パーセンテージ効果はパーセンテージ ポイントを使用します。カウントと距離の効果では、ネイティブ単位が使用されます。
