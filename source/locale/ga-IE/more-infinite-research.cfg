ips-cost-growth-stream=[font=default-bold]__1__[/font] — iolraitheoir easpónantúil
ips-max-level-stream=[font=default-bold]__1__[/font] — uasleibhéal
ips-research-time-stream=[font=default-bold]__1__[/font] — am taighde
