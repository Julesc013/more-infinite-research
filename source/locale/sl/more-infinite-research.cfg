mir-unrestricted-modules=[font=default-bold][color=cyan]Združljivost:[/color][/font] Dovoli vse module v obstoječih režah
mir-enable-passive-repair=[font=default-bold][color=purple]Napredno:[/color][/font] Popravilo pasivnih sten in vrat
ips-enable-stream=[font=default-bold]__1__[/font] — omogoči
ips-cost-base-stream=[font=default-bold]__1__[/font] — osnovni stroški
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — dodatni stroški na raven
ips-cost-growth-stream=[font=default-bold]__1__[/font] — rast stroškov
ips-max-level-stream=[font=default-bold]__1__[/font] — najvišja raven
ips-research-time-stream=[font=default-bold]__1__[/font] — čas raziskovanja
mir-settings-profile-import=[font=default-bold][color=purple]Napredno:[/color][/font] Uvozi profil nastavitev MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — učinek na raven

[mod-setting-description]
mir-note-experimental-spoilage=Tvegana tehnologija. Privzeto omogočeno. Njegov globalni/skriptni učinek na zemljevidu lahko spremeni čas kvarjenja; obstoječi skladi, ki jih je mogoče pokvariti, lahko ohranijo trenutne roke, dokler niso ponovno izdelani ali ponovno potrjeni. Onemogočite ga pred nalaganjem shranjevanja, če je ohranjanje obstoječega časa kvarjenja ključnega pomena.
mir-note-agriculture-growth=Velja za na novo posajene stolpnice. Obstoječi zasajeni pridelki se ne spreminjajo.
mir-unrestricted-modules=Eksperimentalno in ruši ravnovesje. Ko je omogočeno, vsak obstoječi recept sprejme vseh pet učinkov modula in vsak obstoječi sprejemnik modula z režami sprejme vsako odkrito kategorijo modula. To ne dodaja rež za module ali spreminja prototipov modulov in lahko omogoči produktivnost, kakovost in zanke modificiranih modulov.
mir-enable-passive-repair=Privzeto izklopljeno. Omogoča brezplačno regeneracijo poškodovanih zidov in vrat, ki so v lasti igralske sile ali njenih skupnih zaveznikov, po 10 sekundah brez nadaljnje škode. Popravi največ 1 zdravje na servisni obisk, pri čemer je vsako sekundo servisirano 8 čakajočih entitet in sledi največ 256. Velike čakalne vrste poškodb se popravljajo počasneje. Ne uporablja paketov za popravilo, ne spremeni največjega zdravja ali oživi uničenih entitet. Velja za škodo, prejeto med omogočenim; obstoječe poškodbe se ne skenirajo. Po spremembi te zagonske nastavitve je potreben ponovni zagon.
ips-enable-stream=Ustvari ustvarjeno neskončno tehnologijo za __1__, ko so na voljo njegovi recepti, učinki, predpogoji in znanstveni paketi. Onemogočite to, da preprečite, da bi MIR ustvaril to tehnologijo.
ips-cost-base-stream=Raziskovalne enote, potrebne za prvo ustvarjeno raven __1__. Mora biti vsaj 1. Poznejše ravni se izračunajo iz te vrednosti in faktorja rasti stroškov.
ips-cost-linear-increment-stream=Raziskovalne enote, dodane za vsako kasnejšo raven __1__, preden se uporabi eksponentni množitelj. Uporabite 0 za fiksne ali čisto eksponentne stroške.
ips-cost-growth-stream=Množitelj, uporabljen za vsako kasnejšo raven __1__. Uporabite 1 za pavšalne stroške, 1,5 za 50-odstotno rast na raven ali 2 za podvojitev stroškov.
ips-max-level-stream=Najvišja ustvarjena raven za __1__. Nastavite na 0 za neskončne ravni.
ips-research-time-stream=Sekunde na raziskovalno enoto za __1__. Nastavite na 0, če želite uporabiti privzeto vrednost MIR za to tehnologijo. To ni skupni čas raziskave; skupni čas je odvisen tudi od stroškov raziskave, števila laboratorijev, hitrosti laboratorija in modulov.
mir-settings-profile-import=Tukaj prilepite niz profila nastavitev MIR, da uporabite izvožene vrednosti zagonskih nastavitev kot preglasitveno plast med ustvarjanjem prototipa. Pustite prazno za običajne nastavitve. Izvozite z /mir-settings-export iz aktivnega shranjevanja, nato znova zaženite, ko spremenite to vrednost.
ips-effect-per-level-stream=Nastavi primarni učinek osnovne ravni na raven za __1__. Povezane poznejše stopnje in učinki so sorazmerno povečani. Odstotni učinki uporabljajo odstotne točke; učinki štetja in razdalje uporabljajo svoje domače enote.
