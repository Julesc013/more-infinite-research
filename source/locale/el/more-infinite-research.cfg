[technology-description]
more-infinite-research.spoilage_preservation=Αυξάνει τον γενικό τροποποιητή χρόνου αλλοίωσης μέσω ενός εφέ περιορισμένου σεναρίου. Τα υπάρχοντα αντικείμενα που μπορούν να αλλοιωθούν ενδέχεται να διατηρούν τις τρέχουσες προθεσμίες τους μέχρι να δοκιμαστούν στο παιχνίδι.
more-infinite-research.agricultural_growth_speed=Μειώνει τον υπολειπόμενο χρόνο ανάπτυξης για νεοφυτεμένες γεωργικές εγκαταστάσεις πύργων μέσω ενός οριοθετημένου εφέ σεναρίου.
more-infinite-research.recipe_productivity=Αυξάνει την παραγωγικότητα της συνταγής για τις επιλεγμένες συνταγές. Το ανώτατο όριο παραγωγικότητας της Factorio εξακολουθεί να ισχύει. Πρόσθετα άπειρα επίπεδα μπορεί να μην έχουν πρακτικό αποτέλεσμα όταν μια συνταγή φτάσει στο όριο.
more-infinite-research.cargo_bay_unloading_distance=Αυξάνει τη μέγιστη απόσταση μεταξύ μιας βάσης προσγείωσης φορτίου και των συνδεδεμένων θέσεων εκφόρτωσης.
more-infinite-research.cargo_landing_pad_count=Αυξάνει τον αριθμό των επιφανειών προσγείωσης φορτίου που μπορεί να δημιουργήσει κάθε δύναμη ανά επιφάνεια.
more-infinite-research.direct_effect=Προσθέτει ένα άπειρο επαναλαμβανόμενο μπόνους. Τα επιστημονικά πακέτα επιλέγονται από ενεργά εργαστήρια, ώστε η τεχνολογία να παραμένει ερευνήσιμη με συμβατά σετ mod.
more-infinite-research.electric_shooting_speed=Αυξάνει την ταχύτητα βολής για ηλεκτρικά όπλα. Στη βανίλια αυτό επηρεάζει την άμυνα των εκκρίσεων. με το Space Age επηρεάζει επίσης τα όπλα Tesla όταν είναι διαθέσιμη η κατηγορία πυρομαχικών tesla.
more-infinite-research.flamethrower_shooting_speed=Αυξάνει την ταχύτητα βολής για φλογοβόλα όπλα και πυργίσκους φλογοβόλων.
more-infinite-research.lab_productivity=Αυξάνει την ερευνητική πρόοδο που επιτυγχάνεται από κάθε επιστημονικό πακέτο που καταναλώνεται, χρησιμοποιώντας τον εγγενή τροποποιητή παραγωγικότητας της έρευνας εργαστηρίου.

[modifier-description]
more-infinite-research.spoilage_preservation=Χρόνος αλλοίωσης: +__1__% ανά επίπεδο
more-infinite-research.agricultural_growth_speed=Ταχύτητα αγροτικής ανάπτυξης: +__1__% ανά επίπεδο

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Συμβατότητα:[/color][/font] Επιτρέπονται όλες οι μονάδες σε υπάρχουσες υποδοχές
mir-enable-passive-repair=[font=default-bold][color=purple]Προχωρημένος:[/color][/font] Παθητική επισκευή τοίχου και πύλης
ips-enable-stream=[font=default-bold]__1__[/font] — ενεργοποίηση
ips-cost-base-stream=[font=default-bold]__1__[/font] — βασικό κόστος
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — πρόσθετο κόστος ανά επίπεδο
ips-cost-growth-stream=[font=default-bold]__1__[/font] — εκθετικός πολλαπλασιαστής
ips-max-level-stream=[font=default-bold]__1__[/font] — μέγιστο επίπεδο
ips-research-time-stream=[font=default-bold]__1__[/font] — χρόνος έρευνας
mir-settings-profile-import=[font=default-bold][color=purple]Προχωρημένος:[/color][/font] Εισαγωγή προφίλ ρυθμίσεων MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — επίδραση ανά επίπεδο

[mod-setting-description]
mir-note-experimental-spoilage=Επικίνδυνη τεχνολογία. Ενεργοποιημένο από προεπιλογή. Το σενάριο εφέ του παγκόσμιου/σε όλο τον χάρτη μπορεί να αλλάξει το χρόνο αλλοίωσης. Οι υπάρχουσες στοίβες που μπορούν να χαλάσουν ενδέχεται να διατηρούν τις τρέχουσες προθεσμίες έως ότου ανακατασκευαστούν ή επικυρωθούν εκ νέου. Απενεργοποιήστε το πριν φορτώσετε μια αποθήκευση εάν η διατήρηση του υπάρχοντος χρονισμού αλλοίωσης είναι κρίσιμη.
mir-note-agriculture-growth=Ισχύει για νεοφυτεμένες καλλιέργειες γεωργικών πύργων. Οι υπάρχουσες φυτεμένες καλλιέργειες δεν επανακλιμακώνονται.
mir-unrestricted-modules=Πειραματικό και εξισορροπητικό. Όταν είναι ενεργοποιημένη, κάθε υπάρχουσα συνταγή δέχεται και τα πέντε εφέ μονάδας και κάθε υπάρχων δέκτης μονάδας με υποδοχές δέχεται κάθε κατηγορία λειτουργικών μονάδων που ανακαλύφθηκαν. Αυτό δεν προσθέτει υποδοχές λειτουργιών ή αλλάζει πρωτότυπα μονάδων και ενδέχεται να ενεργοποιήσει βρόχους παραγωγικότητας, ποιότητας και τροποποιημένων μονάδων.
mir-enable-passive-repair=Απενεργοποίηση προεπιλογής. Δίνει στους κατεστραμμένους τοίχους και τις πύλες που ανήκουν στη δύναμη του παίκτη ή στους αμοιβαίους συμμάχους του δωρεάν αναγέννηση μετά από 10 δευτερόλεπτα χωρίς περαιτέρω ζημιά. Επισκευάζει το πολύ 1 υγεία ανά επίσκεψη υπηρεσίας, με 8 εκκρεμείς οντότητες να εξυπηρετούνται κάθε δευτερόλεπτο και το πολύ 256 να παρακολουθούνται. Οι μεγάλες ουρές ζημιών επιδιορθώνονται πιο αργά. Δεν χρησιμοποιεί πακέτα επισκευής, δεν αλλάζει τη μέγιστη υγεία ή αναζωογονεί κατεστραμμένες οντότητες. Ισχύει για ζημιές που ελήφθησαν ενώ είναι ενεργοποιημένο. η υπάρχουσα βλάβη δεν σαρώνεται. Απαιτείται επανεκκίνηση μετά την αλλαγή αυτής της ρύθμισης εκκίνησης.
ips-enable-stream=Δημιουργεί την άπειρη τεχνολογία που δημιουργείται για το __1__ όταν είναι διαθέσιμες οι συνταγές, τα εφέ, οι προϋποθέσεις και τα επιστημονικά πακέτα του. Απενεργοποιήστε το για να αποτρέψετε τη δημιουργία αυτής της τεχνολογίας από το MIR.
ips-cost-base-stream=Απαιτούνται ερευνητικές μονάδες για το πρώτο παραγόμενο επίπεδο __1__. Πρέπει να είναι τουλάχιστον 1. Τα μεταγενέστερα επίπεδα υπολογίζονται από αυτήν την τιμή και τον παράγοντα αύξησης κόστους.
ips-cost-linear-increment-stream=Προστέθηκαν ερευνητικές μονάδες για κάθε μεταγενέστερο επίπεδο __1__ πριν από την εφαρμογή του εκθετικού πολλαπλασιαστή. Χρησιμοποιήστε το 0 για σταθερό ή καθαρά εκθετικό κόστος.
ips-cost-growth-stream=Εφαρμόστηκε πολλαπλασιαστής σε κάθε μεταγενέστερο επίπεδο __1__. Χρησιμοποιήστε 1 για σταθερό κόστος, 1,5 για αύξηση 50% ανά επίπεδο ή 2 για διπλασιασμό του κόστους.
ips-max-level-stream=Το υψηλότερο επίπεδο παραγωγής για το __1__. Ρυθμίστε στο 0 για άπειρα επίπεδα.
ips-research-time-stream=Δευτερόλεπτα ανά ερευνητική μονάδα για __1__. Ορίστε στο 0 για να χρησιμοποιήσετε την προεπιλογή του MIR για αυτήν την τεχνολογία. Αυτός δεν είναι ο συνολικός χρόνος έρευνας. Ο συνολικός χρόνος εξαρτάται επίσης από το κόστος έρευνας, τον αριθμό εργαστηρίου, την ταχύτητα του εργαστηρίου και τις ενότητες.
mir-settings-profile-import=Επικολλήστε εδώ μια συμβολοσειρά προφίλ ρυθμίσεων MIR για να εφαρμόσετε εξαγόμενες τιμές ρυθμίσεων εκκίνησης ως στρώμα παράκαμψης κατά τη δημιουργία πρωτοτύπου. Αφήστε κενό για κανονικές ρυθμίσεις. Εξαγωγή με /mir-settings-export από μια ενεργή αποθήκευση και, στη συνέχεια, επανεκκίνηση μετά την αλλαγή αυτής της τιμής.
ips-effect-per-level-stream=Ορίζει το πρωτεύον εφέ βασικής βαθμίδας ανά επίπεδο για το __1__. Τα σχετικά μεταγενέστερα επίπεδα και τα εφέ κλιμακώνονται αναλογικά. Οι ποσοστιαίες επιδράσεις χρησιμοποιούν ποσοστιαίες μονάδες. Τα εφέ μέτρησης και απόστασης χρησιμοποιούν τις εγγενείς μονάδες τους.
