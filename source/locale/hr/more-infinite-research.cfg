[technology-description]
more-infinite-research.spoilage_preservation=Povećava globalni modifikator vremena kvarenja kroz ograničeni skriptirani učinak. Postojeći predmeti koji se mogu pokvariti mogu zadržati trenutne rokove za pokvariti dok se ne testiraju u igri.
more-infinite-research.agricultural_growth_speed=Skraćuje preostalo vrijeme rasta za novozasađene poljoprivredne biljke kroz ograničeni skriptirani učinak.
more-infinite-research.recipe_productivity=Povećava produktivnost recepata za odabrane recepte. Maksimalno ograničenje produktivnosti Factorio još uvijek vrijedi; dodatne beskonačne razine možda neće imati praktičan učinak nakon što recept dosegne svoju gornju granicu.
more-infinite-research.cargo_bay_unloading_distance=Povećava maksimalnu udaljenost između platforme za slijetanje tereta i povezanih mjesta za istovar.
more-infinite-research.cargo_landing_pad_count=Povećava broj podloga za slijetanje tereta koje svaka sila može izgraditi po površini.
more-infinite-research.direct_effect=Dodaje beskonačni ponovljivi bonus. Znanstveni paketi biraju se iz aktivnih laboratorija tako da se tehnologija može istražiti s kompatibilnim setovima modifikacija.
more-infinite-research.electric_shooting_speed=Povećava brzinu pucanja za električno oružje. Kod vanilije to utječe na obranu od pražnjenja; sa Space Age također utječe na Tesla oružje kada je dostupna kategorija tesla streljiva.
more-infinite-research.flamethrower_shooting_speed=Povećava brzinu pucanja za bacače plamena i kupole za bacače plamena.
more-infinite-research.lab_productivity=Povećava napredak istraživanja dobiven svakim potrošenim znanstvenim paketom, koristeći izvorni modifikator produktivnosti laboratorijskog istraživanja.

[modifier-description]
more-infinite-research.spoilage_preservation=Vrijeme kvarenja: +__1__% po razini
more-infinite-research.agricultural_growth_speed=Poljoprivredna brzina rasta: +__1__% po razini

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Kompatibilnost:[/color][/font] Dopusti sve module u postojećim utorima
mir-enable-passive-repair=[font=default-bold][color=purple]Napredno:[/color][/font] Popravak pasivnih zidova i kapija
ips-enable-stream=[font=default-bold]__1__[/font] — omogući
ips-cost-base-stream=[font=default-bold]__1__[/font] — osnovni trošak
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — dodatni trošak po razini
ips-cost-growth-stream=[font=default-bold]__1__[/font] — rast troškova
ips-max-level-stream=[font=default-bold]__1__[/font] — maksimalna razina
ips-research-time-stream=[font=default-bold]__1__[/font] — vrijeme istraživanja
mir-settings-profile-import=[font=default-bold][color=purple]Napredno:[/color][/font] Uvoz MIR profila postavki
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — učinak po razini

[mod-setting-description]
mir-note-experimental-spoilage=Rizična tehnologija. Omogućeno prema zadanim postavkama. Njegov skriptirani učinak na globalnoj/široj karti može promijeniti vrijeme kvarenja; postojeće hrpe koje se mogu pokvariti mogu zadržati trenutne rokove do ponovne izgradnje ili ponovne provjere. Onemogućite ga prije učitavanja spremanja ako je očuvanje postojećeg vremena kvarenja kritično.
mir-note-agriculture-growth=Odnosi se na novozasađene poljoprivredne usjeve. Postojeći zasađeni usjevi se ne mijenjaju.
mir-unrestricted-modules=Eksperimentalno i ruši ravnotežu. Kada je omogućeno, svaki postojeći recept prihvaća svih pet efekata modula i svaki postojeći modul prijemnik s utorima prihvaća svaku otkrivenu kategoriju modula. Ovo ne dodaje utore za module niti mijenja prototipove modula, a može omogućiti produktivnost, kvalitetu i petlje modificiranih modula.
mir-enable-passive-repair=Zadano isključeno. Daje oštećenim zidovima i vratima u vlasništvu igračeve sile ili njegovih zajedničkih saveznika besplatnu regeneraciju nakon 10 sekundi bez daljnjeg oštećenja. Popravlja najviše 1 zdravlje po posjetu servisu, s 8 entiteta na čekanju servisiranih svake sekunde i najviše 256 praćenih. Veliki redovi oštećenja popravljaju se sporije. Ne koristi pakete za popravak, ne mijenja maksimalno zdravlje niti oživljava uništene entitete. Primjenjuje se na štetu primljenu dok je bila uključena; postojeća oštećenja se ne skeniraju. Zahtijeva ponovno pokretanje nakon promjene ove postavke pokretanja.
ips-enable-stream=Stvara generiranu beskonačnu tehnologiju za __1__ kada su njegovi recepti, učinci, preduvjeti i znanstveni paketi dostupni. Onemogućite ovo kako biste spriječili MIR da generira ovu tehnologiju.
ips-cost-base-stream=Istraživačke jedinice potrebne za prvu generiranu razinu __1__. Mora biti najmanje 1. Kasnije se razine izračunavaju iz ove vrijednosti i faktora rasta troškova.
ips-cost-linear-increment-stream=Istraživačke jedinice dodane za svaku kasniju razinu __1__ prije primjene eksponencijalnog množitelja. Koristite 0 za fiksne ili čisto eksponencijalne troškove.
ips-cost-growth-stream=Množitelj primijenjen na svaku kasniju razinu __1__. Koristite 1 za fiksne troškove, 1,5 za 50% rasta po razini ili 2 za udvostručenje troškova.
ips-max-level-stream=Najviša generirana razina za __1__. Postavite na 0 za beskonačne razine.
ips-research-time-stream=Sekundi po jedinici istraživanja za __1__. Postavite na 0 za korištenje MIR-ove zadane postavke za ovu tehnologiju. Ovo nije ukupno vrijeme istraživanja; ukupno vrijeme također ovisi o cijeni istraživanja, broju laboratorija, brzini laboratorija i modulima.
mir-settings-profile-import=Ovdje zalijepite niz profila postavki MIR-a kako biste primijenili izvezene vrijednosti postavki pokretanja kao sloj nadjačavanja tijekom generiranja prototipa. Ostavite prazno za normalne postavke. Izvezite s /mir-settings-export iz aktivnog spremanja, zatim ponovno pokrenite nakon promjene ove vrijednosti.
ips-effect-per-level-stream=Postavlja primarni učinak osnovnog sloja po razini za __1__. Povezane kasnije razine i učinci skaliraju se proporcionalno. Postotni učinci koriste postotne bodove; efekti brojanja i udaljenosti koriste svoje izvorne jedinice.
