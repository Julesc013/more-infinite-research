[technology-description]
more-infinite-research.spoilage_preservation=Augmenta el modificador global del temps de malbé mitjançant un efecte de guió limitat. Els articles que es poden deteriorar existents poden mantenir els seus terminis actuals fins que no es provi dins del joc.
more-infinite-research.agricultural_growth_speed=Escurça el temps de creixement restant per a les plantes de torre agrícoles recentment plantades mitjançant un efecte de guió limitat.
more-infinite-research.recipe_productivity=Augmenta la productivitat de les receptes per a les receptes seleccionades. El límit màxim de productivitat de Factorio encara s'aplica; Els nivells infinits addicionals poden no tenir cap efecte pràctic una vegada que una recepta arriba al seu límit.
more-infinite-research.cargo_bay_unloading_distance=Augmenta la distància màxima entre una plataforma d'aterratge de càrrega i les zones de descàrrega connectades.
more-infinite-research.cargo_landing_pad_count=Augmenta el nombre de pistes d'aterratge de càrrega que cada força pot construir per superfície.
more-infinite-research.direct_effect=Afegeix una bonificació repetible infinita. Els paquets de ciència es seleccionen dels laboratoris actius, de manera que la tecnologia segueix sent investigable amb conjunts de modificacions compatibles.
more-infinite-research.electric_shooting_speed=Augmenta la velocitat de tir per a armes elèctriques. A la vainilla això afecta la defensa de la descàrrega; amb l'era espacial també afecta les armes de Tesla quan la categoria de munició de Tesla està disponible.
more-infinite-research.flamethrower_shooting_speed=Augmenta la velocitat de tir per a armes llançaflames i torretes llançaflames.
more-infinite-research.lab_productivity=Augmenta el progrés de la investigació obtingut de cada paquet de ciència consumit, utilitzant el modificador de productivitat de la investigació nativa del laboratori.

[modifier-description]
more-infinite-research.spoilage_preservation=Temps de deteriorament: +__1__% per nivell
more-infinite-research.agricultural_growth_speed=Velocitat de creixement agrícola: +__1__% per nivell

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]Compatibilitat:[/color][/font] Permet tots els mòduls a les ranures existents
mir-enable-passive-repair=[font=default-bold][color=purple]Avançat:[/color][/font] Reparació passiva de parets i portes
ips-enable-stream=[font=default-bold]__1__[/font] — activa
ips-cost-base-stream=[font=default-bold]__1__[/font] — cost base
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — cost additiu per nivell
ips-cost-growth-stream=[font=default-bold]__1__[/font] — creixement dels costos
ips-max-level-stream=[font=default-bold]__1__[/font] — nivell màxim
ips-research-time-stream=[font=default-bold]__1__[/font] — temps de recerca
mir-settings-profile-import=[font=default-bold][color=purple]Avançat:[/color][/font] Importa el perfil de configuració MIR
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — efecte per nivell

[mod-setting-description]
mir-note-experimental-spoilage=Tecnologia de risc. Habilitat per defecte. El seu efecte de guió global/a tot el mapa pot canviar el temps de deteriorament; Les piles en mal estat existents poden mantenir els terminis actuals fins que es reconstrueixin o es revalidin. Desactiveu-lo abans de carregar un desat si és fonamental preservar el temps de deteriorament existent.
mir-note-agriculture-growth=S'aplica als cultius de torre agrícoles recentment plantats. Els cultius plantats existents no es reescalen.
mir-unrestricted-modules=Experimental i trencador d'equilibri. Quan està activat, cada recepta existent accepta els cinc efectes del mòdul i cada receptor de mòdul existent amb ranures accepta totes les categories de mòdul descobertes. Això no afegeix ranures de mòduls ni canvia prototips de mòduls, i pot permetre la productivitat, la qualitat i els bucles de mòduls modificats.
mir-enable-passive-repair=Desactivat per defecte. Ofereix a les parets i portes danyades propietat de la força del jugador o dels seus aliats mutus regeneració gratuïta després de 10 segons sense més danys. Reparacions com a màxim 1 salut per visita de servei, amb 8 entitats pendents ateses cada segon i com a màxim 256 rastrejades. Les grans cues de danys es reparan més lentament. No utilitza paquets de reparació, no canvia la salut màxima ni reviu entitats destruïdes. S'aplica als danys rebuts mentre està activat; els danys existents no s'escanegen. Requereix un reinici després de canviar aquesta configuració d'inici.
ips-enable-stream=Crea la tecnologia infinita generada per a __1__ quan les seves receptes, efectes, requisits previs i paquets científics estan disponibles. Desactiveu-ho per evitar que MIR generi aquesta tecnologia.
ips-cost-base-stream=Unitats de recerca necessàries per al primer nivell generat de __1__. Ha de ser com a mínim 1. Els nivells posteriors es calculen a partir d'aquest valor i del factor de creixement del cost.
ips-cost-linear-increment-stream=Unitats de recerca afegides per a cada nivell posterior de __1__ abans que s'apliqui el multiplicador exponencial. Utilitzeu 0 per a costos fixos o purament exponencials.
ips-cost-growth-stream=Multiplicador aplicat a cada nivell posterior de __1__. Utilitzeu 1 per a costos plans, 1,5 per a un creixement del 50% per nivell o 2 per duplicar costos.
ips-max-level-stream=Nivell generat més alt per a __1__. Establiu a 0 per a nivells infinits.
ips-research-time-stream=Segons per unitat de recerca per a __1__. Establiu a 0 per utilitzar el valor predeterminat de MIR per a aquesta tecnologia. Aquest no és temps total de recerca; El temps total també depèn del cost de la investigació, el recompte de laboratoris, la velocitat del laboratori i els mòduls.
mir-settings-profile-import=Enganxeu aquí una cadena de perfil de configuració MIR per aplicar els valors de configuració d'inici exportats com a capa de substitució durant la generació del prototip. Deixa en blanc per a la configuració normal. Exporteu amb /mir-settings-export des d'un desat actiu i, a continuació, reinicieu-lo després de canviar aquest valor.
ips-effect-per-level-stream=Estableix l'efecte de nivell base primari per nivell per a __1__. Els nivells i efectes posteriors relacionats s'escalen proporcionalment. Els efectes percentuals utilitzen punts percentuals; els efectes de recompte i distància utilitzen les seves unitats natives.
