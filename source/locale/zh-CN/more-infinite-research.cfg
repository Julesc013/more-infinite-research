[technology-name]
more-infinite-research.research_spoilage_preservation=腐败保存
more-infinite-research.research_agricultural_growth_speed=农业增长速度
more-infinite-research.research_gears=铁齿轮产能

[technology-description]
more-infinite-research.spoilage_preservation=通过有界脚本效果增加全局破坏时间修改器。现有的可破坏物品可能会保留当前的破坏期限，直到在游戏中进行测试。
more-infinite-research.agricultural_growth_speed=通过有限的脚本效果缩短新种植的农业塔式植物的剩余生长时间。
more-infinite-research.recipe_productivity=提高所选配方的配方生产率。异星工厂的最高生产力上限仍然适用；一旦配方达到上限，额外的无限级别可能没有实际效果。

[modifier-description]
more-infinite-research.spoilage_preservation=腐败时间：+__1__% 每级
more-infinite-research.agricultural_growth_speed=农业增长速度：+__1__% 每级

[mod-setting-name]
mir-unrestricted-modules=[font=default-bold][color=cyan]兼容性：[/color][/font] 允许现有插槽中的所有模块
mir-enable-passive-repair=[font=default-bold][color=purple]高级：[/color][/font]被动墙和大门维修
ips-enable-stream=[font=default-bold]__1__[/font] — 启用
ips-cost-base-stream=[font=default-bold]__1__[/font] — 基本成本
ips-cost-linear-increment-stream=[font=default-bold]__1__[/font] — 每级的附加成本
ips-cost-growth-stream=[font=default-bold]__1__[/font] — 指数乘数
ips-max-level-stream=[font=default-bold]__1__[/font] — 最高级别
ips-research-time-stream=[font=default-bold]__1__[/font] — 研究时间
mir-settings-profile-import=[font=default-bold][color=purple]高级：[/color][/font] 导入 MIR 设置配置文件
ips-effect-per-level-stream=[font=default-bold]__1__[/font] — 每级效果

[mod-setting-description]
mir-note-experimental-spoilage=危险技术。默认启用。其全局/地图范围内的脚本效果可以改变破坏时间；现有的易损坏堆栈可能会保留当前的截止日期，直到重建或重新验证为止。如果保留现有的损坏时间至关重要，请在加载保存之前禁用它。
mir-note-agriculture-growth=适用于新种植的塔式作物。现有种植作物不会重新调整规模。
mir-unrestricted-modules=实验性且打破平衡。启用后，每个现有配方都会接受所有五个模块效果，并且每个带插槽的现有模块接收器都会接受每个发现的模块类别。这不会添加模块插槽或更改模块原型，并且可以实现生产力、质量和模块化模块循环。
mir-enable-passive-repair=默认关闭。 10 秒后，为玩家部队或其共同盟友所拥有的受损墙壁和大门提供免费再生，而不会造成进一步伤害。每次服务访问最多修复 1 个运行状况，每秒服务 8 个待处理实体，最多跟踪 256 个实体。大的损坏队列修复速度更慢。不使用修理包、改变最大生命值或复活被破坏的实体。适用于启用时受到的伤害；不扫描现有损坏。更改此启动设置后需要重新启动。
ips-enable-stream=当其配方、效果、先决条件和科学包可用时，为__1__创建生成的无限技术。禁用此选项可防止 MIR 生成该技术。
ips-cost-base-stream=第一个生成级别__1__所需的研究单位。必须至少为 1。后续级别根据该值和成本增长因子计算。
ips-cost-linear-increment-stream=为每个更高级别添加的研究单位 __1__ 在应用指数乘数之前。使用 0 表示固定或纯指数成本。
ips-cost-growth-stream=乘数应用于__1__ 的每个后续级别。使用 1 表示固定成本，使用 1.5 表示每级增长 50%，或使用 2 表示成本加倍。
ips-max-level-stream=__1__ 的最高生成级别。设置为 0 表示无限级别。
ips-research-time-stream=__1__ 每个研究单位的秒数。设置为 0 以使用 MIR 对此技术的默认设置。这不是总的研究时间；总时间还取决于研究成本、实验室数量、实验室速度和模块。
mir-settings-profile-import=在此处粘贴 MIR 设置配置文件字符串，以在原型生成期间应用导出的启动设置值作为覆盖层。对于正常设置留空。使用 /mir-settings-export 从活动保存中导出，然后在更改此值后重新启动。
ips-effect-per-level-stream=设置__1__每个级别的主要基础层效果。相关的后续层和效果按比例缩放。百分比效应使用百分点；计数和距离效果使用其原生单位。
