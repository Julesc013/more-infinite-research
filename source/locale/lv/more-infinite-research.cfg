[string-mod-setting-description]
mir-adjust-vanilla-weapon-speed-techs-always=Vienmēr noņemiet MIR pārklājošos raķešu/lielgabalu bonusus. Izmantojiet tikai tad, ja vēlaties stingri nošķirt.
mir-adjust-vanilla-weapon-speed-techs-off=Atspējot MIR papildu pārklāšanās raķešu/lielgabalu tīrīšanu.
mir-adjust-vanilla-weapon-speed-techs-only-when-dedicated-tech-enabled=Noņemiet MIR pārklājošos raķešu/lielgabalu bonusus tikai tad, ja iespējota, sasniedzama bezgalīga tehnoloģija nodrošina precīzu aizvietošanas efektu.
mir-lab-incompatibility-policy-engine-default=Nekad nepārrakstiet atlasīto zinātnisko komplektu komplektu. MIR saglabā droši pētāmu kopu nemainīgu un izlaiž ģenerēto tehnoloģiju, ja Factorio nevar izpētīt šo precīzu kopu.
mir-lab-incompatibility-policy-reduce=Saglabājiet tehnoloģiju, samazinot tās zinātnes pakotnes līdz lielākajam komplektam, ko pieņem aktīva laboratorija. Drošākais noklusējums mod pakotnēm.
mir-lab-incompatibility-policy-skip=Izlaidiet tehnoloģiju, ja neviena aktīva laboratorija nevar izpētīt atlasīto zinātnisko komplektu komplektu. Stingrāka un vieglāk pārbaudāma.
mir-prototype-efficiency-cap-engine-default=Atstājiet katras iekārtas enerģijas patēriņa efekta ierobežojumu. Mašīnas bez pielāgota ierobežojuma izmanto Factorio parasto -80% enerģijas patēriņa efekta ierobežojumu, tāpēc efekti nevar samazināt aktīvo izmantošanu zem 20%.
mir-prototype-efficiency-cap-saving-25=Uzrakstiet -25% enerģijas patēriņa ierobežojumu. Pēc enerģijas izmantošanas ietekmes aktīvais enerģijas patēriņš saglabājas 75% vai vairāk.
mir-prototype-efficiency-cap-saving-50=Uzrakstiet -50% enerģijas patēriņa ierobežojumu. Aktīvais enerģijas patēriņš paliek 50% vai vairāk pēc enerģijas patēriņa ietekmes atbalstītajās iekārtās.
mir-prototype-efficiency-cap-saving-75=Uzrakstiet -75% enerģijas patēriņa ierobežojumu. Aktīvais enerģijas patēriņš paliek 25% vai vairāk pēc enerģijas patēriņa ietekmes atbalstītajās iekārtās.
mir-prototype-efficiency-cap-saving-90=Uzrakstiet -90% enerģijas patēriņa ierobežojumu. Aktīvais enerģijas patēriņš var samazināties līdz 10%, kas ir zem parastās 20% grīdas.
mir-prototype-efficiency-cap-saving-95=Uzrakstiet -95% enerģijas patēriņa ierobežojumu. Aktīvās enerģijas patēriņš var samazināties līdz 5%.
mir-prototype-efficiency-cap-saving-99=Uzrakstiet -99% enerģijas patēriņa ierobežojumu. Aktīvās enerģijas patēriņš var samazināties līdz 1%.
mir-prototype-efficiency-cap-saving-999=Uzrakstiet -99,9% enerģijas patēriņa ierobežojumu. Aktīvās enerģijas patēriņš var samazināties līdz 0,1%.
mir-prototype-efficiency-cap-saving-9999=Uzrakstiet -99,99% enerģijas patēriņa ierobežojumu. Tas ir gandrīz nulles aktīvās enerģijas patēriņš, nevis nulles jaudas prototipa pārrakstīšana.
mir-prototype-pollution-cap-engine-default=Atstājiet katras iekārtas piesārņojuma ietekmes ierobežojumu. Mašīnās bez pielāgota ierobežojuma tiek izmantots Factorio parastais -80% piesārņojuma ierobežojums.
mir-prototype-pollution-cap-saving-25=Uzrakstiet -25% piesārņojuma vāciņu. Pēc piesārņojuma ietekmes piesārņojums saglabājas 75% vai vairāk.
mir-prototype-pollution-cap-saving-50=Uzrakstiet -50% piesārņojuma vāciņu. Pēc piesārņojuma ietekmes uz atbalstītajām mašīnām piesārņojums saglabājas 50% vai vairāk.
mir-prototype-pollution-cap-saving-75=Uzrakstiet -75% piesārņojuma vāciņu. Pēc piesārņojuma ietekmes uz atbalstītajām mašīnām piesārņojums saglabājas 25% vai vairāk.
mir-prototype-pollution-cap-saving-90=Uzrakstiet -90% piesārņojuma vāciņu. Piesārņojums var samazināties līdz 10%, kas ir zem parastā 20% līmeņa.
mir-prototype-pollution-cap-saving-95=Uzrakstiet -95% piesārņojuma vāciņu. Piesārņojums var samazināties līdz 5%.
mir-prototype-pollution-cap-saving-99=Uzrakstiet -99% piesārņojuma vāciņu. Piesārņojums var samazināties līdz 1%.
mir-prototype-pollution-cap-saving-999=Uzrakstiet -99,9% piesārņojuma vāciņu. Piesārņojums var samazināties līdz 0,1%.
mir-prototype-pollution-cap-saving-9999=Uzrakstiet -99,99% piesārņojuma vāciņu. Šis ir gandrīz nulles piesārņojums, nevis izpildlaika piesārņojuma skripts.
mir-prototype-productivity-cap-engine-default=Atstājiet katras receptes esošo produktivitātes ierobežojumu. Receptes bez pielāgota vāciņa izmanto Factorio parasto +300% produktivitātes bonusa ierobežojumu.
mir-prototype-quality-cap-bonus-100=Nostipriniet pozitīvos kvalitātes efektus pie +100%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-1000=Nostipriniet pozitīvos kvalitātes efektus pie +1000%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-10000=Nostipriniet pozitīvos kvalitātes efektus pie +10000%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-125=Nostipriniet pozitīvos kvalitātes efektus pie +125%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-150=Nostipriniet pozitīvos kvalitātes efektus pie +150%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-200=Nostipriniet pozitīvos kvalitātes efektus pie +200%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-25=Nostipriniet pozitīvos kvalitātes efektus pie +25%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-250=Nostipriniet pozitīvos kvalitātes efektus pie +250%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-2500=Nostipriniet pozitīvos kvalitātes efektus pie +2500%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-25000=Nostipriniet pozitīvos kvalitātes efektus pie +25000%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-300=Nostipriniet pozitīvos kvalitātes efektus pie +300%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-400=Nostipriniet pozitīvos kvalitātes efektus pie +400%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-50=Nostipriniet pozitīvos kvalitātes efektus pie +50%. Tas ierobežo mašīnas kvalitātes bonusa efektus, nevis kvalitātes līmeņus vai vienumu varbūtības formulas.
mir-prototype-quality-cap-bonus-500=Nostipriniet pozitīvos kvalitātes efektus pie +500%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-5000=Nostipriniet pozitīvos kvalitātes efektus pie +5000%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-75=Nostipriniet pozitīvos kvalitātes efektus pie +75%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-bonus-750=Nostipriniet pozitīvos kvalitātes efektus pie +750%. Tas nemaina kvalitātes līmeņus vai vienību varbūtības formulas.
mir-prototype-quality-cap-engine-default=Atstājiet katras iekārtas kvalitātes un ietekmes ierobežojumu. Mašīnās bez pielāgota ierobežojuma tiek izmantoti Factorio ļoti augstie +100000% kvalitātes efekta griesti.
mir-prototype-speed-cap-bonus-100=Nostipriniet pozitīvo ātruma efektu pie +100%.
mir-prototype-speed-cap-bonus-1000=Nostipriniet pozitīvo ātruma efektu pie +1000%.
mir-prototype-speed-cap-bonus-10000=Nostipriniet pozitīvo ātruma efektu pie +10000%.
mir-prototype-speed-cap-bonus-125=Nostipriniet pozitīvos ātruma efektus pie +125%.
mir-prototype-speed-cap-bonus-150=Nostipriniet pozitīvo ātruma efektu pie +150%.
mir-prototype-speed-cap-bonus-200=Nostipriniet pozitīvo ātruma efektu pie +200%.
mir-prototype-speed-cap-bonus-25=Nostipriniet pozitīvo ātruma efektu pie +25%.
mir-prototype-speed-cap-bonus-250=Nostipriniet pozitīvo ātruma efektu pie +250%.
mir-prototype-speed-cap-bonus-2500=Nostipriniet pozitīvo ātruma efektu pie +2500%.
mir-prototype-speed-cap-bonus-25000=Nostipriniet pozitīvo ātruma efektu pie +25000%.
mir-prototype-speed-cap-bonus-300=Nostipriniet pozitīvo ātruma efektu pie +300%.
mir-prototype-speed-cap-bonus-400=Nostipriniet pozitīvo ātruma efektu pie +400%.
mir-prototype-speed-cap-bonus-50=Nostipriniet pozitīvos ātruma efektus pie +50%. Izmantojiet to, lai ātruma bonusi būtu stingri ierobežoti.
mir-prototype-speed-cap-bonus-500=Nostipriniet pozitīvo ātruma efektu pie +500%.
mir-prototype-speed-cap-bonus-5000=Nostipriniet pozitīvo ātruma efektu pie +5000%.
mir-prototype-speed-cap-bonus-75=Nostipriniet pozitīvo ātruma efektu pie +75%.
mir-prototype-speed-cap-bonus-750=Nostipriniet pozitīvo ātruma efektu pie +750%.
mir-prototype-speed-cap-engine-default=Atstājiet katras mašīnas ātruma ierobežojumu. Mašīnās bez pielāgota ierobežojuma tiek izmantoti Factorio ļoti augstie +100000% ātruma efekta griesti.
mir-prototype-speed-floor-engine-default=Atstājiet katras mašīnas negatīvo ātruma ierobežojumu. Mašīnas bez pielāgota ierobežojuma izmanto Factorio parasto -80% grīdu un uztur vismaz 20% ātrumu.
mir-prototype-speed-floor-saving-25=Nospiediet negatīvos ātruma efektus pie -25%, atstājot vismaz 75% ātrumu.
mir-prototype-speed-floor-saving-50=Nospiediet negatīvos ātruma efektus pie -50%, atstājot vismaz 50% ātrumu.
mir-prototype-speed-floor-saving-75=Nospiediet negatīvos ātruma efektus pie -75%, atstājot vismaz 25% ātrumu.
mir-prototype-speed-floor-saving-90=Atļaujiet negatīvus ātruma efektus līdz -90%, atstājot vismaz 10% ātrumu.
mir-prototype-speed-floor-saving-95=Atļaujiet negatīvus ātruma efektus līdz -95%, atstājot vismaz 5% ātrumu.
mir-prototype-speed-floor-saving-99=Atļaujiet negatīvus ātruma efektus līdz -99%, atstājot vismaz 1% ātrumu.
mir-prototype-speed-floor-saving-999=Atļaujiet negatīvus ātruma efektus līdz -99,9%, atstājot vismaz 0,1% ātrumu.
mir-prototype-speed-floor-saving-9999=Atļaujiet negatīvus ātruma efektus līdz -99,99%, kas ir zemākais Factorio prototipa ierobežojums. Tas ir gandrīz pieturas, nevis nulles vai negatīvs izstrādes ātrums.
mir-recycling-return-chance-engine-default=Atstājiet visas pārstrādes receptes nemainīgas.
mir-recycling-return-chance-match-productivity-cap=Ekspluatācijai droša automātiska samazināšana slēptām ģenerētām otrreizējās pārstrādes receptēm. Izmanto 1 / (1 + produktivitātes bonuss), nepārsniedzot parasto 25% atdevi: +400% kļūst par 20%, un +1000% kļūst par aptuveni 9,09%.
mir-recycling-return-chance-percent-0-1=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 0,1% materiāla atdevei.
mir-recycling-return-chance-percent-0-5=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 0,5% materiāla atdevei.
mir-recycling-return-chance-percent-1=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 1% materiāla atdevei.
mir-recycling-return-chance-percent-10=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 10% materiāla atdevei.
mir-recycling-return-chance-percent-12-5=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 12,5% materiāla atdevei.
mir-recycling-return-chance-percent-15=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 15% materiāla atdevei.
mir-recycling-return-chance-percent-2-5=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 2,5% materiāla atdevei.
mir-recycling-return-chance-percent-20=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 20% materiāla atdevei.
mir-recycling-return-chance-percent-5=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 5% materiāla atdevei.
mir-recycling-return-chance-percent-7-5=Mērogojiet slēptās ģenerētās otrreizējās pārstrādes receptes līdz 7,5% materiāla atdevei.
mir-science-pack-ingredient-policy-all=Izmantojiet katru aktīvo ar laboratoriju saderīgo zinātnes pakotni, tostarp modificētās zinātnes pakotnes.
mir-science-pack-ingredient-policy-all-official=Izmantojiet visas oficiālās bāzes un kosmosa laikmeta zinātnes pakotnes, kas pastāv pašreizējā moduļu komplektā.
mir-science-pack-ingredient-policy-configured=Izmantojiet katras ģenerētās tehnoloģijas konfigurētās zinātnes pakotnes bez papildu sastāvdaļu paplašināšanas. MIR noklusējuma.
mir-science-pack-ingredient-policy-official-progression=Pievienojiet trūkstošos oficiālos priekšnoteikumu stila pakotnes, ko norāda jau atlasītā vismodernākā oficiālā pakotne.
mir-science-pack-ingredient-policy-space=Pievienojiet kosmosa zinātni, ja iespējams. Vienkāršs grūtības pieaugums pēc raķetes.
mir-science-pack-ingredient-policy-space-age-progression=Pievienojiet tikai Kosmosa laikmeta progresēšanas pakotnes, ko paredz atlasītās pakotnes. Nepievieno nesaistītus modificētus iepakojumus.
mir-science-pack-ingredient-policy-space-and-promethium=Pievienojiet kosmosa un prometija zinātni, kad tas ir pieejams. Vispiemērotākais ļoti vēlā kosmosa laikmeta izpētes izlietnēm.
