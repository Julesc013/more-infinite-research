target_docs_root: docs/compatibility/targets

compatibility_packs:
  schema: 2
  validator: prototypes/mir/compatibility/packs/schema.lua
  registry: prototypes/mir/compatibility/packs/registry.lua
  external_transport: more-infinite-research-compatibility-pack
  fixture_only_profiles_allowed_in_production_registry: false
  applicability:
    any_field: mods_any
    all_field: mods_all
    none_field: mods_none
    legacy_any_field: mods
    version_constraints: comma-separated-comparators
  production_consumers:
    - exact-includes-excludes
    - aliases
    - family-hints
    - science-roles
    - owner-claims
    - reviewed-risk-overrides
    - exact-family-generation-authorizations
    - exact-candidate-seeds
    - deterministic-precedence
  hard_safety:
    compatibility_pack_overridable: false
    reviewable_signals_require_exact_recipe_version_and_fixture: true
  exact_pack:
    unrelated_active_pack_enables_generation: false
    authorization_query: compatibility_packs.authorizes_family_stream
    baseline: safe-attachment

generated_policy_authority:
  schema: 1
  implementation: prototypes/mir/compatibility/policy_authority.lua
  context_state: compatibility_policy_authority
  sources:
    - prototypes/mir/compatibility/overlay_loader.lua
    - prototypes/mir/compatibility/packs/registry.lua
    - prototypes/mir/compatibility/claim_registry.lua
  reviewed_corpus: .mir/technology-review-corpus.json
  planning_consumers:
    - prototypes/mir/families/resolver.lua
    - prototypes/mir/planner/stream_compiler.lua
    - prototypes/mir/capabilities/science_integration/science_selector.lua
    - prototypes/mir/compatibility/profiles.lua
  rules:
    - only this facade composes overlays active packs claims and their policy fingerprint
    - hard prototype safety remains non-overridable
    - public claims remain separately governed and evidence-bound

science_phase_policies:
  - id: K2SciencePhasePolicyV2
    implementation: prototypes/mir/compatibility/policies/k2_science_phase.lua
    profiles:
      - id: factorio-2.1-k2so
        target: f210
        mod_ids: [base, Krastorio2, Krastorio2-spaced-out]
        version_ranges:
          base: ">=2.1.0 <2.2.0"
          Krastorio2: ">=2.1.2 <2.1.3"
          Krastorio2-spaced-out: ">=2.0.11 <2.0.14"
        proof_roots:
          - local-2-1-krastorio-spaced-out
        exact_endpoint_evidence:
          lower: build/results/mir4-sol/sol06/k2so-f210-lower-v3
          upper: build/results/mir4-sol/sol06/k2so-f210-upper-v3
      - id: factorio-2.0-k2so-standalone
        target: f200
        mod_ids: [base, Krastorio2-spaced-out]
        forbidden_mod_ids: [Krastorio2]
        version_ranges:
          base: ">=2.0.73 <2.1.0"
          Krastorio2-spaced-out: ">=1.6.21 <1.6.22"
        proof_roots:
          - local-2-0-krastorio-spaced-out
    capability_fingerprint:
      source: research-pack-prototype-identities
      profile_rule: every identity required by the matched target profile must exist
      factorio-2.1-k2so-additional-identities:
        - kr-basic-tech-card
      common_required_science_identities:
        - automation-science-pack
        - chemical-science-pack
        - kr-advanced-tech-card
        - kr-matter-tech-card
        - kr-singularity-tech-card
        - logistic-science-pack
        - military-science-pack
        - production-science-pack
        - space-science-pack
        - utility-science-pack
    scope: MIR-owned generated stream and base-continuation technologies only
    application_stage: planner-after-lab-compatibility-before-technology-design
    behavior:
      production_or_utility: remove-kr-basic-tech-card
      advanced_space_matter_or_singularity: remove-basic-automation-logistic-military-chemical
    invariants:
      - no behavior outside a bounded target-specific version envelope
      - no behavior when required science identities are absent
      - normalized output remains accepted by at least one lab because normalization only removes ingredients from a prequalified lab-compatible set
      - Factorio 2.0 standalone K2SO rejects a co-loaded Krastorio2 identity
      - stable technology IDs
      - idempotent ingredient normalization
      - preserve ingredient order shapes and amounts
      - never emit an empty or lab-invalid ingredient list
      - never invoke private K2 finalization code
    fixture: fixtures/assert-k2-science-phase-policy
    exact_real_campaigns:
      - local-2-1-krastorio-spaced-out
      - local-2-0-krastorio-spaced-out
    admission_status: implemented-exact-f210-and-private-f200-development-proof-passed
    public_claim: development-evidence-only-no-public-release-claim-authorized

