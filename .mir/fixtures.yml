    expected_count: 70
    validator: validation/tests/tooling/Test-MIRGoldenPlans.ps1
  automatic_family_technology_ids:
    path: fixtures/golden-plans/automatic-family-technology-ids.json
    release: "3.1.0"
    expected_count: 2
