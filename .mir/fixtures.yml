schema: 1

scenario_manifest:
  path: validation/scenarios/runtime.json
  schema: 3
  declarations: full-records
  record_owns:
    - fixtures
    - settings
    - source_mode
    - timeout_seconds
    - tags
    - isolation
    - assertions

test_impact_manifest:
  path: .mir/test-impact.yml
  schema: 1
  baseline: exact-package-smoke
  selector: scripts/Invoke-MIRValidation.ps1

verification_manifests:
  tests:
    path: validation/tests.yml
    schema: 2
    owns:
      - stable-test-ids
      - matrix-expansion
      - factorio-layer
      - declared-effective-inputs
  domains:
    path: validation/domains.yml
    schema: 1
    policy: mir-verification-v4
    owns:
      - package-domain-hashes
      - scenario-domain-dependencies
      - unknown-input-invalidation
  profiles:
    root: validation/profiles
    schema: 1
    targets:
      - factorio-2.0
      - factorio-2.1
  trust:
    path: validation/trust.json
    schema: 1
    owns:
      - evidence-trust-classes
      - release-producer-policy
      - same-class-reuse
  evidence:
    schema: 4
    root: build/results/assurance/evidence
    schemas: spec/schemas
    dispositions:
      - REUSE
      - WAIT
      - RUN
      - INVALID

compiler_contract_coverage:
  path: .mir/compiler-contract-coverage.yml
  schema: 1
  validator: validation/tests/compiler/Test-MIRCompilerContractCoverage.ps1

offline_rule_synthesis:
  authority: .mir/rule-synthesis.json
  corpus: .mir/technology-review-corpus.json
  snapshots: .mir/technology-review-snapshots.json
  synthesizer: tools/commands/technology/Invoke-MIRRuleSynthesis.ps1
  validator: validation/tests/compiler/Test-MIRRuleSynthesis.ps1
  validates:
    - all-positive-coverage
    - all-negative-rejection
    - mandatory-hard-predicate-retention
    - minimized-new-unreviewed-matches
    - deterministic-review-required-output
    - no-production-mutation-authority

mod_interaction_campaigns:
  policy: .mir/mod-interaction-policy.json
  graph: .mir/mod-interaction-graph.json
  campaigns: .mir/combination-campaigns.json
  validator: validation/tests/compatibility/Test-MIRModInteractions.ps1
  runtime_scenarios:
    - combination-atan-ash-big-mining-drill
    - combination-space-age-big-mining-drill
    - space-age-galore-effect-ownership
  validates:
    - semantic-footprint-intersection
    - independent-composition-smoke-routing
    - overlapping-targeted-campaign-routing
    - narrow-pair-delta-policy
    - zero-uncovered-overlapping-pairs

local_campaign_manifest:
  path: validation/scenarios/local-2.1.json
  factorio_2_0_path: validation/scenarios/local-2.0.json
  shared_manual_path: validation/scenarios/manual.json
  schema: 2
  validator: validation/tests/compatibility/Test-MIRScenarioManifests.ps1
  record_owns:
    - targets
    - kind
    - group
    - setup
    - roots
    - settings
    - expected_plan
    - timeout_seconds
    - claim_level
    - required_stream_science
  sanitation_budget:
    path: .mir/sanitation-budgets.json
    policy: mir-ecosystem-sanitation-budget-v1
    validator: validation/tests/release/Test-MIRSanitationBudgets.ps1
    scopes:
      manifest_scenarios: campaigns
      release_targeted_repair_smokes: local_mod_zips
    unknown_repair_disposition: REVIEW_REQUIRED
  independent_aai_scenarios:
    - local-2-1-aai-loaders
    - local-2-1-aai-industry
    - local-2-1-aai-loaders-industry
    - local-2-1-aai-representative-extensions

golden_plans:
