mutation_commands:
  registry: prototypes/mir/pipeline/commands.lua
  rules:
    - every prototype-changing pass has a stable command id
    - every command declares positive target feature requirements
    - every command declares a phase and explicit dependencies
    - command dependencies are acyclic and enforced before execution
    - only emission commands may create generated technology prototypes
    - mutation commands may change existing prototypes only through their listed implementation
    - CompilationPlan schema 2 globally finalizes stream adoption and base-extension operations before emission
    - CompilationSnapshot schema 2 and PolicySnapshot schema 1 are the only inputs to the pure planner compiler API
    - RuntimeEnvironmentIdentity and QualificationEnvironmentIdentity bind runtime behavior and assurance machinery separately
    - decoded external records are deeply verified once before a module-private weak-key authority admits them to the compiler trust domain
    - compiler-owned immutable records use cheap trusted identity assertions internally and reserve complete canonical revalidation and deep copies for explicit import export and final postcondition boundaries
    - owned design qualification and GenerationPlan construction validate each exact gate and row once before finalization while untrusted imported records retain complete verification
    - byte-identical source default non-materializing sanitation and output-identity gates share exact trusted instances and per-row decisions replace map entries without mutating gates
    - CompilationPlan sanitation owns copy-on-write row gate and fields tables and graph proof mutates only that transient projection while preserving source GenerationPlan isolation
    - ephemeral pre-graph operations admit finalized designs and total trusted gates without constructing discarded SafetyQualification records while final operations still require exact qualification
    - pre-graph operations share read-only trusted prototype values and a shallow operation vector while final materialization owns complete prototype projections
    - aggregate snapshot catalog operation plan and compilation fingerprints bind exact stored component fingerprints instead of embedding and recanonicalizing complete trusted records
    - planning stage row copies preserve immutable gate record identity while copying only the mutable gate map
    - each compiler-owned TechnologyDesign copies external values once then shares those exact immutable values across dimension subject member and leaf-provenance views; imported designs remain independently deep-verified
    - catalog candidates share the exact trusted semantic identity and typed subjects from their TechnologyDesign and diagnostic alternatives reuse unchanged subject and prototype fingerprints while recomputing changed design and qualification identities
    - TechnologyDesign and SafetyQualification fingerprints bind each immutable gate through its exact status evaluator pass state and evidence fingerprint rather than serializing the complete evidence tree again
    - effect ownership resolution copies mutable row data while preserving private authority for exact immutable gate records
    - combined CompilationPlan ownership resolves cross-operation direct-effect identities after stream and base-continuation plans join; adopted owners outrank emitted streams and emitted streams outrank base continuations, while same-operation duplicates remain strict validation failures
    - a base continuation that loses some effects is re-designed and re-fingerprinted from its retained vector, while one that loses every effect becomes a non-materializing rejected candidate
    - each complete effect-safety pass captures one immutable target inventory and shares it across every technology and effect check
    - effect target membership indexes are private weak-key caches derived from immutable inventory values and never enter fingerprints or public artifacts
    - output sanitation and generated effect assertions share the same freshly captured target inventory
    - CompilerContext owns the immutable input effect target inventory as a non-public service and output validation proves exact current name-set parity before reuse
    - sanitation copies and reconstructs an effect vector only after an in-place validation pass finds an invalid target
    - output projection equality uses direct cycle-safe structural comparison and computes diagnostic fingerprints only after a mismatch
    - MutationJournal finalization builds terminal state once and binds complete entry snapshots through their ordered immutable entry fingerprints
    - diagnostic catalog alternatives qualify against the exact trusted gate set constructed with their immutable diagnostic design
    - owned constructors compute aggregate fingerprints once while untrusted imports always recompute and verify them
    - CompilationSnapshot PolicySnapshot RuntimeEnvironmentIdentity and CompilerInput use private validation-once authorities; trusted internal consumers assert stored identities while copied or imported values receive complete component and aggregate verification
    - CompilationSnapshot hashes its already canonicalized captured fact domains without serializing them a second time and qualified snapshots reuse only exact trusted component fingerprints
    - the MIR32 canonical hash consumes bytes in identity-preserving sixteen-byte reads with an eight-byte tail while retaining the exact per-byte recurrence and modulus
    - canonical encoding avoids allocation for arrays, captures ordinary string-key maps in one traversal with direct raw-key sorting, reuses at most 4096 quoted string tokens, and preserves the existing typed-key ordering and byte encoding
    - canonical diagnostic paths are constructed in a second traversal only for malformed or cyclic input; valid compilation retains identical bytes without allocating path strings
    - SafetyQualification is reused only for the exact trusted TechnologyDesign row action stream and gate-instance vector; legitimate derived gate vectors construct distinct records
    - TechnologyDesign prototype fingerprinting reads immutable projection values directly while public prototype projections retain one defensive deep copy
    - controlled diagnostic TechnologyDesign derivation asserts its exact changed branches and shared immutable branches instead of repeating full source-design validation
    - pure compiler dispositions reuse the exact TechnologyDesign qualification fingerprint and TransformationOperation copies a trusted prototype projection exactly once
    - internal CompilationPlan state shares the exact trusted CompilerInput rather than deep-copying immutable snapshot and policy trees
    - compiler-owned immutable records may share one exact reference between context state and the internal artifact index only after their module-private trust authority accepts them; all artifact reads and complete context snapshots remain defensive copies
    - singleton strongly connected components use an exact length-prefixed node identity while multi-node components retain canonical fingerprints
    - realized graph postconditions compare the live normalized prototype projection field by field against the trusted graph snapshot and reuse its exact authority only after equality while declared competitor replacements require an exact frozen mutation journal projection and fresh realized-graph qualification
    - each graph qualification shares one exact trusted passing proof across accepted planned technologies while retaining distinct rejection causality
    - graph researchability consumes a snapshot-owned stable node view and externally owned graph maps remain defensive copies
    - graph qualification establishes one sorted technology name authority for snapshot SCC and reverse-edge construction and shares its freshly owned sorted prerequisite arrays and reverse edges with the immutable graph pipeline
    - every technology create or patch is a schema-2 TransformationOperation in one schema-2 TransformationPlan and produces one plan-bound schema-2 MutationJournal entry
    - SAFE and PREVIEW retain review-required candidates without aborting startup while REVIEWED STRICT_CI and RELEASE apply their exact captured review policy
    - CompilerResult schema 3 separates immutable planned material from final APPLIED or FAILED execution evidence and uses private validation-once authority so owned planning finalization and publication never rehash its complete disposition collections
    - normal loads publish only bounded public catalog projections; full catalogs require preview diagnostics validation or offline export
    - output validation compares numeric effects graph presentation save identity and generated-registry projections
    - input technology sanitation runs after compatibility repairs and before every index or planning pass and records content-addressed original retained removed and sanitized effects
    - final technology safety reruns target-aware sanitation before reporting and output validation as a defensive postcondition
    - no sanitation-covered target prototype family may be created or removed after input sanitation
    - CompilationPlan separates compilation qualification and run fingerprints
    - postcondition publication emits target-neutral content-addressed compiler evidence with mod-data and validation-log adapters
    - final APPLIED compiler results derive one bounded neutral-default research-cost disposition with typed evidence and explicit Factorio 2.1 mod-data and Factorio 2.0 validation-log transport rows
    - stream planning and emission consume TechnologyDesign schema 2 without changing released technology identities
    - every emitted GenerationPlan row carries one validated TechnologyDesign and legacy fields are derived compatibility projections only
    - every adopted GenerationPlan row carries one patch-existing TechnologyDesign binding the immutable owner input and complete expected output
    - the schema-3 TechnologyCatalog is finalized once after sanitation and graph proof, preserves rejected designs, publishes as one exact artifact, and has no mutation authority
    - TechnologyCatalog finalization admits each unexposed child once then rechecks all catalog cross-references selections and resolved statuses without repeating child registry lookups
    - synchronous catalog candidate and qualification construction reuses exact designs and gate vectors already admitted during the same unexposed build while public constructors retain full admission
    - stream compilation produces source rows only; CompilationPlan is the sole TechnologyCatalog construction and finalization owner and no transient catalog is discarded
    - the finalized GenerationPlan handoff uses a private exact-instance artifact authority while copied and imported plan artifacts retain complete CompilationPlan admission
    - the TechnologyCatalog includes accepted and rejected base continuation candidates under the same hard-gate authority
    - every GenerationPlan is an exact projection of the catalog selection policy
    - SafetyQualification DesignAssessment and PromotionAuthorization are independent fingerprinted decisions
    - only MIR-owned mir-reviewed or protected-release promotion authorizations may satisfy reviewed automatic generation
    - approval promotion demotion quarantine and migration records are independently fingerprinted governance decisions
    - approved structural applicability is a fingerprinted data-only envelope with exact mods positive examples negative examples and bounded new matches
    - family providers flow through explicit discovery normalization classification pack-policy hazard-policy owner-arbitration decision and budget stages
    - stream and FamilyRule registries expose explicit read-only views for source-owned validated catalogs while snapshots remain defensive ownership boundaries
    - ProviderMetrics binds provider version family partition exact environment measured dispositions unlock depth timing bytes witnesses and per-metric provenance
    - family resolution builds one context-owned stream query index from the exact canonical decision set and excludes that derived cache from provider snapshots and identities
    - active planning may share explicitly read-only context artifact and family-resolution views while public artifact reads and provider snapshots remain defensive copies
    - provider budgets suppress only new-unreviewed proposals and preserve exact-reviewed attachments and hard-blocker diagnostics
    - compatibility policy authority is the only planning facade that composes overlays active packs claims and policy fingerprints
    - planner modules have zero imports of emit modules; pipeline compiler orchestration owns all planning-to-emission sequencing
    - stream and base continuation planning are separate from emission and both use the shared technology operation executor
    - stream emission and fingerprint-verified patch-existing adoption mutation are applied only by the emission-owned technology operation executor
    - reviewed compatibility data cannot override hard prototype safety facts
    - exact-version compatibility repairs remain separately bounded
  ids:
    - compatibility-repairs
    - recipe-productivity-permissions
    - sanitize-input-technology-effects
    - module-permissions
    - prototype-limits
    - pipeline-extent
    - prepare-competing-productivity
    - prepare-competing-base-extensions
    - compile-generation-plan
    - emit-streams
    - apply-competing-productivity
    - emit-base-extensions
    - apply-competing-base-extensions
    - weapon-speed-adjustments
    - max-level-control
    - assert-technology-safety
    - emit-compatibility-diagnostics
    - emit-compiler-reports
    - emit-compatibility-planner
    - assert-plan-output
    - publish-compiler-artifacts
    - flush-diagnostics

