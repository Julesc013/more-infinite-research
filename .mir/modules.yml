  rules:
    - the visible product plane and hidden operational plane use the canonical logical path catalog and historical aliases are read only
    - source-of-truth projections are owned by domain command families under tools commands while scripts retains parameter-compatible read-only wrappers and immutable historical worktrees may invoke their contemporary legacy paths
    - control plane v5 changes remain tooling-only and reproduce the exact locked 3.2.2 and P9 package identities
    - typed change incident task release and transition records are authoritative and human-readable status files are generated views
    - F0 through F4 are classification labels while the scheduler follows explicit task prerequisites and resource constraints
    - aggregate nodes evaluate completed atomic results and never execute their children
    - aggregate TaskNode closure adopts one exact existing same-context same-trust result only when its member digest set is identical and rejects missing conflicting or ambiguous evidence
    - fresh calibration proof authority is the one exact final qualification execution-manifest closure and rejects duplicate identities or results outside that closure
    - compact execution manifest rows select only task identity status and object digest while the dereferenced content addressed TaskNode object supplies and must exactly match context input identity trust and revocation authority
    - post execution calibration proof materialization may use only a clean committed ABI identical descendant verifier and binds both that verifier and the immutable controller commit while every admitted evidence producer remains exact controller bound
    - environment capture compilation realization and evaluation use independent content identities
    - compatible assertions share one exact environment capture while incompatible isolation contracts remain separate
    - proposition freshness is explicit and no release uses a global no-reuse switch except governed independent calibration
    - unknown path ownership broadens impact selection and fails governance until classified
    - verification workers consume one immutable context digest and upload content-addressed objects plus execution manifests
    - executable context ABI 3 binds the controller commit tracked worktree complete control plane implementation file set and at least one target-version-matching Factorio installation lock and rejects any later checkout drift
    - native adapters stage context candidate bytes under the exact Factorio info json archive name while preserving and rechecking the immutable archive digest
    - new-candidate context materialization captures an explicitly selected Factorio binary and complete official data identity on a protected self-hosted runner emits a path-independent composite lock retains path-bound v4 identities only as matching aliases and requires native workers to match that immutable lock before observation capture while process local full scan reuse remains exact key bound
    - producer evaluator and canonicalization revocation may invalidate derived evaluations without discarding sound observations
    - v5 toolchain admission requires exact C24 historical verdict equivalence P9 pending verdict parity and one fresh independent C24 calibration pass
    - non calibration releases inherit only an accepted per target cutover whose exact fresh calibration proof is context locked unrevoked ABI identical and ancestral to the current control plane while P9 remains target local
    - P9 operational shadow cutover requires exact admitted outcome and seal evidence and never treats pending parity as release proof
    - P9 qualification may use the governed integration commit or a clean descendant only while the complete package source fingerprint remains frozen
    - fresh C24 calibration executes every planned TaskNode and exact environment batch under one immutable context and emits one compact proof only after unambiguous evidence closure
    - release history integrity executes against the current governance checkout because the frozen package source predates its tag and distribution inventory while candidate bytes remain separately package locked
    - assurance plans use stable test and matrix instance IDs complete effective inputs package domains and target profiles
    - release records own release-specific upgrade baseline target and fixture authority which context materialization projects over the stable target-line engine profile and binds by exact staged profile digest
    - approved delta and performance authorities are selected by exact release candidate and baseline identity so historical calibration and active qualification coexist without mutable authority replacement
    - passing evidence is reusable only under exact trust-class-matched schema 4 fingerprints structured results artifact hashes and result digests
    - canonical plan result capsule bundle and seal JSON schemas live under spec/schemas and are bound into the verifier release fingerprint
    - matching workers are adopted through explicit process or CI-job leases bound to host identity process incarnation trust class and expiry and duplicate fingerprint work is never cancelled in progress
    - the aggregate verification gate requires exact evidence for every planned instance and never trusts mutable job status
    - Factorio gameplay scenarios depend on declared package domains while exact package load and upgrade lanes depend on exact archives
    - candidate seals bind the stable candidate ID immutable package-source commit later qualification-source commit unchanged package roots and exact qualified bytes without publishing
    - native-owner balance snapshots bind reviewed source values formula adapters planner bindings and emission transactions
    - portable museum compilation and catalog validation require no historical installation and emit finite target-era Lua with an explicit target-matching info.json factorio_version
    - exact museum runtime validation resolves tracked installation IDs through local or protected-runner configuration and binds exact binary and base-data fingerprints
    - museum target selection resolves canonical feature IDs from .mir/canonical-lower-features.json and cannot own an independent feature list
    - museum target packages contain no compiler tooling manifests evidence fixtures or modern runtime source
    - each museum technology is emitted from a stable manifest row and a matching-base effect proof
    - the facade preserves its public parameters and structured result schema
    - process launch and copied-mod filesystem safety are reusable modules
    - settings overrides are declarative and isolated from scenario orchestration
    - every executed scenario resolves through a target-bound declaration record
    - compatibility campaign records own setup roots settings expectations timeout and claim level
    - normalized approved deltas bind exact package and producer fingerprints and reject unclassified technology registry setting runtime namespace or migration drift
    - v5 native patch-delta observations separate exact ZIP entry capture from versioned pure policy evaluation and bind the evaluated candidate rather than a superseded release-ledger row
    - v5 performance execution uses source-side measurement code with a context-addressed controller-authority overlay, deterministic UTF-8 LF probe materialization, an exact overlay manifest, and an unchanged immutable package-source fingerprint
    - v5 Factorio performance execution uses a fresh context-bound compact scratch root within a conservative path budget, then verifies and relocates raw artifacts into the context-addressed evidence tree
    - compatibility-audit performance lanes defer output-directory materialization until governed artifact emission, and historical-source overlays bind the exact controller audit bytes and both runner families in the path budget
    - the registered assurance-full workflow path delegates every exact protected input to the reusable canonical Control Plane v5 workflow on the selected ref
    - repository-wide validation enumerates tracked and non-ignored untracked governed files and cannot treat ignored control-plane staging clones as repository source
    - full and backport seals require exact-candidate runtime performance evidence and package-focused manual review attestations
    - every Factorio-supported locale is generated from source-hash-bound translation memory and must preserve placeholders rich-text order prose budgets and target-script expectations
    - offline rule synthesis searches only the finite predicate authority and emits review-required non-production proposals
    - semantic mod interaction graphs route independent pairs to composition smoke and overlapping pairs to narrow delta campaigns
    - scenarios retain stable names and explicit groups while decomposition proceeds
